<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>رفيق - الأشكال</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:"Tahoma","Arial",sans-serif;

    direction:rtl;

}

body{

    color:#173d68;

    background:#e4f2ff;

}


/* =====================================================
   PAGE
   التصميم الأساسي = 1024 × 1366
===================================================== */

.page{

    position:absolute;

    width:1024px;
    height:1366px;

    left:50%;
    top:50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin:center center;

    overflow:hidden;

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    visibility:hidden;

}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button{

    position:absolute;

    top:20px;
    left:20px;

    width:58px;
    height:52px;

    border:none;

    border-radius:19px;

    background:#e4f2ff;

    color:#173d68;

    font-size:30px;

    font-weight:900;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 6px 16px
        rgba(55,104,140,.18);

    cursor:pointer;

    z-index:1000;

    transition:.2s ease;

}

.previous-button:active{

    transform:scale(.92);

}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button{

    position:absolute;

    top:20px;
    right:20px;

    width:58px;
    height:52px;

    border:none;

    border-radius:19px;

    background:#e4f2ff;

    color:#173d68;

    font-size:27px;

    font-weight:900;

    box-shadow:
        0 6px 16px
        rgba(55,104,140,.18);

    cursor:pointer;

    z-index:1000;

    transition:.2s ease;

}

.menu-button:active{

    transform:scale(.92);

}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu{

    position:absolute;

    top:82px;
    right:20px;

    width:220px;

    padding:17px;

    background:rgba(255,255,255,.97);

    border-radius:24px;

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.18);

    display:none;

    z-index:1100;

}

.side-menu.show{

    display:block;

    animation:
        menuIn
        .22s
        ease;

}

@keyframes menuIn{

    from{

        opacity:0;

        transform:
            translateY(-8px)
            scale(.96);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

.side-menu button{

    height:50px;

    margin-bottom:10px;

    border:none;

    border-radius:16px;

    background:#e4f2ff;

    color:#173d68;

    font-family:inherit;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

}

.side-menu button:last-child{

    margin-bottom:0;

}


/* =====================================================
   MAIN CONTENT
===================================================== */

.content{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:20;

    pointer-events:none;

}


/* =====================================================
   TITLE
===================================================== */

.title-row{

    position:absolute;

    top:72px;

    left:50%;

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    direction:rtl;

    pointer-events:auto;

}

.title{

    margin:0;

    color:#173d68;

    font-size:42px;

    font-weight:900;

    text-shadow:

}


/* =====================================================
   SOUND BUTTON
===================================================== */

.sound-button{

    width:58px;

    height:58px;

    border:none;

    border-radius:50%;

    background:#e4f2ff;

    color:#397bab;

    font-size:29px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(55,104,140,.18);

    transition:.2s ease;

}

.sound-button:active{

    transform:scale(.88);

    background:#cce8fb;

}

.sound-button.speaking{

    animation:
        speakerPulse
        .7s
        ease-in-out
        infinite;

}

@keyframes speakerPulse{

    0%,
    100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.12);

    }

}


/* =====================================================
   SHAPE
===================================================== */

.shape-area{

    position:absolute;

    top:155px;

    left:50%;

    transform:
        translateX(-50%);

    width:330px;

    height:330px;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:auto;

}

.shape-image{

    width:330px;

    height:330px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 12px 18px
            rgba(40,80,110,.18)
        );

    animation:
        circleFloat
        2.8s
        ease-in-out
        infinite;

    transition:.25s ease;

}


/* =====================================================
   CIRCLE MOVEMENT
===================================================== */

@keyframes circleFloat{

    0%,
    100%{

        transform:
            translateY(0)
            scale(1)
            rotate(-2deg);

    }

    50%{

        transform:
            translateY(-12px)
            scale(1.035)
            rotate(2deg);

    }

}


/* =====================================================
   CHILD AREA
===================================================== */

.child-area{

    position:absolute;

    left:-10px;

    bottom:-95px;

    width:900px;

    height:900px;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    z-index:30;

/* =====================================================
   CHILD
===================================================== */

.child{

    height:1000px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 14px 18px
            rgba(40,80,110,.25)
        );

    user-select:none;

    pointer-events:none;

    animation:none;

    transform:none;

}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next-button{

    position:absolute;

    right:25px;

    bottom:20px;

    min-width:145px;

    height:57px;

    border:none;

    border-radius:20px;

    background:#e4f2ff;

    color:#173d68;

    font-family:inherit;

    font-size:20px;

    font-weight:900;

    box-shadow:

        rgba(55,104,140,.17);

    cursor:pointer;

    z-index:500;

    transition:.2s ease;

}

.next-button:active{

    transform:scale(.94);

</style>

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_m6n2gJXfPnu_Ns6LV-jxhg_cHa00bj6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const page =
    document.getElementById(
        "page"
    );

const childImage =
    document.getElementById(
        "childImage"
    );

const soundButton =
    document.getElementById(
        "soundButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const menuButton =
    document.getElementById(
        "menuButton"
    );

const sideMenu =
    document.getElementById(
        "sideMenu"
    );

const previousButton =
    document.getElementById(
        "previousButton"
    );


/* =====================================================
   RESPONSIVE PAGE SCALE
===================================================== */

function resizePage(){

    const baseWidth = 1024;

    const baseHeight = 1366;


    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;


    const scale =
        Math.min(
            scaleX,
            scaleY
        );


    page.style.setProperty(
        "--page-scale",
        scale
    );

}


/* =====================================================
   INITIAL SCALE
===================================================== */

resizePage();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    resizePage
);


/* =====================================================
   ORIENTATION CHANGE
===================================================== */

window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            function(){

                resizePage();

            },
            300
        );

    }
);


/* =====================================================
   MENU
===================================================== */

menuButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        sideMenu.classList.toggle(
            "show"
        );

    }
);


document.addEventListener(
    "click",
    function(event){

        if(
            !sideMenu.contains(
                event.target
            ) &&
            event.target !== menuButton
        ){

            sideMenu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   PREVIOUS
===================================================== */

previousButton.addEventListener(
    "click",
    function(){

        location.href =
            "games.html";

    }
);


/* =====================================================
   CURRENT CHILD
===================================================== */

const childId =
    localStorage.getItem(
        "rafiqChildId"
    );


console.log(
    "Shapes - Current Child ID:",
    childId
);


/* =====================================================
   THEME
===================================================== */

let interest = null;


/* =====================================================
   IMAGE LOADER
===================================================== */

function waitForImage(src){

    return new Promise(
        function(resolve){

            const img =
                new Image();


            img.onload =
                function(){

                    resolve(true);

                };


            img.onerror =
                function(){

                    console.warn(
                        "Image failed to load:",
                        src
                    );

                    resolve(false);

                };


            img.src =
                src;

        }
    );

}


/* =====================================================
   NORMALIZE INTEREST
===================================================== */

function normalizeInterest(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    /* ARRAY */

    if(
        Array.isArray(value)
    ){

        if(
            value.length === 0
        ){

            return "";

        }

        return normalizeInterest(
            value[0]
        );

    }


    /* OBJECT */

    if(
        typeof value === "object"
    ){

        if(
            value.interest !== undefined
        ){

            return normalizeInterest(
                value.interest
            );

        }

        if(
            value.value !== undefined
        ){

            return normalizeInterest(
                value.value
            );

        }

        return "";

    }


    /* STRING */

    let text =
        String(value)
        .trim();


    if(
        text === ""
    ){

        return "";

    }


    /*
       JSON ARRAY / OBJECT
    */

    if(
        (
            text.startsWith("[") &&
            text.endsWith("]")
        ) ||
        (
            text.startsWith("{") &&
            text.endsWith("}")
        )
    ){

        try{

            const parsed =
                JSON.parse(text);

            return normalizeInterest(
                parsed
            );

        }

        catch(error){

            console.warn(
                "Could not parse interest:",
                text
            );

        }

    }


    /*
       إزالة علامات الاقتباس
    */

    text =
        text
        .replace(/["']/g, "")
        .trim()
        .toLowerCase();


    return text;

}


/* =====================================================
   DETECT INTEREST
===================================================== */

function detectInterest(value){

    const normalized =
        normalizeInterest(value);


    console.log(
        "Normalized interest:",
        normalized
    );


    /* =================================================
       SPACE
    ================================================= */

    if(
        normalized === "فضاء" ||
        normalized === "الفضاء" ||
        normalized === "space"
    ){

        return "فضاء";

    }


    /* =================================================
       CARS
    ================================================= */

    if(
        normalized === "سيارات" ||
        normalized === "سيارة" ||
        normalized === "السيارات" ||
        normalized === "car" ||
        normalized === "cars"
    ){

        return "سيارات";

    }


    /*
       إذا كانت القيمة تحتوي على الكلمة
    */

    if(
        normalized.includes("فضاء") ||
        normalized.includes("space")
    ){

        return "فضاء";

    }


    if(
        normalized.includes("سيار") ||
        normalized.includes("car")
    ){

        return "سيارات";

    }


    return "";

}


/* =====================================================
   APPLY PERSONALIZATION
===================================================== */

function applyPersonalization(){

    /* =================================================
       SPACE
    ================================================= */

    if(
        interest === "فضاء"
    ){

        page.style.backgroundImage =
            "url('images/spao.jpeg')";

        childImage.src =
            "images/ad2.png";

        childImage.alt =
            "طفل مع الفضاء";


        console.log(
            "Shapes Theme: SPACE"
        );


        return;

    }


    /* =================================================
       CARS
    ================================================= */

    if(
        interest === "سيارات"
    ){

        page.style.backgroundImage =
            "url('images/car4.jpeg')";

        childImage.src =
            "images/ad3.png";

        childImage.alt =
            "طفل مع السيارات";


        console.log(
            "Shapes Theme: CAR"
        );


        return;

    }


    /* =================================================
       FALLBACK
    ================================================= */

    interest =
        "سيارات";


    page.style.backgroundImage =
        "url('images/car4.jpeg')";

    childImage.src =
        "images/ad3.png";

    childImage.alt =
        "طفل مع السيارات";

}


/* =====================================================
   SHOW PAGE
===================================================== */

async function showPageAfterTheme(){

    let backgroundSrc;

    let childSrc;


    if(
        interest === "فضاء"
    ){

        backgroundSrc =
            "images/spao.jpeg";

        childSrc =
            "images/ad2.png";

    }

    else{

        backgroundSrc =
            "images/car4.jpeg";

        childSrc =
            "images/ad3.png";

    }


    await Promise.all([

        waitForImage(
            backgroundSrc
        ),

        waitForImage(
            childSrc
        )

    ]);


    applyPersonalization();


    resizePage();


    page.style.visibility =
        "visible";


    console.log(
        "Shapes page ready:",
        interest
    );

}


/* =====================================================
   LOAD LOCAL INTEREST
===================================================== */

function getLocalInterest(){

    /*
       المفاتيح المحتملة
       حتى لو كانت الصفحة القديمة
       تستخدم اسمًا مختلفًا.
    */

    const possibleKeys = [

        "rafiqInterest",

        "childInterest",

        "selectedInterest",

        "interest",

        "favoriteInterest",

        "rafiqChildInterest",

        "interests"

    ];


    for(
        const key of possibleKeys
    ){

        try{

            const value =
                localStorage.getItem(
                    key
                );


            if(
                value === null ||
                value === ""
            ){

                continue;

            }


            console.log(
                "LocalStorage:",
                key,
                value
            );


            const detected =
                detectInterest(
                    value
                );


            if(
                detected
            ){

                console.log(
                    "LocalStorage interest detected:",
                    detected
                );


                return detected;

            }

        }

        catch(error){

            console.warn(
                "LocalStorage read error:",
                error
            );

        }

    }


    return "";

}


/* =====================================================
   LOAD CHILD INTEREST
   SUPABASE FIRST
   LOCAL STORAGE BACKUP
===================================================== */

async function loadChildInterest(){

    console.log(
        "================================"
    );

    console.log(
        "Starting interest detection"
    );

    console.log(
        "================================"
    );


    /*
       نقرأ LocalStorage مسبقًا
       كنسخة احتياطية.
    */

    const localInterest =
        getLocalInterest();


    console.log(
        "Local backup:",
        localInterest || "NONE"
    );


    /* =================================================
       NO CHILD ID
    ================================================= */

    if(
        !childId
    ){

        console.warn(
            "لا يوجد rafiqChildId."
        );


        if(
            localInterest
        ){

            interest =
                localInterest;


            console.log(
                "Using LocalStorage:",
                interest
            );

        }

        else{

            interest =
                "سيارات";


            console.log(
                "Using default:",
                interest
            );

        }


        await showPageAfterTheme();

        return;

    }


    /* =================================================
       SUPABASE
    ================================================= */

    try{

        console.log(
            "Checking Supabase..."
        );


        const {
            data,
            error
        } =
        await supabaseClient

            .from("children")

            .select(
                "id, interests"
            )

            .eq(
                "id",
                childId
            )

            .maybeSingle();


        /* =================================================
           SUPABASE ERROR
        ================================================= */

        if(
            error
        ){

            console.error(
                "Supabase Error:",
                error
            );


            if(
                localInterest
            ){

                interest =
                    localInterest;


                console.log(
                    "Fallback → LocalStorage:",
                    interest
                );

            }

            else{

                interest =
                    "سيارات";


                console.log(
                    "Fallback → Default:",
                    interest
                );

            }


            await showPageAfterTheme();

            return;

        }


        /* =================================================
           NO CHILD
        ================================================= */

        if(
            !data
        ){

            console.warn(
                "Child not found in Supabase."
            );


            if(
                localInterest
            ){

                interest =
                    localInterest;


                console.log(
                    "Fallback → LocalStorage:",
                    interest
                );

            }

            else{

                interest =
                    "سيارات";


                console.log(
                    "Fallback → Default:",
                    interest
                );

            }


            await showPageAfterTheme();

            return;

        }


        /* =================================================
           SUPABASE DATA
        ================================================= */

        console.log(
            "Supabase child data:",
            data
        );


        console.log(
            "Supabase interests:",
            data.interests
        );


        const supabaseInterest =
            detectInterest(
                data.interests
            );


        /* =================================================
           VALID SUPABASE INTEREST
        ================================================= */

        if(
            supabaseInterest
        ){

            interest =
                supabaseInterest;


            console.log(
                "Using Supabase:",
                interest
            );


            /*
               حفظ آخر قيمة صحيحة محليًا
            */

            try{

                localStorage.setItem(
                    "rafiqInterest",
                    interest
                );


                console.log(
                    "Saved interest to LocalStorage:",
                    interest
                );

            }

            catch(error){

                console.warn(
                    "Could not save LocalStorage:",
                    error
                );

            }

        }


        /* =================================================
           SUPABASE EMPTY → LOCAL
        ================================================= */

        else if(
            localInterest
        ){

            interest =
                localInterest;


            console.log(
                "Supabase interest empty."
            );


            console.log(
                "Using LocalStorage backup:",
                interest
            );

        }


        /* =================================================
           NOTHING FOUND
        ================================================= */

        else{

            interest =
                "سيارات";


            console.log(
                "No valid interest found."
            );


            console.log(
                "Using default:",
                interest
            );

        }


        /* =================================================
           SHOW
        ================================================= */

        await showPageAfterTheme();

    }

    catch(error){

        console.error(
            "Unexpected interest error:",
            error
        );


        /* =================================================
           LOCAL STORAGE BACKUP
        ================================================= */

        if(
            localInterest
        ){

            interest =
                localInterest;


            console.log(
                "Exception → LocalStorage:",
                interest
            );

        }

        else{

            interest =
                "سيارات";


            console.log(
                "Exception → Default:",
                interest
            );

        }


        await showPageAfterTheme();

    }

}


/* =====================================================
   START PERSONALIZATION
===================================================== */

loadChildInterest();


/* =====================================================
   SPEECH
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "ar-SA";


    utterance.rate =
        0.82;


    utterance.pitch =
        1.05;


    utterance.volume =
        1;


    utterance.onstart =
        function(){

            soundButton.classList.add(
                "speaking"
            );

        };


    utterance.onend =
        function(){

            soundButton.classList.remove(
                "speaking"
            );

        };


    utterance.onerror =
        function(){

            soundButton.classList.remove(
                "speaking"
            );

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   SPEAK SHAPE
===================================================== */

function speakShape(){

    speak(
        "دائرة"
    );

}


/* =====================================================
   SOUND BUTTON
===================================================== */

soundButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        speakShape();

    }
);


/* =====================================================
   AUTO SPEECH
===================================================== */

setTimeout(
    function(){

        speakShape();

    },
    600
);


/* =====================================================
   FIRST IPAD INTERACTION
===================================================== */

let firstInteraction =
    false;


document.addEventListener(
    "touchstart",
    function(){

        if(
            !firstInteraction
        ){

            firstInteraction =
                true;


            setTimeout(
                function(){

                    speakShape();

                },
                150
            );

        }

    },
    {
        passive:true,
        once:true
    }
);


/* =====================================================
   NEXT
===================================================== */

nextButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "shapes-activities.html";

    }
);


/* =====================================================
   PRELOAD IMAGES
===================================================== */

const preloadImages = [

    "images/adaa.png",

    "images/ad3.png",

    "images/ad2.png",

    "images/car4.jpeg",

    "images/spao.jpeg"

];


preloadImages.forEach(
    function(src){

        const image =
            new Image();

        image.src =
            src;

    }
);

</script>
