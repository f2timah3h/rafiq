<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    font-family:

        sans-serif;

    color: #555;

    overflow: hidden;

/* =====================================================
   FIXED PAGE SCALE
===================================================== */

.page {

    position: absolute;

    width: 1024px;

    height: 1366px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin: center center;

    overflow: hidden;

    z-index: 5;

    padding:
        115px 35px 180px;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {

    position: absolute;

    inset: 0;

    width: 1024px;

    height: 1366px;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;

    background-image:
        url("images/play.jpeg");

    background-size: 100% auto;

    background-position:
        center bottom;

    background-repeat: no-repeat;
}


/* Clouds */

.cloud {

    position: absolute;

    color: #ffffff;

    font-size: 90px;

    opacity: .55;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(100,150,180,.08)
        );

    animation:
        cloudFloat 5s ease-in-out infinite;
}

.cloud-one {

    top: 120px;

    left: 45px;
}

.cloud-two {

    top: 230px;

    right: 35px;

    animation-delay: 1.5s;
}

.cloud-three {

    top: 690px;

    left: 15px;

    font-size: 75px;

    animation-delay: 2s;
}

.cloud-four {

    top: 720px;

    right: 20px;

    font-size: 75px;

    animation-delay: 1s;
}


@keyframes cloudFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-10px);
    }
}


/* Stars */

.star {

    position: absolute;

    color: #f6d66b;

    font-size: 28px;

    animation:
        starTwinkle 2.5s ease-in-out infinite;
}

.star-one {

    top: 250px;

    left: 95px;
}

.star-two {

    top: 310px;

    right: 90px;

    animation-delay: .8s;
}

.star-three {

    top: 600px;

    left: 70px;

    animation-delay: 1.2s;
}

.star-four {

    top: 650px;

    right: 65px;

    animation-delay: 1.8s;
}


@keyframes starTwinkle {

    0%,
    100% {

        opacity: .4;

        transform:
            scale(.9);
    }

    50% {

        opacity: 1;

        transform:
            scale(1.15);
    }
}


/* =====================================================

===================================================== */

<script>


/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_m6m2gJXfPnu_Ns6LV-jxhg_cHa00bj6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const SETTINGS_KEY = "rafiq_parent_controls";


/* =====================================================
   PAGE SCALE
===================================================== */

const page =
    document.getElementById("page");


function resizePage() {

    const baseWidth = 1024;

    const baseHeight = 1366;

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    page.style.setProperty(
        "--page-scale",
        scale
    );

}


resizePage();


window.addEventListener(
    "resize",
    resizePage
);


window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    if (menu) {

        menu.classList.toggle(
            "show"
        );

    }

}


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );

        if (
            menu &&
            button &&
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goBack() {

    window.location.href =
        "home.html";

}


function goHome() {

    window.location.href =
        "home.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}


function goProgress() {

    alert(
        "⭐ صفحة تقدمي\n\nسنصممها لاحقًا."
    );

}


/* =====================================================
   PARENT SETTINGS
===================================================== */

function getParentSettings() {

    const saved =
        localStorage.getItem(
            SETTINGS_KEY
        );

    if (!saved) {

        return null;

    }

    try {

        return JSON.parse(
            saved
        );

    } catch (error) {

        console.error(
            "خطأ في قراءة إعدادات الوالدين:",
            error
        );

        return null;

    }

}


/* =====================================================
   APPLY GAME SETTINGS
===================================================== */

function applyParentGameControls() {

    const settings =
        getParentSettings();


    if (!settings) {

        return;

    }


    if (
        settings.sections &&
        settings.sections.games === false
    ) {

        window.location.href =
            "home.html";

        return;

    }


    const games =
        settings.activities &&
        settings.activities.games
            ? settings.activities.games
            : {};


    const colors =
        document.querySelector(
            ".colors-card"
        );

    if (
        colors &&
        games.colors === false
    ) {

        colors.style.display =
            "none";

    }


    const shapes =
        document.querySelector(
            ".shapes-card"
        );

    if (
        shapes &&
        games.shapes === false
    ) {

        shapes.style.display =
            "none";

    }


    const situations =
        document.querySelector(
            ".situations-card"
        );

    if (
        situations &&
        games.social === false
    ) {

        situations.style.display =
            "none";

    }


    const communication =
        document.querySelector(
            ".social-card"
        );

    if (
        communication &&
        games.communication === false
    ) {

        communication.style.display =
            "none";

    }


    const challenges =
        document.querySelector(
            ".routine-card"
        );

    if (
        challenges &&
        games.challenges === false
    ) {

        challenges.style.display =
            "none";

    }


    const letters =
        document.querySelector(
            ".letters-card"
        );

    if (
        letters &&
        games.letters === false
    ) {

        letters.style.display =
            "none";

    }

}


/* =====================================================
   CHECK GAME
===================================================== */

function isGameEnabled(gameName) {

    const settings =
        getParentSettings();

    if (!settings) {

        return true;

    }


    if (
        settings.sections &&
        settings.sections.games === false
    ) {

        return false;

    }


    if (
        !settings.activities ||
        !settings.activities.games
    ) {

        return true;

    }


    return (
        settings.activities.games[gameName] !== false
    );

}


/* =====================================================
   SHAPES PERSONALIZATION
   فتح صفحة الأشكال حسب اهتمام الطفل
===================================================== */

async function openShapesByInterest() {

    /* -----------------------------------------
       التحقق من أن لعبة الأشكال مفعلة
    ----------------------------------------- */

    if (!isGameEnabled("shapes")) {

        return;

    }


    /* -----------------------------------------
       الحصول على ID الطفل الحالي
    ----------------------------------------- */

    const childId =
        localStorage.getItem(
            "rafiqChildId"
        );


    /* -----------------------------------------
       إذا لم يوجد طفل مسجل
    ----------------------------------------- */

    if (!childId) {

        console.warn(
            "لا يوجد rafiqChildId"
        );

        return;

    }


    try {

        /* -----------------------------------------
           جلب اهتمام الطفل من Supabase
        ----------------------------------------- */

        const {
            data,
            error
        } =
        await supabaseClient

            .from("children")

            .select("interests")

            .eq(
                "id",
                childId
            )

            .maybeSingle();


        /* -----------------------------------------
           في حال وجود خطأ
        ----------------------------------------- */

        if (error) {

            console.error(
                "خطأ في جلب اهتمام الطفل:",
                error
            );

            return;

        }


        /* -----------------------------------------
           قراءة الاهتمام
        ----------------------------------------- */

        const interest =
            String(
                data?.interests || ""
            ).trim();


        console.log(
            "🎯 اهتمام الطفل:",
            interest
        );


        /* =========================================
           فضاء
        ========================================= */

        if (
            interest === "فضاء"
        ) {

            window.location.href =
                "./shapes-space.html";

            return;

        }


        /* =========================================
           سيارات
        ========================================= */

        if (
            interest === "سيارات"
        ) {

            window.location.href =
                "./shapes-cars.html";

            return;

        }


        /* -----------------------------------------
           إذا كانت القيمة غير معروفة
        ----------------------------------------- */

        console.warn(
            "اهتمام الطفل غير معروف:",
            interest
        );

    }

    catch (error) {

        console.error(
            "حدث خطأ أثناء جلب اهتمام الطفل:",
            error
        );

    }

}

/* =====================================================
   OPEN GAME
===================================================== */

function openGame(game) {

    if (!isGameEnabled(game)) {

        return;

    }


    if (game === "colors") {

        window.location.href =
            "./colors.html";

    }

    else if (game === "shapes") {

        openShapesByInterest();

    }

    else if (game === "social situations") {

        window.location.href =
            "./social.html";

    }

    else if (game === "social") {

        window.location.href =
            "./communication.html";

    }

    else if (game === "routine") {

        window.location.href =
            "./challenges_combined.html";

    }

    else if (game === "letters") {

        window.location.href =
            "./letter-number.html";

    }

}


/* =====================================================
   PARENT ACTIVITIES
===================================================== */

function getParentActivities() {

    const settings =
        getParentSettings();

    if (!settings) {

        return [];

    }


    if (
        settings.sections &&
        settings.sections.games === false
    ) {

        return [];

    }


    const activities =
        Array.isArray(
            settings.customActivities
        )
            ? settings.customActivities
            : [];


    return activities.filter(
        function(activity) {

            return (
                activity &&
                activity.enabled !== false
            );

        }
    );

}


/* =====================================================
   PARENT BUTTON
===================================================== */

function updateParentButton() {

    const button =
        document.getElementById(
            "parentActivitiesButton"
        );

    if (!button) {

        return;

    }


    const activities =
        getParentActivities();


    if (activities.length > 0) {

        button.style.display =
            "block";

    } else {

        button.style.display =
            "none";

    }

}


/* =====================================================
   OPEN PARENT PANEL
===================================================== */

function openParentPanel() {

    const activities =
        getParentActivities();

    const panel =
        document.getElementById(
            "parentPanel"
        );

    const list =
        document.getElementById(
            "parentList"
        );


    if (
        !panel ||
        !list ||
        activities.length === 0
    ) {

        return;

    }


    list.innerHTML =
        "";


    activities.forEach(
        function(activity) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "parent-card";


            const title =
                document.createElement(
                    "h2"
                );

            title.className =
                "parent-card-title";

            title.textContent =
                activity.name ||
                "نشاط من الوالدين";


            card.appendChild(
                title
            );


            if (
                activity.type &&
                activity.type.indexOf(
                    "image/"
                ) === 0
            ) {

                const image =
                    document.createElement(
                        "img"
                    );

                image.src =
                    activity.data;

                image.alt =
                    activity.name ||
                    "نشاط من الوالدين";

                card.appendChild(
                    image
                );

            } else {

                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "parent-file-icon";

                icon.textContent =
                    "📄";

                card.appendChild(
                    icon
                );

            }


            card.onclick =
                function() {

                    openParentActivity(
                        activity
                    );

                };


            list.appendChild(
                card
            );

        }
    );


    panel.classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE PARENT PANEL
===================================================== */

function closeParentPanel() {

    const panel =
        document.getElementById(
            "parentPanel"
        );

    if (panel) {

        panel.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   OPEN PARENT ACTIVITY
===================================================== */

function openParentActivity(
    activity
) {

    if (!activity) {

        return;

    }


    if (
        activity.type &&
        activity.type.indexOf(
            "image/"
        ) === 0
    ) {

        const newWindow =
            window.open(
                "",
                "_blank"
            );


        if (!newWindow) {

            alert(
                "السماح بفتح النوافذ الجديدة مطلوب."
            );

            return;

        }


        newWindow.document.body.style.margin =
            "0";

        newWindow.document.body.style.minHeight =
            "100vh";

        newWindow.document.body.style.display =
            "flex";

        newWindow.document.body.style.alignItems =
            "center";

        newWindow.document.body.style.justifyContent =
            "center";

        newWindow.document.body.style.background =
            "#ffffff";


        const image =
            newWindow.document.createElement(
                "img"
            );

        image.src =
            activity.data;

        image.style.maxWidth =
            "95vw";

        image.style.maxHeight =
            "95vh";

        image.style.objectFit =
            "contain";


        newWindow.document.body.appendChild(
            image
        );

        return;

    }


    if (activity.data) {

        const newWindow =
            window.open(
                activity.data,
                "_blank"
            );


        if (!newWindow) {

            alert(
                "السماح بفتح النوافذ الجديدة مطلوب."
            );

        }

    }

}

document.addEventListener(

        applyParentGameControls();

        updateParentButton();

    }
);
