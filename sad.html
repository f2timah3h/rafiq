<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>الحزن - رفيق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    direction: rtl;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color: #263746;

    background-color: #ffffff;

    position: relative;

    touch-action: manipulation;
}


/* =========================
   PAGE
   FIXED 1024 × 1366
========================= */

.page {

    position: absolute;

    width: 1024px;
    height: 1366px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin: center center;

    overflow: hidden;

    background-color: #ffffff;

    background-image:
        url("images/backh.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}


/* =========================
   TOP BAR
========================= */

.top-bar {

    width: 100%;

    max-width: 950px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: relative;

    z-index: 20;

    padding-top: 45px;
}


/* =========================
   MENU
========================= */

.menu-container {

    position: relative;

    order: 1;
}


.menu-button {

    width: 62px;

    height: 62px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.42);

    color: #30465b;

    font-size: 29px;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(50,70,90,0.12);

    transition:
        transform 0.2s ease;
}


.menu-button:hover {

    transform: scale(1.08);
}


/* =========================
   DROPDOWN MENU
========================= */

.menu {

    display: none;

    position: absolute;

    top: 72px;

    left: 0;

    width: 215px;

    background:
        rgba(255,255,255,0.96);

    border-radius: 22px;

    padding: 12px;

    box-shadow:
        0 10px 30px
        rgba(50,70,90,0.18);

    z-index: 100;
}


.menu.show {

    display: block;
}


.menu a {

    display: block;

    text-decoration: none;

    color: #30465b;

    font-size: 21px;

    font-weight: 600;

    padding: 15px 18px;

    border-radius: 14px;

    margin: 4px 0;

    text-align: right;

    transition:
        background 0.2s ease;
}


.menu a:hover {

    background: #e4f2ff;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {

    order: 2;

    width: 62px;

    height: 62px;

    border: none;

    background: transparent;

    color: #30465b;

    font-size: 45px;

    line-height: 1;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        transform 0.2s ease;
}


.back-button:hover {

    transform: scale(1.12);
}


/* =========================
   TITLE
========================= */

.title {

    margin-top: 22px;

    margin-bottom: 0;

    font-size: 48px;

    font-weight: 700;

    color: #263746;

    text-align: center;
}


/* =========================
   SOUND BUTTON
========================= */

.sound-button {

    position: absolute;

    top: 145px;

    right: 105px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.40);

    font-size: 32px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 5px 15px
        rgba(50,70,90,0.10);

    transition:
        transform 0.2s ease;
}


.sound-button:hover {

    transform: scale(1.08);
}


.sound-button:active {

    transform: scale(0.94);
}


/* =========================
   SAD CHARACTER
========================= */

.character-area {

    margin-top: 20px;

    width: 100%;

    height: 280px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}


.sad-character {

    width: 255px;

    object-fit: contain;

    animation:
        sadMovement 3.5s
        ease-in-out
        infinite;
}


/* =========================
   SAD ANIMATION
========================= */

@keyframes sadMovement {

    0% {

        transform:
            translateY(0)
            rotate(0deg);
    }

    20% {

        transform:
            translateY(7px)
            rotate(1deg);
    }

    40% {

        transform:
            translateY(13px)
            rotate(2deg);
    }

    55% {

        transform:
            translateY(7px)
            rotate(1deg);
    }

    70% {

        transform:
            translateY(0)
            rotate(0deg);
    }

    100% {

        transform:
            translateY(0)
            rotate(0deg);
    }
}


/* =========================
   DESCRIPTION
========================= */

.description {

    width: 90%;

    max-width: 720px;

    margin: 0 auto;

    text-align: center;

    font-size: 24px;

    line-height: 2;

    font-weight: 600;

    color: #263746;
}


/* =========================
   LEVEL TITLE
========================= */

.level-title {

    margin-top: 85px;

    margin-bottom: 18px;

    font-size: 28px;

    font-weight: bold;

    color: #263746;

    text-align: center;
}


/* =========================
   SADNESS SCALE IMAGE
========================= */

.happiness-scale {

    width: 520px;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: center;
}


.happiness-image {

    width: 100%;

    max-width: 520px;

    height: auto;

    object-fit: contain;

    display: block;
}


/* =========================
   NEXT BUTTON
========================= */

.next-button {

    display: block;

    margin: 42px auto 0 auto;

    border: none;

    background: #e4f2ff;

    color: #30465b;

    font-size: 24px;

    font-weight: bold;

    padding: 15px 55px;

    border-radius: 22px;

    cursor: pointer;

    text-align: center;

    box-shadow:
        0 6px 15px
        rgba(50,80,100,0.12);

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}


.next-button:hover {

    transform: translateY(-3px);

    background: #d8edff;
}

</style>

</head>


<body>

<div class="page">


    <!-- =========================
         TOP BAR
    ========================== -->

    <div class="top-bar">


        <!-- القائمة -->

        <div class="menu-container">

            <button
                class="menu-button"
                onclick="toggleMenu()">

                ☰

            </button>


            <div
                class="menu"
                id="menu">

                <a href="home.html">
                    🏠 الرئيسية
                </a>

                <a href="profile.html">
                    👤 ملفي
                </a>

                <a href="reports.html">
                    📊 تقاريري
                </a>

            </div>

        </div>


        <!-- السابق -->

        <button
            class="back-button"
            onclick="goBack()">

            ›

        </button>

    </div>


    <!-- =========================
         TITLE
    ========================== -->

    <h1 class="title">

        الحزن

    </h1>


    <!-- =========================
         SOUND
    ========================== -->

    <button
        class="sound-button"
        onclick="speakSadness()"
        aria-label="استمع">

        🔊

    </button>


    <!-- =========================
         SAD CHARACTER
    ========================== -->

    <div class="character-area">

        <img
            src="images/sad.png"
            alt="طفلة حزينة"
            class="sad-character">

    </div>


    <!-- =========================
         DESCRIPTION
    ========================== -->

    <div class="description">

        الحزن يشبه غيمة رمادية

        تمر في السماء

        <br>

        وتغطي الشمس لفترة وتجعلنا نرغب في البكاء كالمطر

        لكن تذكر دائماً.. خلف كل غيمة، الشمس ما زالت موجودة وستشرق من جديد

    </div>


    <!-- =========================
         LEVEL TITLE
    ========================== -->

    <div class="level-title">

        درجات الحزن

    </div>


    <!-- =========================
         SADNESS SCALE
    ========================== -->

    <div class="happiness-scale">

        <img
            src="images/sadd.png"
            alt="درجات الحزن"
            class="happiness-image">

    </div>


    <!-- =========================
         NEXT
    ========================== -->

    <button
        class="next-button"
        onclick="goNext()">

        التالي

    </button>


</div>


<script>

/* =========================
   FIXED PAGE SCALE
========================= */

const baseWidth = 1024;
const baseHeight = 1366;


function resizePage() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    document.body.style.setProperty(
        "--page-scale",
        scale
    );

}


resizePage();


window.addEventListener(
    "resize",
    resizePage
);


window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m6n2gJXfPnu_Ns6LV-jxhg_cHa00bj6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   PERSONALIZATION
========================= */

async function loadPersonalization() {

    const childId =
        localStorage.getItem(
            "rafiqChildId"
        );

    if (!childId) {
        return;
    }

    try {

        const { data, error } =
            await supabaseClient
                .from("children")
                .select("interests")
                .eq("id", childId)
                .maybeSingle();


        if (error) {

            console.error(
                "خطأ في جلب اهتمام الطفل:",
                error
            );

            return;
        }


        if (
            !data ||
            !data.interests
        ) {

            return;
        }


        const interests =
            String(data.interests)
                .trim()
                .toLowerCase();


        /* =========================
           CARS
        ========================= */

        if (

            interests === "سيارات" ||

            interests === "سيارة" ||

            interests === "cars" ||

            interests === "car"

        ) {

            document
                .querySelector(".page")
                .style.backgroundImage =
                    'url("images/ak.jpeg")';

        }


        /* =========================
           SPACE
        ========================= */

        else if (

            interests === "فضاء" ||

            interests === "space"

        ) {

            document
                .querySelector(".page")
                .style.backgroundImage =
                    'url("images/af.jpeg")';

        }

    }

    catch (error) {

        console.error(
            "خطأ في تخصيص الصفحة:",
            error
        );

    }

}


/* تشغيل التخصيص */

loadPersonalization();


/* =========================
   BACK
========================= */

function goBack() {

    window.location.href =
        "emotions.html";

}


/* =========================
   MENU
========================= */

function toggleMenu() {

    const menu =
        document.getElementById(
            "menu"
        );

    menu.classList.toggle(
        "show"
    );

}


/* =========================
   CLOSE MENU
========================= */

document.addEventListener(
    "click",
    function(event) {

        const container =
            document.querySelector(
                ".menu-container"
            );

        if (
            !container.contains(
                event.target
            )
        ) {

            document
                .getElementById(
                    "menu"
                )
                .classList.remove(
                    "show"
                );

        }

    }
);


/* =========================
   SPEECH
========================= */

function speakSadness() {

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(
                "الحزن"
            );


        speech.lang =
            "ar-SA";


        speech.rate =
            0.8;


        speech.pitch =
            1.0;


        window.speechSynthesis.speak(
            speech
        );

    }

}


/* =========================
   NEXT
========================= */

function goNext() {

    window.location.href =
        "anxiety.html";

}

</script>

</body>

</html>
