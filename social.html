<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>المواقف الاجتماعية - رفيق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    color: #555;

    background-color: #ffffff;

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transition:
        background-image .4s ease;

    visibility: hidden;

    position: relative;

    touch-action: manipulation;
}


/* =====================================================
   THEME READY
===================================================== */

body.theme-ready {

    visibility: visible;

}


/* =====================================================
   FIXED PAGE
   1024 × 1366
===================================================== */

.page {

    position: absolute;

    width: 1024px;

    height: 1366px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin: center center;

    overflow: hidden;

    z-index: 5;

    padding:
        115px 35px 180px;
}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button {

    position: absolute;

    top: 35px;

    left: 35px;

    width: 155px;

    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,.18);

    z-index: 1001;

    transition: .2s ease;
}

.previous-button:hover {

    transform:
        translateY(-3px);

    background:
        #d8edfc;
}

.previous-button:active {

    transform:
        scale(.96);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: absolute;

    top: 35px;

    right: 35px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,.96);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,.18);

    z-index: 1000;

    transition: .2s ease;
}

.menu-button:hover {

    transform:
        translateY(-3px);
}

.menu-button:active {

    transform:
        scale(.95);
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: absolute;

    top: 115px;

    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition: .3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: .2s ease;
}

.side-menu button:last-child {

    margin-bottom: 0;
}

.side-menu button:hover {

    background:
        #e4f2ff;

    transform:
        translateX(-3px);
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width:
        900px;

    margin:
        0 auto;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    margin:
        20px 0 5px;

    padding:
        18px 50px;

    border-radius:
        40px;

    background:
        rgba(255,255,255,.80);

    box-shadow:
        0 8px 25px
        rgba(90,130,160,.10);

    color:
        #40566d;

    font-size:
        42px;

    font-weight:
        900;

    text-align:
        center;
}


.subtitle {

    margin:
        8px 0 35px;

    color:
        #8296a9;

    font-size:
        22px;

    font-weight:
        700;

    text-align:
        center;
}


/* =====================================================
   SOCIAL GRID
===================================================== */

.social-grid {

    width:
        850px;

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        25px 30px;
}


/* =====================================================
   SOCIAL CARD
===================================================== */

.social-card {

    position:
        relative;

    height:
        245px;

    border-radius:
        32px;

    border:
        3px solid
        rgba(255,255,255,.9);

    overflow:
        hidden;

    cursor:
        pointer;

    box-shadow:
        0 9px 25px
        rgba(70,100,120,.15);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    padding:
        0;

    font-family:
        inherit;

    background:
        linear-gradient(
            135deg,
            #eaf7ff,
            #edf4ff
        );
}


/* =====================================================
   LAST CARD
===================================================== */

.waiting-card {

    grid-column:
        1 / -1;

    width:
        calc(50% - 15px);

    justify-self:
        center;
}


/* =====================================================
   HOVER
===================================================== */

.social-card:hover {

    transform:
        translateY(-7px)
        scale(1.015);

    box-shadow:
        0 15px 32px
        rgba(70,100,120,.20);
}


.social-card:active {

    transform:
        scale(.97);
}


/* =====================================================
   CARD TITLE
===================================================== */

.card-title {

    position:
        absolute;

    top:
        18px;

    right:
        20px;

    left:
        20px;

    z-index:
        3;

    margin:
        0;

    color:
        #40566d;

    font-size:
        27px;

    font-weight:
        900;

    text-align:
        center;

    line-height:
        1.3;
}


/* =====================================================
   CARD IMAGE
===================================================== */

.card-image {

    position:
        absolute;

    left:
        50%;

    bottom:
        5px;

    transform:
        translateX(-50%);

    width:
        78%;

    height:
        175px;

    object-fit:
        contain;

    object-position:
        center bottom;

    transition:
        transform .3s ease;

    pointer-events:
        none;
}


.social-card:hover .card-image {

    transform:
        translateX(-50%)
        scale(1.06);
}


/* =====================================================
   ARROW
===================================================== */

.card-arrow {

    position:
        absolute;

    left:
        18px;

    bottom:
        15px;

    width:
        48px;

    height:
        48px;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.92);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        25px;

    font-weight:
        900;

    color:
        #55718b;

    box-shadow:
        0 5px 12px
        rgba(60,80,100,.15);

    z-index:
        5;
}


/* =====================================================
   SOUND
===================================================== */

.sound-icon {

    position:
        absolute;

    right:
        18px;

    bottom:
        15px;

    width:
        48px;

    height:
        48px;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.92);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        22px;

    box-shadow:
        0 5px 12px
        rgba(60,80,100,.15);

    z-index:
        6;
}


/* =====================================================
   SELECTED
===================================================== */

.social-card.selected {

    animation:
        selectedCard .45s ease;
}


@keyframes selectedCard {

    0% {

        transform:
            scale(1);
    }

    50% {

        transform:
            scale(1.045);
    }

    100% {

        transform:
            scale(1);
    }
}

</style>

</head>


<body>


<!-- =====================================================
     PREVIOUS
===================================================== -->

<button
class="previous-button"
onclick="goBack()">

← السابق

</button>


<!-- =====================================================
     MENU
===================================================== -->

<button
class="menu-button"
id="menuButton"
onclick="toggleMenu()">

☰

</button>


<!-- =====================================================
     SIDE MENU
===================================================== -->

<div
class="side-menu"
id="sideMenu">

    <button onclick="goHome()">
        🏠 الرئيسية
    </button>

    <button onclick="goProfile()">
        👤 ملفي
    </button>

    <button onclick="goProgress()">
        ⭐ تقدمي
    </button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">

<div class="content">


    <!-- =================================================
         TITLE
    ================================================== -->

    <h1 class="title">

         المواقف الاجتماعية

    </h1>


    <p class="subtitle">

        هيا نتعلم كيف نتعامل مع الآخرين
        في مواقفنا اليومية

    </p>


    <!-- =================================================
         SOCIAL GRID
    ================================================== -->

    <div class="social-grid">


        <!-- 1 -->

        <button
        class="social-card"
        data-text="الاعتذار"
        onclick="selectSituation(this)">

            <h2 class="card-title">
                الاعتذار
            </h2>

            <img
            src="images/a9.png"
            class="card-image"
            alt="الاعتذار">

            <span class="sound-icon">
                🔊
            </span>

            <span class="card-arrow">
                ←
            </span>

        </button>


        <!-- 2 -->

        <button
        class="social-card"
        data-text="التحية والتعارف"
        onclick="selectSituation(this)">

            <h2 class="card-title">
                التحية والتعارف
            </h2>

            <img
            src="images/a11.png"
            class="card-image"
            alt="التحية والتعارف">

            <span class="sound-icon">
                🔊
            </span>

            <span class="card-arrow">
                ←
            </span>

        </button>


        <!-- 3 -->

        <button
        class="social-card"
        data-text="طلب المساعدة"
        onclick="selectSituation(this)">

            <h2 class="card-title">
                طلب المساعدة
            </h2>

            <img
            src="images/a13.png"
            class="card-image"
            alt="طلب المساعدة">

            <span class="sound-icon">
                🔊
            </span>

            <span class="card-arrow">
                ←
            </span>

        </button>


        <!-- 4 -->

        <button
        class="social-card"
        data-text="مساعدة الآخرين"
        onclick="selectSituation(this)">

            <h2 class="card-title">
                مساعدة الآخرين
            </h2>

            <img
            src="images/a99.png"
            class="card-image"
            alt="مساعدة الآخرين">

            <span class="sound-icon">
                🔊
            </span>

            <span class="card-arrow">
                ←
            </span>

        </button>


        <!-- 5 -->

        <button
        class="social-card"
        data-text="المشاركة"
        onclick="selectSituation(this)">

            <h2 class="card-title">
                المشاركة
            </h2>

            <img
            src="images/a19.png"
            class="card-image"
            alt="المشاركة">

            <span class="sound-icon">
                🔊
            </span>

            <span class="card-arrow">
                ←
            </span>

        </button>


        <!-- 6 -->

        <button
        class="social-card"
        data-text="الشكر"
        onclick="selectSituation(this)">

            <h2 class="card-title">
                الشكر
            </h2>

            <img
            src="images/a20.png"
            class="card-image"
            alt="الشكر">

            <span class="sound-icon">
                🔊
            </span>

            <span class="card-arrow">

            </span>

        </button>


        <!-- 7 -->

        <button
        class="social-card waiting-card"
        data-text="الانتظار"
        onclick="openWaitingPage()">

            <h2 class="card-title">
                الانتظار
            </h2>

            <img
            src="images/a30.png"
            class="card-image"
            alt="الانتظار">

            <span class="sound-icon">

            </span>

                ←
            </span>

        </button>


    </div>

</div>

</main>


<script>

/* =====================================================
   FIXED PAGE SCALE
===================================================== */

const baseWidth = 1024;
const baseHeight = 1366;


function resizePage() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    document.body.style.setProperty(
        "--page-scale",
        scale
    );

}


resizePage();


window.addEventListener(
    "resize",
    resizePage
);


window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_m6m2gJXfPnu_Ns6LV-jxhg_cHa00bj6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   GET CURRENT CHILD ID
===================================================== */

function getCurrentChildId() {

    return localStorage.getItem(
        "rafiqChildId"
    );

}


/* =====================================================
   PRELOAD BACKGROUND
===================================================== */

function preloadBackground(
    imagePath
) {

    return new Promise(
        function(resolve) {

            const image =
                new Image();

            image.onload =
                function() {

                    resolve(true);

                };

            image.onerror =
                function() {

                    console.warn(
                        "تعذر تحميل الخلفية:",
                        imagePath
                    );

                    resolve(false);

                };

            image.src =
                imagePath;

        }
    );

}


/* =====================================================
   SET BACKGROUND
===================================================== */

async function setBackground(
    imagePath
) {

    await preloadBackground(
        imagePath
    );


    document.body.style.backgroundImage =
        'url("' +
        imagePath +
        '")';


    document.body.classList.add(
        "theme-ready"
    );

}


/* =====================================================
   LOAD CHILD INTEREST
===================================================== */

async function loadChildInterest() {

    const childId =
        getCurrentChildId();


    /* =========================================
       DEFAULT BACKGROUND
    ========================================== */

    if (!childId) {

        await setBackground(
            "images/af.jpeg"
        );

        return;
    }


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("children")

            .select("interests")

            .eq(
                "id",
                childId
            )

            .maybeSingle();


        /* =========================================
           ERROR
        ========================================== */

        if (error) {

            console.error(
                "Supabase Error:",
                error
            );

            await setBackground(
                "images/af.jpeg"
            );

            return;
        }


        /* =========================================
           CHILD NOT FOUND
        ========================================== */

        if (!data) {

            await setBackground(
                "images/af.jpeg"
            );

            return;
        }


        /* =========================================
           GET INTEREST
        ========================================== */

        let interest =
            data.interests;


        if (
            interest !== null &&
            interest !== undefined
        ) {

            interest =
                String(interest)
                    .trim()
                    .toLowerCase();

        }


        console.log(
            "Child Interest:",
            interest
        );


        /* =========================================
           CARS
        ========================================== */

        if (

            interest === "سيارات" ||

            interest === "سيارة" ||

            interest === "cars" ||

            interest === "car"

        ) {

            await setBackground(
                "images/ak.jpeg"
            );

            return;
        }


        /* =========================================
           SPACE
        ========================================== */

        if (

            interest === "فضاء" ||

            interest === "space"

        ) {

            await setBackground(
                "images/af.jpeg"
            );

            return;
        }


        /* =========================================
           DEFAULT
        ========================================== */

        await setBackground(
            "images/af.jpeg"
        );

    }

    catch (error) {

        console.error(
            "Unexpected Error:",
            error
        );

        await setBackground(
            "images/af.jpeg"
        );

    }

}


/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle(
        "show"
    );

}


/* =====================================================
   CLOSE MENU
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );


        if (

            !menu.contains(
                event.target
            )

            &&

            !button.contains(
                event.target
            )

        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goBack() {

    window.location.href =
        "games.html";

}


function goHome() {

    window.location.href =
        "home.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}


function goProgress() {

    window.location.href =
        "progress.html";

}


/* =====================================================
   WAITING PAGE
===================================================== */

function openWaitingPage() {

    localStorage.setItem(
        "lastSocialSituation",
        "الانتظار"
    );


    window.location.href =
        "waiting.html";

}


/* =====================================================
   SELECT SOCIAL SITUATION
===================================================== */

function selectSituation(
    element
) {

    const text =
        element.getAttribute(
            "data-text"
        );


    element.classList.remove(
        "selected"
    );

    void element.offsetWidth;

    element.classList.add(
        "selected"
    );


    localStorage.setItem(
        "lastSocialSituation",
        text
    );


    speakArabic(
        text
    );

}


/* =====================================================
   ARABIC SPEECH
===================================================== */

function speakArabic(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "ar-SA";

    utterance.rate =
        0.85;

    utterance.pitch =
        1.05;

    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   START
===================================================== */

loadChildInterest();

</script>


</body>

</html>
