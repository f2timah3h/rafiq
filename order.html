<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترتيبي يتغيّر | رفيق</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    direction: rtl;
    background: #dff4f6;
    color: #35305f;
}

.game-wrapper {
    width: min(100%, 1000px);
    min-height: 100vh;
    margin: auto;
    padding: 20px;
}

.top-bar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

#progress,
.back-btn {
    background: #fff8f5;
    border: none;
    border-radius: 30px;
    padding: 12px 25px;
    font-size: 22px;
    font-weight: bold;
    color: #4c4079;
}

.back-btn {
    cursor: pointer;
}


/* =========================
   الكرت الأساسي
========================= */

.page-card {
    position: relative;

    width: 100%;
    min-height: calc(100vh - 110px);

    border-radius: 35px;
    overflow: hidden;

    background: #fffdf8;
}


/* =========================
   خلفيات المشاهد
========================= */

.scene-card {
    position: relative;
    min-height: calc(100vh - 110px);
}


/* هذا أهم كود للخلفيات */

.background-page {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    z-index: 0;
}


/* المحتوى فوق الخلفية */

.background-overlay {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: calc(100vh - 110px);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 40px;
}


/* =========================
   النص
========================= */

.scene-text {
    background: rgba(255, 255, 255, 0.88);

    border-radius: 30px;

    padding: 25px 40px;

    text-align: center;

    max-width: 750px;

    margin-bottom: 25px;

    backdrop-filter: blur(3px);
}

.scene-text h1,
.scene-text h2 {
    color: #b62d5c;
    margin: 0 0 12px;
}

.scene-text h1 {
    font-size: 48px;
}

.scene-text h2 {
    font-size: 40px;
}

.scene-text p {
    font-size: 24px;
    line-height: 1.8;
    margin: 0;
}

.top-text {
    margin-top: 20px;
}


/* =========================
   الطفل
========================= */

.character-image {
    position: relative;

    width: min(380px, 55vw);
    max-height: 500px;

    object-fit: contain;

    z-index: 3;

    margin: auto;
}


.happy-child {
    width: min(400px, 60vw);
    max-height: 500px;
    object-fit: contain;
}


.final-child {
    width: 280px;
    max-height: 350px;
    object-fit: contain;
}


/* =========================
   الأدوات
========================= */

.items-row {
    display: flex;

    justify-content: center;
    align-items: flex-end;

    gap: 20px;

    flex-wrap: wrap;

    background: rgba(255,255,255,.88);

    padding: 25px;

    border-radius: 30px;

    margin-bottom: 25px;
}

.item-box {
    width: 150px;

    display: flex;
    flex-direction: column;
    align-items: center;

    font-size: 20px;
    font-weight: bold;
}

.item-box img {
    width: 110px;
    height: 110px;

    object-fit: contain;
}


/* =========================
   لعبة الحقيبة
========================= */

.packing-area {
    width: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 20px;
}

.packing-child {
    width: min(340px, 50vw);
    max-height: 380px;

    object-fit: contain;
}

.bag-drop {
    width: 280px;
    height: 170px;

    border: 4px dashed #b62d5c;

    border-radius: 30px;

    background: rgba(255,255,255,.85);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: bold;

    color: #b62d5c;
}

.draggable-items {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 20px;

    flex-wrap: wrap;
}

.drag-item {
    width: 110px;
    height: 110px;

    object-fit: contain;

    cursor: grab;

    background: rgba(255,255,255,.9);

    border-radius: 20px;

    padding: 10px;

    transition: transform .2s;
}

.drag-item:hover {
    transform: scale(1.08);
}

.drag-item:active {
    cursor: grabbing;
}


/* =========================
   الحقيبة الممتلئة
========================= */

.filled-bag {
    width: min(420px, 65vw);
    max-height: 480px;

    object-fit: contain;
}


/* =========================
   الأزرار
========================= */

.main-btn {
    border: none;

    background: #bd2f61;
    color: white;

    padding: 16px 50px;

    border-radius: 35px;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;

    margin-top: 20px;
}

.secondary-btn {
    border: 2px solid #bd2f61;

    background: white;
    color: #bd2f61;

    padding: 14px 35px;

    border-radius: 35px;

    font-size: 20px;

    cursor: pointer;
}


/* =========================
   صفحة المشاعر
========================= */

.normal-page {
    min-height: calc(100vh - 110px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 40px;

    text-align: center;
}

.normal-page h2 {
    color: #b62d5c;
    font-size: 42px;
}

.feeling-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(180px, 250px));

    gap: 25px;

    margin-top: 30px;
}

.feeling-grid button {
    border: none;

    background: white;

    border-radius: 30px;

    padding: 25px;

    font-size: 45px;

    cursor: pointer;

    box-shadow:
        0 6px 18px rgba(0,0,0,.08);
}

.feeling-grid span {
    display: block;

    margin-top: 10px;

    font-size: 20px;

    color: #35305f;
}


/* =========================
   التعلم
========================= */

.lesson-card {
    width: min(600px, 90%);

    background: white;

    border-radius: 25px;

    padding: 18px;

    margin: 8px;

    font-size: 22px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.06);
}


/* =========================
   النهاية
========================= */

.final-buttons {
    display: flex;

    gap: 15px;

    flex-wrap: wrap;

    justify-content: center;
}


/* =========================
   حركة بسيطة عند الخطأ
========================= */

.gentle-shake {
    animation: gentleShake .35s;
}

@keyframes gentleShake {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    50% {
        transform: translateX(5px);
    }

    100% {
        transform: translateX(0);
    }
}


/* =========================
   الجوال
========================= */

@media (max-width: 700px) {

    .game-wrapper {
        padding: 10px;
    }

    .scene-text {
        padding: 20px;
    }

    .scene-text h1 {
        font-size: 36px;
    }

    .scene-text h2 {
        font-size: 31px;
    }

    .scene-text p {
        font-size: 19px;
    }

    .background-overlay {
        padding: 20px;
    }

    .feeling-grid {
        grid-template-columns: 1fr 1fr;
    }

    .item-box {
        width: 100px;
    }

    .item-box img {
        width: 80px;
        height: 80px;
    }

const content = document.getElementById("content");
const progress = document.getElementById("progress");

let currentPage = 1;
const totalPages = 10;

let selectedFeeling = "";

/* =========================

========================= */

const images = {

    water: "images/water.png",
    clean: "images/clean.png"
};

/* =========================
   التنقل
========================= */

function updateProgress() {
    progress.textContent = `${currentPage} / ${totalPages}`;
}

function nextPage() {
    if (currentPage < totalPages) {
        currentPage++;
        renderPage();
    }
}

function goBack() {
    if (currentPage > 1) {
        currentPage--;
        renderPage();
    } else {
        window.location.href = "challenges_combined.html";
    }
}

function renderPage() {

    updateProgress();

    switch (currentPage) {
        case 1:
            page1();
            break;

        case 2:
            page2();
            break;

        case 3:
            page3();
            break;

        case 4:
            page4();
            break;

        case 5:
            page5();
            break;

        case 6:
            page6();
            break;

        case 7:
            page7();
            break;

        case 8:
            page8();
            break;

        case 9:
            page9();
            break;

        case 10:
            page10();
            break;
    }
}

/* =========================
   لعبة السحب
========================= */

let expectedOrder = [
    "water",
    "book",
    "tissue",
    "pin"
];

let currentOrderIndex = 0;


function setupDragGame() {

    currentOrderIndex = 0;

    const items = document.querySelectorAll(".drag-item");
    const bag = document.getElementById("bagDrop");

    let draggedItem = null;
    let isDragging = false;

    /* =====================================================
       السحب والإفلات باستخدام Pointer Events
       يعمل بالماوس + اللمس + القلم
       ===================================================== */

    items.forEach(item => {

        // نوقف السحب الأصلي للصور حتى لا يتعارض مع اللمس
        item.draggable = false;

        item.addEventListener("pointerdown", function(event) {

            draggedItem = this;
            isDragging = true;

            this.setPointerCapture(event.pointerId);

            this.style.opacity = "0.6";
            this.style.transform = "scale(1.08)";

            event.preventDefault();

        });

        item.addEventListener("pointermove", function(event) {

            if (!isDragging || draggedItem !== this) return;

            const target = document.elementFromPoint(
                event.clientX,
                event.clientY
            );

            if (
                target &&
                (target === bag || bag.contains(target))
            ) {
                bag.style.transform = "scale(1.05)";
            } else {
                bag.style.transform = "";
            }

            event.preventDefault();

        });

        item.addEventListener("pointerup", function(event) {

            if (!isDragging || draggedItem !== this) return;

            const target = document.elementFromPoint(
                event.clientX,
                event.clientY
            );

            const droppedInsideBag =
                target &&
                (target === bag || bag.contains(target));

            this.style.opacity = "1";
            this.style.transform = "";
            bag.style.transform = "";

            if (droppedInsideBag) {
                checkItem(this.dataset.item);
            }

            draggedItem = null;
            isDragging = false;

            event.preventDefault();

        });

        item.addEventListener("pointercancel", function() {

            this.style.opacity = "1";
            this.style.transform = "";
            bag.style.transform = "";

            draggedItem = null;
            isDragging = false;
        });

    });
}

function checkItem(itemName) {

    if (
        itemName ===
        expectedOrder[currentOrderIndex]
    ) {

        const item =
            document.querySelector(
                `[data-item="${itemName}"]`
            );

        if (item) {
            item.style.visibility = "hidden";
        }

        currentOrderIndex++;


        if (
            currentOrderIndex ===
            expectedOrder.length
        ) {

            setTimeout(() => {

                currentPage = 6;
                renderPage();

            }, 500);

        }

    } else {

        const bag =
            document.getElementById("bagDrop");

        bag.classList.add("gentle-shake");

        setTimeout(() => {
            bag.classList.remove("gentle-shake");
        }, 400);
    }
}
