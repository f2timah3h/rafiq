<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>أي من هذه الخيارات لونه أخضر؟</title>

<style>

/* =========================================================
   الإعدادات العامة
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Tajawal", "Cairo", Arial, sans-serif;

    overflow: hidden;

    background-image: url("images/colorin.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: #000;
}


/* =========================================================
   زر السابق - أعلى اليسار
========================================================= */

.previous-btn {
    position: fixed;

    top: 35px;
    left: 35px;

    width: 155px;
    height: 60px;

    border: none;
    border-radius: 20px;

    background: #e4f2ff;
    color: #55718b;

    font-family: inherit;
    font-size: 23px;
    font-weight: 800;

    cursor: pointer;

    z-index: 3000;

    transition: 0.2s ease;
}

.previous-btn:hover {
    background: #d8edfc;
    transform: translateY(-2px);
}


/* =========================================================
   زر القائمة - أعلى اليمين
========================================================= */

.menu-btn {
    position: fixed;

    top: 35px;
    right: 35px;

    width: 65px;
    height: 65px;

    border: none;
    border-radius: 22px;

    background: rgba(255,255,255,0.82);

    font-size: 30px;

    cursor: pointer;

    z-index: 3000;

    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}


/* =========================================================
   القائمة الجانبية
========================================================= */

.side-menu {
    position: fixed;

    top: 110px;
    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background: rgba(255,255,255,0.90);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow: 0 10px 30px rgba(0,0,0,0.10);

    z-index: 2900;

    display: none;
}

.side-menu.show {
    display: block;
}

.side-menu button {
    width: 100%;

    border: none;
    border-radius: 18px;

    padding: 14px;

    margin-bottom: 10px;

    background: #f4f9fd;

    color: #55718b;

    font-family: inherit;
    font-size: 20px;
    font-weight: 700;

    cursor: pointer;
}


/* =========================================================
   المحتوى الرئيسي
   الآن يتمركز بالكامل في منتصف الشاشة
========================================================= */

.main-content {

    width: calc(100% - 40px);

    max-width: 900px;

    height: 100vh;

    margin: 0 auto;

    padding: 100px 0 110px;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 0;
}


/* =========================================================
   عنوان السؤال
========================================================= */

.question {

    margin: 0 0 10px;

    font-size: 42px;

    font-weight: 900;

    color: #000;

    line-height: 1.35;
}


/* =========================================================
   التلميح
========================================================= */

.hint {

    margin: 0 0 25px;

    font-size: 24px;

    font-weight: 700;

    color: #000;

    line-height: 1.4;
}


/* =========================================================
   خيارات الصور
========================================================= */

.options {

    display: flex;

    direction: ltr;

    justify-content: center;

    align-items: center;

    gap: 25px;

    width: 100%;

    margin: 0;
}


/* =========================================================
   بطاقة الخيار
========================================================= */

.option-card {

    width: 230px;

    height: 280px;

    flex: 0 1 230px;

    background: rgba(255,255,255,0.88);

    border-radius: 32px;

    border: 5px solid transparent;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 8px 22px rgba(0,0,0,0.10);

    transition:
        transform 0.2s ease,
        border 0.2s ease,
        box-shadow 0.2s ease;
}

.option-card:hover {

    transform: translateY(-6px);

    box-shadow:
        0 12px 28px rgba(0,0,0,0.14);
}


/* =========================================================
   صور الخيارات
========================================================= */

.option-card img {

    width: 190px;

    height: 220px;

    object-fit: contain;

    pointer-events: none;
}


/* =========================================================
   الإجابة الصحيحة
========================================================= */

.option-card.correct {

    border: 5px solid #6fbd78;

    transform: scale(1.03);

    box-shadow:
        0 0 0 6px rgba(111,189,120,0.18),
        0 12px 28px rgba(0,0,0,0.12);
}


/* =========================================================
   حركة الخطأ
========================================================= */

.option-card.wrong {

    animation: shake 0.45s ease;
}

@keyframes shake {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-12px);
    }

    50% {
        transform: translateX(12px);
    }

    75% {
        transform: translateX(-8px);
    }

    100% {
        transform: translateX(0);
    }
}


/* =========================================================
   رسالة النتيجة
========================================================= */

.feedback {

    min-height: 55px;

    margin-top: 20px;

    font-size: 28px;

    font-weight: 900;

    color: #000;

    opacity: 0;

    transition: 0.25s ease;
}

.feedback.show {

    opacity: 1;
}

.feedback.success {

    color: #000;
}

.feedback.error {

    color: #000;
}


/* =========================================================
   النجوم
========================================================= */

.stars {

    display: flex;

    justify-content: center;

    gap: 12px;

    margin-top: 5px;

    font-size: 42px;

    opacity: 0;

    transform: scale(0.8);

    transition: 0.3s ease;
}

.stars.show {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   زر التالي
   ثابت أسفل يمين الشاشة
========================================================= */

.next-btn {

    position: fixed !important;

    right: 40px !important;

    bottom: 35px !important;

    top: auto !important;

    left: auto !important;

    width: 165px;

    height: 62px;

    border: none;

    border-radius: 22px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 24px;

    font-weight: 800;

    cursor: pointer;

    z-index: 3000;

    opacity: 0.5;

    pointer-events: none;

    transition:
        0.2s ease,
        transform 0.2s ease;
}

.next-btn.ready {

    opacity: 1;

    pointer-events: auto;
}

.next-btn.ready:hover {

    background: #d8edfc;

    transform: translateY(-3px);
}


/* =========================================================
   شاشة إكمال المرحلة
========================================================= */

.completion-screen {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    background: rgba(255,255,255,0.94);

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    z-index: 5000;
}

.completion-screen.show {

    display: flex;
}


/* =========================================================
   احتفال
========================================================= */

.completion-emoji {

    font-size: 75px;

    margin-bottom: 10px;

    animation:
        celebration 1s ease infinite alternate;
}

@keyframes celebration {

    from {
        transform: scale(1) rotate(-3deg);
    }

    to {
        transform: scale(1.08) rotate(3deg);
    }
}


/* =========================================================
   عنوان النجاح
========================================================= */

.completion-title {

    margin: 5px 0 15px;

    font-size: 48px;

    font-weight: 900;

    color: #000000 !important;
}


/* =========================================================
   نص النجاح
========================================================= */

.completion-text {

    margin: 5px 0;

    font-size: 32px;

    font-weight: 800;

    color: #000000 !important;
}


/* =========================================================
   النص الفرعي
========================================================= */

.completion-subtitle {

    margin: 10px 0;

    font-size: 30px;

    font-weight: 800;

    color: #000000 !important;
}


/* =========================================================
   زر المرحلة التالية
========================================================= */

.stage-next-btn {

    margin-top: 32px;

    width: 270px;

    height: 70px;

    border: none;

    border-radius: 24px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 25px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.08);

    transition: 0.2s ease;
}

.stage-next-btn:hover {

    background: #d8edfc;

    transform: translateY(-3px);
}


/* =========================================================
   توافق شاشة الآيباد بالطول
========================================================= */

@media (min-width: 768px) and (max-width: 1100px) {

    .main-content {

        width: calc(100% - 40px);

        max-width: 900px;

        padding: 100px 0 110px;

        justify-content: center;
    }


    .question {

        font-size: 42px;

        margin-bottom: 10px;
    }


    .hint {

        font-size: 24px;

        margin-bottom: 25px;
    }


    .options {

        gap: 25px;
    }


    .option-card {

        width: 230px;

        height: 280px;

        flex-basis: 230px;
    }


    .option-card img {

        width: 190px;

        height: 220px;
    }


    .completion-title {

        font-size: 48px;
    }


    .completion-text {

        font-size: 31px;
    }


    .completion-subtitle {

        font-size: 29px;
    }
}


/* =========================================================
   إذا كانت الشاشة أقصر
========================================================= */

@media (max-height: 900px) {

    .main-content {

        padding-top: 90px;

        padding-bottom: 90px;
    }


    .question {

        font-size: 36px;
    }


    .hint {

        font-size: 21px;

        margin-bottom: 18px;
    }


    .option-card {

        width: 200px;

        height: 245px;
    }


    .option-card img {

        width: 165px;

        height: 190px;
    }


    .feedback {

        margin-top: 12px;

        min-height: 45px;

        font-size: 24px;
    }


    .stars {

        font-size: 35px;
    }
}


/* =========================================================
   الشاشات الأصغر
========================================================= */

@media (max-width: 800px) {

    .previous-btn {

        left: 20px;

        top: 20px;

        width: 120px;

        height: 52px;

        font-size: 20px;
    }


    .menu-btn {

        top: 20px;

        right: 20px;

        width: 55px;

        height: 55px;

        font-size: 26px;
    }


    .next-btn {

        right: 20px !important;

        bottom: 20px !important;

        width: 145px;

        height: 55px;

        font-size: 21px;
    }


    .options {

        gap: 15px;
    }


    .option-card {

        width: calc((100% - 30px) / 3);

        max-width: 220px;

        height: 250px;
    }


    .option-card img {

        width: 85%;

        height: 85%;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     زر السابق
===================================================== -->

<button
    class="previous-btn"
    onclick="goBack()">

    السابق

</button>


<!-- =====================================================
     زر القائمة
===================================================== -->

<button
    class="menu-btn"
    onclick="toggleMenu()">

    ☰

</button>


<!-- =====================================================
     القائمة الجانبية
===================================================== -->

<div
    id="sideMenu"
    class="side-menu">

    <button onclick="goHome()">
        🏠 الرئيسية
    </button>

    <button onclick="goColors()">
        🎨 الألوان
    </button>

</div>


<!-- =====================================================
     المحتوى الرئيسي
===================================================== -->

<main class="main-content">


    <!-- السؤال -->

    <div class="question">

        أي من هذه الخيارات لونه أخضر؟ 
    </div>


    <!-- التلميح -->

    <div class="hint">

        اختر الصورة ذات اللون الأخضر

    </div>


    <!-- =================================================
         الخيارات
    ================================================== -->

    <div class="options">


        <!-- الخيار الصحيح -->

        <div
            class="option-card"
            data-correct="true"
            onclick="selectOption(this)">

            <img
                src="images/green1.png"
                alt="ضفدع أخضر">

        </div>


        <!-- الخيار الثاني -->

        <div
            class="option-card"
            data-correct="false"
            onclick="selectOption(this)">

            <img
                src="images/red3.png"
                alt="فراولة حمراء">

        </div>


        <!-- الخيار الثالث -->

        <div
            class="option-card"
            data-correct="false"
            onclick="selectOption(this)">

            <img
                src="images/y2.png"
                alt="موز أصفر">

        </div>


    </div>


    <!-- =================================================
         رسالة النتيجة
    ================================================== -->

    <div
        id="feedback"
        class="feedback">

    </div>


    <!-- =================================================
         النجوم
    ================================================== -->

    <div
        id="stars"
        class="stars">

        ⭐ ⭐ ⭐

    </div>


</main>


<!-- =====================================================
     زر التالي
===================================================== -->

<button
    id="nextBtn"
    class="next-btn"
    onclick="finishStage()">

    التالي →

</button>


<!-- =====================================================
     شاشة إكمال المرحلة
===================================================== -->

<div
    id="completionScreen"
    class="completion-screen">


    <div class="completion-emoji">

        🎉

    </div>


    <div class="completion-title">

        أحسنت! 🌟

    </div>


    <div class="completion-text">

        لقد أنهيت هذه المرحلة بنجاح

    </div>


    <div class="completion-subtitle">

        هيا بنا الى المرحلة التالية ✨

    </div>


    <button
        class="stage-next-btn"
        onclick="goToNextStage()">

        المرحلة التالية

    </button>


</div>


<script>

/* =========================================================
   المتغيرات
========================================================= */

let answered = false;


/* =========================================================
   النطق العربي
========================================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        return;

    }

    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.lang = "ar-SA";

    utterance.rate = 0.78;

    utterance.pitch = 1.05;


    window.speechSynthesis.speak(utterance);

}


/* =========================================================
   صوت التصفيق
========================================================= */

function applause() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audioContext =
            new AudioContext();


        const now =
            audioContext.currentTime;


        for (let i = 0; i < 7; i++) {

            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.frequency.value =
                500 + Math.random() * 500;


            gain.gain.setValueAtTime(
                0.0001,
                now + i * 0.07
            );


            gain.gain.exponentialRampToValueAtTime(
                0.18,
                now + i * 0.07 + 0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + i * 0.07 + 0.10
            );


            oscillator.start(
                now + i * 0.07
            );


            oscillator.stop(
                now + i * 0.07 + 0.11
            );

        }

    } catch (error) {

        console.log(
            "Audio unavailable"
        );

    }

}


/* =========================================================
   حفظ الخطأ
========================================================= */

function saveError(color) {

    localStorage.setItem(
        "colorNeedsReinforcement",
        color
    );


    let errors = {

        green: 0,

        red: 0,

        blue: 0,

        yellow: 0

    };


    try {

        const saved =
            localStorage.getItem(
                "colorLearningErrors"
            );


        if (saved) {

            errors =
                JSON.parse(saved);

        }

    } catch (e) {}


    if (!errors[color]) {

        errors[color] = 0;

    }


    errors[color]++;


    localStorage.setItem(
        "colorLearningErrors",
        JSON.stringify(errors)
    );

}


/* =========================================================
   اختيار الإجابة
========================================================= */

function selectOption(card) {

    if (answered) {

        return;

    }


    const isCorrect =
        card.dataset.correct === "true";


    /* ==============================================
       الإجابة الخاطئة
    ============================================== */

    if (!isCorrect) {

        speak(
            "حاول مرة أخرى"
        );


        saveError(
            "green"
        );


        card.classList.remove(
            "wrong"
        );


        void card.offsetWidth;


        card.classList.add(
            "wrong"
        );


        const feedback =
            document.getElementById(
                "feedback"
            );


        feedback.textContent =
            "حاول مرة أخرى 🌱";


        feedback.className =
            "feedback show error";


        return;

    }


    /* ==============================================
       الإجابة الصحيحة
    ============================================== */

    answered = true;


    card.classList.add(
        "correct"
    );


    const allCards =
        document.querySelectorAll(
            ".option-card"
        );


    allCards.forEach(
        function(item) {

            item.style.pointerEvents =
                "none";

        }
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.textContent =
        "أحسنت! 🌟 هذا اللون أخضر 💚";


    feedback.className =
        "feedback show success";


    speak(
        "أحسنت! هذا اللون أخضر"
    );


    /* حفظ إكمال السؤال */

    localStorage.setItem(
        "greenReinforcementCompleted",
        "true"
    );


    /* حذف طلب إعادة التعزيز */

    localStorage.removeItem(
        "colorNeedsReinforcement"
    );


    /* إظهار النجوم */

    document
        .getElementById("stars")
        .classList.add("show");


    /* تفعيل زر التالي */

    document
        .getElementById("nextBtn")
        .classList.add("ready");


    /* صوت النجاح */

    applause();

}


/* =========================================================
   زر التالي
========================================================= */

function finishStage() {

    if (!answered) {

        return;

    }


    localStorage.setItem(
        "colorActivity2",
        "completed"
    );


    localStorage.setItem(
        "colorStage2Completed",
        "true"
    );


    document
        .getElementById("completionScreen")
        .classList.add("show");


    speak(
        "أحسنت! لقد أنهيت هذه المرحلة بنجاح. هيا بنا إلى المرحلة الثانية"
    );

}


/* =========================================================
   الانتقال إلى المرحلة التالية
========================================================= */

function goToNextStage() {

    localStorage.setItem(
        "colorActivity2",
        "completed"
    );


    localStorage.setItem(
        "colorStage2Completed",
        "true"
    );


    window.location.href =
        "colors.html";

}


/* =========================================================
   زر السابق
========================================================= */

function goBack() {

    window.location.href =
        "choose-green.html";

}


/* =========================================================
   القائمة
========================================================= */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );


    menu.classList.toggle(
        "show"
    );

}


/* =========================================================
   الرئيسية
========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================================
   صفحة الألوان
========================================================= */

function goColors() {

    window.location.href =
        "colors.html";

}


/* =========================================================
   قراءة السؤال تلقائيًا
========================================================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            function() {

                speak(
                    "أي من هذه الخيارات لونه أخضر؟"
                );

            },
            700
        );

    }
);

</script>

</body>
</html>
