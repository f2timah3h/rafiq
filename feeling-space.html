<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>هل تستطيع معرفة الشعور؟ - رفيق</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    color: #555;

    background-image:
        url("images/spacee.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;

    overflow-x: hidden;
}


/* =====================================================
   DECORATIONS
===================================================== */

.cloud {

    position: fixed;

    font-size: 85px;

    opacity: 0.30;

    pointer-events: none;

    z-index: 0;

    animation:
        cloudFloat 5s ease-in-out infinite;
}

.cloud-one {
    top: 130px;
    left: 55px;
}

.cloud-two {
    top: 175px;
    right: 45px;
    animation-delay: 1.5s;
}

@keyframes cloudFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}


.star {

    position: fixed;

    font-size: 25px;

    pointer-events: none;

    z-index: 0;

    animation:
        starTwinkle 2.5s ease-in-out infinite;
}

.star-one {
    top: 250px;
    left: 85px;
}

.star-two {
    top: 220px;
    right: 110px;
    animation-delay: .8s;
}

.star-three {
    top: 470px;
    right: 60px;
    animation-delay: 1.2s;
}

.star-four {
    top: 500px;
    left: 90px;
    animation-delay: 1.8s;
}

@keyframes starTwinkle {

    0%, 100% {
        opacity: .35;
        transform: scale(.9);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: 100%;

    min-height: 100vh;

    padding:
        85px 20px 120px;

    position: relative;

    z-index: 5;
}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button {

    position: fixed;

    top: 35px;
    left: 35px;

    width: 155px;
    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,.18);

    z-index: 1001;

    transition: .2s ease;
}

.previous-button:hover {
    transform: translateY(-3px);
}

.previous-button:active {
    transform: scale(.96);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: fixed;

    top: 35px;
    right: 35px;

    width: 65px;
    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,.94);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,.18);

    z-index: 1000;

    transition: .2s ease;
}

.menu-button:hover {
    transform: translateY(-3px);
}

.menu-button:active {
    transform: scale(.95);
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: fixed;

    top: 115px;
    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition: .3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: .2s ease;
}

.side-menu button:hover {
    background: #e4f2ff;
    transform: translateX(-3px);
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width:
        min(900px,95vw);

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    z-index: 10;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    margin:
        20px 0 8px;

    font-size: 42px;

    font-weight: 900;

    color: #555;

    text-align: center;

    text-shadow:
        0 3px 5px
        rgba(255,255,255,.95);
}


/* =====================================================
   AUDIO
===================================================== */

.audio-button {

    width: 52px;
    height: 52px;

    border: none;

    border-radius: 50%;

    background: #e4f2ff;

    font-size: 24px;

    cursor: pointer;

    box-shadow:
        0 5px 14px
        rgba(60,80,100,.15);

    transition: .2s ease;
}

.audio-button:hover {
    transform: scale(1.08);
}

.audio-button:active {
    transform: scale(.95);
}


/* =====================================================
   QUESTION
===================================================== */

.question {

    margin-top:
       300px;

    text-align: center;

    font-size: 32px;

    font-weight: 900;

    color: #555;
	padding-top;300px;
}


/* =====================================================
   ANIMATION AREA
===================================================== */

.animation-area {

    width: 650px;

    max-width: 95vw;

    height: 420px;

    margin:
        0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}


/* =====================================================
   CHILD SVG
===================================================== */

.child-svg {

    width: 390px;

    height: 390px;

    overflow: visible;

    animation:
        childBreathing 2.8s ease-in-out infinite;
}

@keyframes childBreathing {

    0%, 100% {
        transform: translateY(3px);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* =====================================================
   UMBRELLA
===================================================== */

.umbrella-group {

    transform-origin:
        200px 120px;

    animation:
        umbrellaMove 3s ease-in-out infinite;
}

@keyframes umbrellaMove {

    0%, 100% {

        transform:
            rotate(-3deg)
            translateX(-3px);
    }

    50% {

        transform:
            rotate(4deg)
            translateX(4px);
    }
}


/* =====================================================
   SAD FACE
===================================================== */

.sad-face {

    animation:
        sadFaceMove 2.5s ease-in-out infinite;
}

@keyframes sadFaceMove {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(2px);
    }
}


/* =====================================================
   HAPPY SCENE
===================================================== */

.happy-scene {

    width: 390px;

    height: 390px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    font-size: 170px;

    animation:
        happyFloat 2.5s ease-in-out infinite;
}

@keyframes happyFloat {

    0%,100% {
        transform: translateY(3px);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =====================================================
   ANSWERS
===================================================== */

.answers {

    width: 650px;

    max-width: 95vw;

    margin:
        0 auto;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 16px;
}


.answer-button {

    min-height: 75px;

    border:
        2px solid
        #d8eaf4;

    border-radius: 22px;

    background:
        #ffffff;

    color: #555;

    font-family: inherit;

    font-size: 23px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 13px
        rgba(70,90,110,.10);

    transition: .2s ease;
}

.answer-button:hover {

    transform:
        translateY(-4px);

    background:
        #f4faff;

    border-color:
        #c9e5f5;
}

.answer-button:active {
    transform: scale(.97);
}

.answer-button.correct {

    background:
        #eaf8ed;

    border-color:
        #bde1c7;

    color:
        #477653;
}

.answer-button.wrong {

    background:
        #fff2f2;

    border-color:
        #efcaca;

    color:
        #9b5555;
}


/* =====================================================
   HINT
===================================================== */

.hint-button {

    width: 230px;

    height: 60px;

    margin:
        22px auto 0;

    border:
        2px solid
        #d8eaf4;

    border-radius: 20px;

    background:
        #ffffff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 5px 13px
        rgba(70,90,110,.10);

    transition: .2s ease;
}

.hint-button:hover {

    background:
        #e4f2ff;

    transform:
        translateY(-3px);
}


/* =====================================================
   HINT BOX
===================================================== */

.hint-box {

    width: 620px;

    max-width: 95vw;

    min-height: 65px;

    margin:
        15px auto 0;

    padding:
        15px 20px;

    border-radius: 20px;

    background:
        #fff9df;

    border:
        2px solid
        #f1e5a9;

    color:
        #776b38;

    text-align: center;

    font-size: 20px;

    font-weight: 700;

    display: none;
}

.hint-box.show {

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        feedbackPop .3s ease;
}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

    width: 620px;

    max-width: 95vw;

    min-height: 65px;

    margin:
        18px auto 0;

    padding:
        15px 20px;

    border-radius: 20px;

    text-align: center;

    font-size: 21px;

    font-weight: 800;

    display: none;

    align-items: center;

    justify-content: center;
}

.feedback.show {

    display: flex;

    animation:
        feedbackPop .35s ease;
}

.feedback.correct {

    background:
        #eaf8ed;

    border:
        2px solid
        #c6e8ce;

    color:
        #477653;
}

.feedback.wrong {

    background:
        #fff2f2;

    border:
        2px solid
        #f0d0d0;

    color:
        #9b5555;
}

@keyframes feedbackPop {

    from {
        opacity: 0;
        transform: scale(.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next-button {

    position: fixed;

    right: 35px;

    bottom: 30px;

    width: 220px;

    height: 65px;

    display: none;

    border: none;

    border-radius: 22px;

    background:
        #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 22px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(70,90,110,.15);

    z-index: 1000;

    transition: .2s ease;
}

.next-button.show {

    display: block;

    animation:
        feedbackPop .35s ease;
}

.next-button:hover {
    transform: translateY(-3px);
}

.next-button:active {
    transform: scale(.96);
}


/* =====================================================
   QUESTION NUMBER
===================================================== */

.progress-box {

    margin-top: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;

    font-size: 21px;

    font-weight: 800;
}

.progress-item {

    background:
        rgba(255,255,255,.88);

    padding:
        11px 25px;

    border-radius: 18px;

    box-shadow:
        0 4px 12px
        rgba(70,90,110,.10);
}


/* =====================================================
   FINAL MESSAGE
===================================================== */

.final-message {

    width: 650px;

    max-width: 94vw;

    margin-top: 50px;

    padding: 35px 25px;

    border-radius: 30px;

    background:
        #e4f2ff;

    text-align: center;

    display: none;

    box-shadow:
        0 8px 20px
        rgba(70,90,110,.14);
}

.final-message.show {

    display: block;

    animation:
        feedbackPop .5s ease;
}

.final-message h2 {

    margin:
        0 0 18px;

    font-size: 32px;

    font-weight: 900;
}

.final-stars {

    font-size: 45px;

    letter-spacing: 8px;

    margin-top: 10px;

    animation:
        starsPop .6s ease;
}

@keyframes starsPop {

    from {

        opacity: 0;

        transform:
            scale(.7);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =====================================================
   🚀 SPACE CELEBRATION
===================================================== */

#carCelebration {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: hidden;

    z-index: 2000;

    display: none;
}


/* =====================================================
   SPACE OBJECT
===================================================== */

.space-object {

    position: absolute;

    bottom: -120px;

    pointer-events: none;

    animation:
        spaceFly
        var(--duration)
        ease-in-out
        var(--delay)
        forwards;

    opacity: 0;
}


/* =====================================================
   ROCKET
===================================================== */

.space-rocket {

    font-size: 65px;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,.8)
        );
}


/* =====================================================
   STAR
===================================================== */

.space-star {

    font-size: 38px;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,.9)
        );
}


/* =====================================================
   SPARKLE
===================================================== */

.space-sparkle {

    font-size: 35px;

    color: white;

    text-shadow:
        0 0 8px white,
        0 0 18px #bdeaff;

}


/* =====================================================
   PINK PLANET
===================================================== */

.space-planet {

    width: 62px;

    height: 62px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ffb5c9,
            #c38ce9
        );

    box-shadow:
        0 0 20px
        rgba(255,255,255,.7);

    position: relative;
}


/* =====================================================
   PLANET RING
===================================================== */

.space-planet::after {

    content: "";

    position: absolute;

    width: 84px;

    height: 22px;

    border:
        5px solid
        rgba(255,255,255,.75);

    border-radius: 50%;

    left: -11px;

    top: 18px;

    transform:
        rotate(-20deg);
}


/* =====================================================
   BLUE PLANET
===================================================== */

.space-blue-planet {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #8cddff,
            #638ee8
        );

    box-shadow:
        0 0 18px
        rgba(255,255,255,.7);
}


/* =====================================================
   COMET
===================================================== */

.space-comet {

    width: 15px;

    height: 15px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px #fff,
        0 0 20px #aeeaff;

    position: relative;
}

.space-comet::before {

    content: "";

    position: absolute;

    width: 95px;

    height: 6px;

    right: 5px;

    top: 5px;

    border-radius: 10px;

    background:
        linear-gradient(
            to left,
            rgba(255,255,255,.85),
            transparent
        );
}


/* =====================================================
   SPACE FLY ANIMATION
===================================================== */

@keyframes spaceFly {

    0% {

        transform:
            translateY(0)
            translateX(0)
            rotate(0deg)
            scale(.65);

        opacity: 0;
    }

    10% {

        opacity: 1;
    }

    30% {

        transform:
            translateY(-30vh)
            translateX(25px)
            rotate(10deg)
            scale(1);
    }

    55% {

        transform:
            translateY(-60vh)
            translateX(-30px)
            rotate(-12deg)
            scale(1.05);
    }

    80% {

        transform:
            translateY(-90vh)
            translateX(25px)
            rotate(12deg)
            scale(1);
    }

    100% {

        transform:
            translateY(-125vh)
            translateX(-15px)
            rotate(-10deg)
            scale(.9);

        opacity: 0;
    }

}


/* =====================================================
   IPAD
===================================================== */

@media (min-width:768px) {

    .page {

        min-height: 1366px;

        padding-top: 105px;

        padding-bottom: 120px;
    }

    

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:767px) {

    .page {

        padding:
            90px 10px 110px;
    }

    .previous-button {

        top: 20px;
        left: 20px;

        width: 125px;
        height: 52px;

        font-size: 18px;
    }

    .menu-button {

        top: 20px;
        right: 20px;

        width: 55px;
        height: 55px;

        font-size: 27px;
    }

    .side-menu {

        top: 90px;
        right: 20px;

        width: 220px;
    }

    

    .question {

        font-size: 23px;

        margin-top: 650px;
		padding-top:300px;
    }

    .animation-area {

        height: 330px;
    }

    .child-svg {

        width: 310px;
        height: 310px;
    }

    .happy-scene {

        width: 310px;
        height: 310px;
        font-size: 120px;
    }

    .answers {

        grid-template-columns:
            1fr;

        gap: 10px;
    }

    .answer-button {

        min-height: 60px;

        font-size: 19px;
    }

    .hint-button {

        width: 210px;

        height: 56px;

        font-size: 19px;
    }

    .hint-box,
    .feedback {

        font-size: 18px;
    }

    .progress-box {

        font-size: 16px;
    }

    .next-button {

        right: 20px;

        bottom: 20px;

        width: 190px;

        height: 58px;

        font-size: 19px;
    }

    .final-message h2 {
        font-size: 26px;
    }

    .final-stars {
        font-size: 38px;
    }

}

</style>

</head>

/* =====================================================
   CHOOSE ANSWER
===================================================== */

function chooseAnswer(answer) {

    if (answered) {
        return;
    }


    const question =
        questions[currentQuestion];


    const responseTime =
        Date.now() -
        questionStartTime;


    const buttons =
        document.querySelectorAll(
            ".answer-button"
        );


    /* =================================================
       WRONG
    ================================================= */

    if (
        answer !==
        question.correctAnswer
    ) {

        totalErrors++;


        buttons.forEach(
            button => {

                if (
                    button
                    .textContent
                    .includes(answer)
                ) {

                    button.classList.add(
                        "wrong"
                    );

                    setTimeout(
                        () => {

                            button.classList.remove(
                                "wrong"
                            );

                        },
                        700
                    );

                }

            }
        );


        const feedback =
            document.getElementById(
                "feedback"
            );


        feedback.className =
            "feedback show wrong";


        feedback.textContent =
            "غلط، جاوب مرة أخرى";


        savePerformance(
            question,
            answer,
            responseTime,
            false
        );


        return;
    }


    /* =================================================
       CORRECT
    ================================================= */

    answered = true;


    score++;


    totalResponseTime +=
        responseTime;


    buttons.forEach(
        button => {

            button.disabled =
                true;

            if (
                button
                .textContent
                .includes(answer)
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        "feedback show correct";


    feedback.textContent =
        question.correctFeedback;


    document
        .getElementById(
            "hintButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "nextButton"
        )
        .classList
        .add("show");


    savePerformance(
        question,
        answer,
        responseTime,
        true
    );


    /* =================================================
       🚀 SPACE DECORATION
    ================================================= */

    createCarBalloons();

}


/* =====================================================
   HINTS
===================================================== */

function showHint() {

    if (answered) {
        return;
    }


    const question =
        questions[currentQuestion];


    const hintBox =
        document.getElementById(
            "hintBox"
        );


    if (
        currentHint >=
        question.hints.length
    ) {

        return;
    }


    hintBox.textContent =
        question.hints[currentHint];


    hintBox.classList.add(
        "show"
    );


    currentHint++;

    hintsUsed++;


    if (
        currentHint >=
        question.hints.length
    ) {

        document
            .getElementById(
                "hintButton"
            )
            .style.display =
            "none";
    }

}

}


/* =====================================================
   FINISH GAME
===================================================== */

function finishGame() {

    document
        .getElementById(
            "answers"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hintButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hintBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "feedback"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "questionText"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "animationArea"
        )
        .style.display =
        "none";


    let stars = 1;


    if (
        score === 2
    ) {

        stars = 3;

    }

    else if (
        score === 1
    ) {

        stars = 2;

    }


    document
        .getElementById(
            "finalStars"
        )
        .textContent =
        "⭐".repeat(stars);


    document
        .getElementById(
            "finalTitle"
        )
        .textContent =
        "🎉 أحسنت يا رفيق!";


    document
        .getElementById(
            "finalMessage"
        )
        .classList
        .add("show");


    const percentage =
        Math.round(
            (
                score /
                questions.length
            ) * 100
        );


    const averageTime =
        Math.round(
            totalResponseTime /
            questions.length /
            1000
        );


    const finalPerformance = {

        activity:
            "هل تستطيع معرفة الشعور؟",

        score:
            score,

        totalQuestions:
            questions.length,

        percentage:
            percentage,

        errors:
            totalErrors,

        hints:
            hintsUsed,

        averageResponseTime:
            averageTime,

        completedAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "rafiqEmotionRecognitionPerformance",
        JSON.stringify(
            finalPerformance
        )
    );

}


/* =====================================================
   SAVE PERFORMANCE
===================================================== */

function savePerformance(
    question,
    selectedAnswer,
    responseTime,
    isCorrect
) {

    const oldData =
        JSON.parse(
            localStorage.getItem(
                "rafiqEmotionAttempts"
            ) || "[]"
        );


    oldData.push({

        activity:
            "هل تستطيع معرفة الشعور؟",

        question:
            question.question,

        correctAnswer:
            question.correctAnswer,

        selectedAnswer:
            selectedAnswer,

        isCorrect:
            isCorrect,

        responseTime:
            Math.round(
                responseTime / 1000
            ),

        hintsUsed:
            hintsUsed,

        timestamp:
            new Date().toISOString()

    });


    localStorage.setItem(
        "rafiqEmotionAttempts",
        JSON.stringify(
            oldData
        )
    );

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakQuestion() {

    const text =
        document
            .getElementById(
                "questionText"
            )
            .textContent;


    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(
                text
            );


        speech.lang =
            "ar-SA";

        speech.rate =
            .85;

        speech.pitch =
            1.05;


        window.speechSynthesis.speak(
            speech
        );

    }

}
