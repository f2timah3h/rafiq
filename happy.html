<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>السعادة - رفيق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    direction: rtl;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color: #263746;

    /* إزالة الخلفية الافتراضية */

    background-color: transparent;

    position: relative;
}


/* =========================
   PAGE
========================= */

.page {

    position: absolute;

    width: 1024px;

    height: 1366px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin:
        center center;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding:
        45px 45px 55px;

    overflow: hidden;

}


/* =========================
   TOP BAR
========================= */

.top-bar {

    width: 100%;

    max-width: 950px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: relative;

    z-index: 20;
}


/* =========================
   MENU
========================= */

.menu-container {

    position: relative;

    order: 1;
}

.menu-button {

    width: 62px;

    height: 62px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.42);

    color: #30465b;

    font-size: 29px;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(50,70,90,0.12);

    transition:
        transform 0.2s ease;
}

.menu-button:hover {

    transform: scale(1.08);
}


/* =========================
   DROPDOWN MENU
========================= */

.menu {

    display: none;

    position: absolute;

    top: 72px;

    left: 0;

    width: 215px;

    background:
        rgba(255,255,255,0.96);

    border-radius: 22px;

    padding: 12px;

    box-shadow:
        0 10px 30px
        rgba(50,70,90,0.18);

    z-index: 100;
}

.menu.show {

    display: block;
}

.menu a {

    display: block;

    text-decoration: none;

    color: #30465b;

    font-size: 21px;

    font-weight: 600;

    padding: 15px 18px;

    border-radius: 14px;

    margin: 4px 0;

    text-align: right;

    transition:
        background 0.2s ease;
}

.menu a:hover {

    background: #e4f2ff;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {

    order: 2;

    width: 62px;

    height: 62px;

    border: none;

    background: transparent;

    color: #30465b;

    font-size: 45px;

    line-height: 1;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        transform 0.2s ease;
}

.back-button:hover {

    transform: scale(1.12);
}


/* =========================
   TITLE
========================= */

.title {

    margin-top: 22px;

    margin-bottom: 0;

    font-size: 48px;

    font-weight: 700;

    color: #263746;

    text-align: center;
}


/* =========================
   SOUND BUTTON
========================= */

.sound-button {

    position: absolute;

    top: 145px;

    right: 105px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.40);

    font-size: 32px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 5px 15px
        rgba(50,70,90,0.10);

    transition:
        transform 0.2s ease;
}

.sound-button:hover {

    transform: scale(1.08);
}

.sound-button:active {

    transform: scale(0.94);
}


/* =========================
   HAPPY CHARACTER
========================= */

.character-area {

    margin-top: 20px;

    width: 100%;

    height: 280px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}

.happy-character {

    width: 255px;

    object-fit: contain;

    animation:
        happyJump 2.2s
        ease-in-out
        infinite;
}


/* =========================
   HAPPY ANIMATION
========================= */

@keyframes happyJump {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }

    20% {

        transform:
            translateY(-20px)
            rotate(-2deg)
            scale(1.03);
    }

    40% {

        transform:
            translateY(0)
            rotate(2deg)
            scale(1);
    }

    55% {

        transform:
            translateY(-11px)
            rotate(-1deg)
            scale(1.02);
    }

    70% {

        transform:
            translateY(0)
            rotate(1deg)
            scale(1);
    }

    100% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }
}


/* =========================
   DESCRIPTION
========================= */

.description {

    width: 90%;

    max-width: 720px;

    text-align: center;

    font-size: 23px;

    line-height: 2;

    font-weight: 600;

    color: #263746;

    margin-top: 0;
}


/* =========================
   LEVEL TITLE
========================= */

.level-title {

    margin-top: 85px;

    margin-bottom: 18px;

    font-size: 28px;

    font-weight: bold;

    color: #263746;

    text-align: center;
}


/* =========================
   HAPPINESS SCALE IMAGE
========================= */

.happiness-scale {

    width: 520px;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: center;
}

.happiness-image {

    width: 100%;

    max-width: 520px;

    height: auto;

    object-fit: contain;

    display: block;
}


/* =========================
   NEXT BUTTON
========================= */

.next-button {

    margin-top: 42px;

    border: none;

    background: #e4f2ff;

    color: #30465b;

    font-size: 24px;

    font-weight: bold;

    padding: 15px 55px;

    border-radius: 22px;

    cursor: pointer;

    box-shadow:
        0 6px 15px
        rgba(50,80,100,0.12);

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.next-button:hover {

    transform: translateY(-3px);

    background: #d8edff;
}


/* =========================
   PAGE SCALING
========================= */

@media (max-width: 1023px) {

    .page {
        transform:
            translate(-50%, -50%)
            scale(var(--page-scale, 1));
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .page {
        padding:
            45px 45px 55px;
    }

}


/* =========================
   SCALE SCRIPT SUPPORT
========================= */

</style>

</head>


<body>

<div class="page">


    <!-- =========================
         TOP BAR
    ========================== -->

    <div class="top-bar">


        <!-- القائمة -->

        <div class="menu-container">

            <button
                class="menu-button"
                onclick="toggleMenu()">

                ☰

            </button>


            <div
                class="menu"
                id="menu">

                <a href="home.html">
                    🏠 الرئيسية
                </a>

                <a href="profile.html">
                    👤 ملفي
                </a>

                <a href="reports.html">
                    📊 تقاريري
                </a>

            </div>

        </div>


        <!-- السابق -->

        <button
            class="back-button"
            onclick="goBack()">

            ›

        </button>

    </div>


    <!-- =========================
         TITLE
    ========================= -->

    <h1 class="title">

        السعادة

    </h1>


    <!-- =========================
         SOUND
    ========================= -->

    <button
        class="sound-button"
        onclick="speakHappiness()"
        aria-label="استمع">

        🔊

    </button>


    <!-- =========================
         CHARACTER
    ========================= -->

    <div class="character-area">

        <img
            src="images/happy.png"
            alt="طفلة سعيدة"
            class="happy-character">

    </div>


    <!-- =========================
         DESCRIPTION
    ========================= -->

    <div class="description">

        تشبه السعادة شمسًا صغيرة تضيء يومنا،

        <br>

        وتأتي عندما نفعل أشياء نحبها

        <br>

        أو نحصل على أشياء جميلة،
        أو عندما نكون مع أشخاص يحبوننا ونحبهم.

    </div>


    <!-- =========================
         LEVEL TITLE
    ========================= -->

    <div class="level-title">

        درجات السعادة

    </div>


    <!-- =========================
         HAPPINESS SCALE IMAGE
    ========================= -->

    <div class="happiness-scale">

        <img
            src="images/hp.png"
            alt="درجات السعادة"
            class="happiness-image">

    </div>


    <!-- =========================
         NEXT
    ========================= -->

    <button
        class="next-button"
        onclick="goNext()">

        التالي

    </button>


</div>


<script>

/* =========================
   FIXED PAGE SCALING
========================= */

const baseWidth = 1024;
const baseHeight = 1366;

function resizePage() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    document.body.style.setProperty(
        "--page-scale",
        scale
    );

}

resizePage();

window.addEventListener(
    "resize",
    resizePage
);

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m6m2gJXfPnu_Ns6LV-jxhg_cHa00bj6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   PERSONALIZATION
========================= */

async function loadPersonalization() {

    const childId =
        localStorage.getItem("rafiqChildId");

    if (!childId) {
        return;
    }

    try {

        const { data, error } =
            await supabaseClient
                .from("children")
                .select("interests")
                .eq("id", childId)
                .maybeSingle();

        if (error) {
            console.error(
                "خطأ في جلب اهتمام الطفل:",
                error
            );
            return;
        }

        if (!data || !data.interests) {
            return;
        }

        const interests =
            String(data.interests)
                .trim()
                .toLowerCase();


        /* =========================
           CARS
        ========================= */

        if (
            interests === "سيارات" ||
            interests === "سيارة" ||
            interests === "cars" ||
            interests === "car"
        ) {

            document.body.style.backgroundImage =
                'url("images/ak.jpeg")';

        }


        /* =========================
           SPACE
        ========================= */

        else if (
            interests === "فضاء" ||
            interests === "space"
        ) {

            document.body.style.backgroundImage =
                'url("images/af.jpeg")';

        }

    } catch (error) {

        console.error(
            "خطأ في تخصيص الصفحة:",
            error
        );

    }

}


/* تشغيل التخصيص */

loadPersonalization();


/* =========================
   BACK
========================= */

function goBack() {

    window.location.href =
        "emotions.html";

}


/* =========================
   MENU
========================= */

function toggleMenu() {

    const menu =
        document.getElementById("menu");

    menu.classList.toggle("show");

}


/* =========================
   CLOSE MENU
========================= */

document.addEventListener(
    "click",
    function(event) {

        const container =
            document.querySelector(
                ".menu-container"
            );

        if (
            !container.contains(
                event.target
            )
        ) {

            document
                .getElementById("menu")
                .classList.remove("show");

        }

    }
);


/* =========================
   SPEECH
========================= */

function speakHappiness() {

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(
                "السعادة"
            );

        speech.lang = "ar-SA";

        speech.rate = 0.8;

        speech.pitch = 1.1;

        window.speechSynthesis.speak(
            speech
        );

    }

}


/* =========================
   NEXT
========================= */

function goNext() {

    window.location.href =
        "sad.html";

}

</script>

</body>

</html>
