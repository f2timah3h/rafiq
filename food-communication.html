<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ماذا تريد أن تأكل؟ - رفيق</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    color: #555;

    background-color: #ffffff;

    overflow: hidden;
}


/* =====================================================
   FIXED PAGE SCALE
===================================================== */

.page {

    position: absolute;

    width: 1024px;

    height: 1366px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin: center center;

    overflow: hidden;

    z-index: 5;

    padding:
        115px 35px 180px;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {

    position: absolute;

    inset: 0;

    width: 1024px;

    height: 1366px;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;

    background-image:
        url("images/play.jpeg");

    background-size: 100% auto;

    background-position:
        center bottom;

    background-repeat: no-repeat;
}


/* =====================================================
   CLOUDS
===================================================== */

.cloud {

    position: absolute;

    color: #ffffff;

    font-size: 90px;

    opacity: .55;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(100,150,180,.08)
        );

    animation:
        cloudFloat 5s ease-in-out infinite;
}

.cloud-one {

    top: 120px;

    left: 45px;
}

.cloud-two {

    top: 230px;

    right: 35px;

    animation-delay: 1.5s;
}

.cloud-three {

    top: 690px;

    left: 15px;

    font-size: 75px;

    animation-delay: 2s;
}

.cloud-four {

    top: 720px;

    right: 20px;

    font-size: 75px;

    animation-delay: 1s;
}


@keyframes cloudFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-10px);
    }
}


/* =====================================================
   STARS
===================================================== */

.star {

    position: absolute;

    color: #f6d66b;

    font-size: 28px;

    animation:
        starTwinkle 2.5s ease-in-out infinite;
}

.star-one {

    top: 250px;

    left: 95px;
}

.star-two {

    top: 310px;

    right: 90px;

    animation-delay: .8s;
}

.star-three {

    top: 600px;

    left: 70px;

    animation-delay: 1.2s;
}

.star-four {

    top: 650px;

    right: 65px;

    animation-delay: 1.8s;
}


@keyframes starTwinkle {

    0%,
    100% {

        opacity: .4;

        transform:
            scale(.9);
    }

    50% {

        opacity: 1;

        transform:
            scale(1.15);
    }
}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button {

    position: absolute;

    top: 35px;

    left: 35px;

    width: 155px;

    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,.18);

    z-index: 1001;

    transition: .2s ease;
}

.previous-button:hover {

    transform:
        translateY(-3px);

    background:
        #d8edfc;
}

.previous-button:active {

    transform:
        scale(.96);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: absolute;

    top: 35px;

    right: 35px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,.96);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,.18);

    z-index: 1000;

    transition: .2s ease;
}

.menu-button:hover {

    transform:
        translateY(-3px);
}

.menu-button:active {

    transform:
        scale(.95);
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: absolute;

    top: 115px;

    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition: .3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: .2s ease;
}

.side-menu button:hover {

    background:
        #e4f2ff;

    transform:
        translateX(-3px);
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width:
        900px;

    max-width: 95%;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    margin:
        20px 0 5px;

    padding:
        18px 50px;

    border-radius: 40px;

    background:
        rgba(255,255,255,.80);

    box-shadow:
        0 8px 25px
        rgba(90,130,160,.10);

    color:
        #40566d;

    font-size: 42px;

    font-weight: 900;

    text-align: center;
}

.subtitle {

    margin:
        8px 0 35px;

    color:
        #8296a9;

    font-size: 22px;

    font-weight: 700;

    text-align: center;
}


/* =====================================================
   FOOD GRID
===================================================== */

.food-grid {

    width: 850px;

    max-width: 100%;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 25px 30px;
}


/* =====================================================
   FOOD CARD
===================================================== */

.food-card {

    position: relative;

    height: 245px;

    border-radius: 32px;

    border:
        3px solid
        rgba(255,255,255,.9);

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 9px 25px
        rgba(70,100,120,.15);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    display: block;

    color: inherit;

    background:
        linear-gradient(
            135deg,
            #eef7ff,
            #fff8e9
        );

    text-decoration: none;
}

.food-card:hover {

    transform:
        translateY(-7px)
        scale(1.015);

    box-shadow:
        0 15px 32px
        rgba(70,100,120,.20);
}

.food-card:active {

    transform:
        scale(.97);
}


/* =====================================================
   CARD TITLE
===================================================== */

.card-title {

    position: absolute;

    top: 18px;

    right: 20px;

    left: 20px;

    z-index: 3;

    margin: 0;

    color:
        #40566d;

    font-size: 27px;

    font-weight: 900;

    text-align: center;

    line-height: 1.3;
}


/* =====================================================
   CARD IMAGE
===================================================== */

.card-image {

    position: absolute;

    left: 50%;

    bottom: 5px;

    transform:
        translateX(-50%);

    width: 78%;

    height: 175px;

    object-fit: contain;

    object-position: center bottom;

    transition:
        transform .3s ease;
}

.food-card:hover .card-image {

    transform:
        translateX(-50%)
        scale(1.06);
}


/* =====================================================
   ARROW
===================================================== */

.card-arrow {

    position: absolute;

    left: 18px;

    bottom: 15px;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.92);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    font-weight: 900;

    color:
        #55718b;

    box-shadow:
        0 5px 12px
        rgba(60,80,100,.15);

    z-index: 5;
}


/* =====================================================
   BOTTOM DECORATION
===================================================== */

.playground {

    width: 1024px;

    height: 170px;

    position: absolute;

    bottom: 0;

    left: 0;

    z-index: 1;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            transparent 0%,
            rgba(228,242,255,.3) 30%,
            rgba(198,229,190,.55) 100%
        );

    border-radius:
        50% 50% 0 0;
}

</style>

</head>


<body>

<div class="page" id="page">


<!-- =====================================================
     BACKGROUND
===================================================== -->




<!-- =====================================================
     PREVIOUS
===================================================== -->

<button
class="previous-button"
onclick="goBack()">

← السابق

</button>


<!-- =====================================================
     MENU
===================================================== -->

<button
class="menu-button"
id="menuButton"
onclick="toggleMenu()">

☰

</button>


<div
class="side-menu"
id="sideMenu">

    <button onclick="goHome()">
        🏠 الرئيسية
    </button>

    <button onclick="goProfile()">
        👤 ملفي
    </button>

    <button onclick="goProgress()">
        ⭐ تقدمي
    </button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="content">

    <div>

        <h1 class="title">

            ماذا تريد أن تأكل؟

        </h1>


        <p class="subtitle">

            اختر الطعام الذي تريده يا رفيق

        </p>


        <div class="food-grid">


            <!-- =================================================
                 FISH
            ================================================== -->

            <a
            href="#"
            class="food-card">

                <h2 class="card-title">

                    أريد سمك

                </h2>

                <img
                src="images/alp11.png"
                class="card-image"
                alt="أريد سمكًا">

            </a>


            <!-- =================================================
                 PASTA
            ================================================== -->

            <a
            href="#"
            class="food-card">

                <h2 class="card-title">

                    أريد باستا

                </h2>

                <img
                src="images/alo30.png"
                class="card-image"
                alt="أريد باستا">

            </a>


            <!-- =================================================
                 CHICKEN
            ================================================== -->

            <a
            href="#"
            class="food-card">

                <h2 class="card-title">

                    أريد دجاج

                </h2>

                <img
                src="images/alp12.png"
                class="card-image"
                alt="أريد دجاجًا">

            </a>


            <!-- =================================================
                 RICE
            ================================================== -->

            <a
            href="#"
            class="food-card">

                <h2 class="card-title">

                    أريد أرز

                </h2>

                <img
                src="images/alp13.png"
                class="card-image"
                alt="أريد أرزًا">

            </a>


        </div>

    </div>

</main>


<!-- =====================================================
     BOTTOM
===================================================== -->

<div class="playground"></div>


</div>


<script>

/* =====================================================
   PAGE SCALE
===================================================== */

const page =
    document.getElementById("page");


function resizePage() {

    const baseWidth =
        1024;

    const baseHeight =
        1366;

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth /
        baseWidth;

    const scaleY =
        screenHeight /
        baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    page.style.setProperty(
        "--page-scale",
        scale
    );

}


resizePage();


window.addEventListener(
    "resize",
    resizePage
);


window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle(
        "show"
    );

}


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );

        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goBack() {

    window.location.href =
        "image.html";

}


function goHome() {

    window.location.href =
        "home.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}


function goProgress() {

    alert(
        "⭐ صفحة تقدمي\n\nسنصممها لاحقًا."
    );

}

</script>

</body>

</html>
