<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>يومي الصحي</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    background: #e4f2ff;

    overflow: hidden;

}

/* =====================================================
   PAGE
===================================================== */

.healthy-page {

    width: 100%;
    height: 100vh;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 90px 30px 40px;

}

/* =====================================================
   IMAGE
===================================================== */

.healthy-image {

    width: 78%;
    max-width: 800px;

    height: auto;

    max-height: 78vh;

    object-fit: contain;

    display: block;

    border-radius: 25px;

    user-select: none;

    -webkit-user-drag: none;

    filter:
        drop-shadow(
            0 8px 20px
            rgba(85,113,139,0.12)
        );

}

/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    position: absolute;

    top: 25px;
    right: 30px;

    border: none;

    background:
        rgba(
            255,
            255,
            255,
            0.95
        );

    color: #55718b;

    font-family: inherit;

    font-size: 22px;

    font-weight: 800;

    padding:
        13px 24px;

    border-radius: 20px;

    cursor: pointer;

    box-shadow:
        0 6px 18px
        rgba(
            85,
            113,
            139,
            0.13
        );

    display: flex;

    align-items: center;

    gap: 8px;

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;

    touch-action: manipulation;

}

.back-button:active {

    transform:
        scale(0.95);

    box-shadow:
        0 3px 10px
        rgba(
            85,
            113,
            139,
            0.12
        );

}

/* =====================================================
   iPAD PORTRAIT
===================================================== */

@media (orientation: portrait) {

    .healthy-image {

        width: 82%;

        max-width: 700px;

        max-height: 75vh;

    }

    .back-button {

        top: 25px;

        right: 25px;

        font-size: 22px;

        padding:
            13px 22px;

    }

}

/* =====================================================
   SMALL SCREENS
===================================================== */

@media (max-height: 800px) {

    .healthy-page {

        padding-top: 75px;

    }

    .healthy-image {

        width: 70%;

        max-height: 70vh;

    }

    .back-button {

        top: 15px;

        right: 20px;

        font-size: 18px;

        padding:
            10px 18px;

        border-radius: 17px;

    }

}

</style>

</head>

<body>

<div class="healthy-page">

    <!-- =================================================
         BACK TO HOME
    ================================================== -->

    <button
        class="back-button"
        onclick="goHome()">

        ←

        <span>
            السابق
        </span>

    </button>


    <!-- =================================================
         HEALTHY DAY IMAGE
    ================================================== -->

    <img
        class="healthy-image"
        src="images/aty.jpeg"
        alt="يومي الصحي">

</div>


<script>

/* =====================================================
   BACK TO HOME
===================================================== */

function goHome() {

    window.location.href =
        "home.html";

}

</script>

</body>

</html>
