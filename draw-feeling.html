<!DOCTYPE html>
<html lang="ar" dir="rtl">

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    height: 100%;

/* =====================================================
   PAGE
===================================================== */

.page {

    position: absolute;

    width: 1024px;

    height: 1366px;

    left: 50%;

    top: 50%;

===================================================== */

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,0.18);

    z-index: 1001;

    transition:

        background 0.2s ease;
}

.previous-button:hover {

    transform:

    background: #d8edfc;
}

.previous-button:active {

    transform:

}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: absolute;

    top: 35px;

    right: 35px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.94);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,0.18);

    z-index: 1000;

    transition:

}

.menu-button:hover {

    transform:
        translateY(-3px);
}

.menu-button:active {

    transform:
        scale(0.95);
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

        0 12px 35px

        opacity 0.3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: 0.2s ease;
}

.side-menu button:hover {

    background: #e4f2ff;

    transform:
        translateX(-3px);
}

.side-menu button:last-child {

    margin-bottom: 0;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width: 984px;

    height: 100%;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    z-index: 10;
}


/* =====================================================
   FEELING CARD
===================================================== */

.feeling-card {

    width: 650px;

    min-height: 125px;

    background: #e4f2ff;

    border-radius: 32px;

    padding:
        20px 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    box-shadow:
        0 10px 25px
        rgba(70,100,120,0.17);

    animation:
        cardFloat 4s ease-in-out infinite;

    margin-top: 80px;
}

@keyframes cardFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-5px);
    }
}


/* =====================================================
   ROBOT
===================================================== */

.robot {

    font-size: 66px;

    display: inline-block;

    animation:
        robotBounce 2.4s
        ease-in-out infinite;
}

@keyframes robotBounce {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    30% {
        transform:
            translateY(-7px)
            rotate(-4deg);
    }

    60% {
        transform:
            translateY(0)
            rotate(4deg);
    }
}


/* =====================================================
   FEELING TEXT
===================================================== */

.feeling-text {

    text-align: right;
}

.feeling-text h2 {

    font-size: 29px;

    font-weight: 900;

}

.feeling-text p {

}


/* =====================================================
   DRAWING TOOLS AREA
===================================================== */

.drawing-tools-area {

    margin-top: 22px;

}

.color:hover {

}

.color:active {

    transform:

}

.color.active {

===================================================== */

    left: 8.8%;

    top: 7.5%;

    width: 82.5%;

    height: 71%;

            94% 87%,
            86% 91%,
            76% 88%,
            71% 96%,
            27% 96%,
            22% 88%,

/* =====================================================

/* =====================================================
   PAGE SCALING
===================================================== */

</style>

<body>

<script>

/* =====================================================
   PAGE SCALING
===================================================== */

function resizePage() {

    const page =
        document.querySelector(".page");

    const baseWidth =
        1024;

    const baseHeight =
        1366;

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    page.style.setProperty(
        "--page-scale",
        scale
    );

}

resizePage();

window.addEventListener(
    "resize",
    resizePage
);

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle(
        "show"
    );
}


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );


        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goHome() {

    window.location.href =
        "home.html";
}


function goProfile() {

    alert(
        "👤 صفحة ملفي\n\nسنصممها لاحقًا."
    );
}


function goProgress() {

    alert(
        "⭐ صفحة تقدمي\n\nسنصممها لاحقًا."
    );
}


function goBackToEmotions() {

    window.location.href =
        "emotions.html";
}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "drawingCanvas"
    );

const ctx =
    canvas.getContext("2d");


let drawing = false;

let currentColor =
    "#f4d35e";

let eraserMode =
    false;

let lastX = 0;

let lastY = 0;

let hasDrawing =
    false;


/* =====================================================
   CANVAS SETUP
===================================================== */

function setupCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.round(
            rect.width * dpr
        );

    canvas.height =
        Math.round(
            rect.height * dpr
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.lineWidth =
        7;
}


setupCanvas();


window.addEventListener(
    "resize",
    function() {

        if (!hasDrawing) {

            setupCanvas();

        }

    }
);


/* =====================================================
   GET POSITION
===================================================== */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };
}


/* =====================================================
   CHECK DRAWING AREA
===================================================== */

function isInsideDrawingArea(
    x,
    y
) {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    const nx =
        x / width;

    const ny =
        y / height;


    if (
        nx < 0.03 ||
        nx > 0.98 ||
        ny < 0 ||
        ny > 0.96
    ) {

        return false;
    }


    if (
        ny < 0.20 &&
        nx < 0.14
    ) {

        return false;
    }


    if (
        ny < 0.18 &&
        nx > 0.75
    ) {

        return false;
    }


    const wheelLeftX =
        0.18;

    const wheelRightX =
        0.82;

    const wheelY =
        0.96;


    const leftDistance =
        Math.sqrt(
            Math.pow(
                nx - wheelLeftX,
                2
            ) +
            Math.pow(
                ny - wheelY,
                2
            )
        );


    const rightDistance =
        Math.sqrt(
            Math.pow(
                nx - wheelRightX,
                2
            ) +
            Math.pow(
                ny - wheelY,
                2
            )
        );


    if (
        leftDistance < 0.15 ||
        rightDistance < 0.15
    ) {

        return false;
    }


    return true;
}


/* =====================================================
   START DRAWING
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();


        const position =
            getPosition(event);


        if (
            !isInsideDrawingArea(
                position.x,
                position.y
            )
        ) {

            return;
        }


        drawing =
            true;


        canvas.setPointerCapture(
            event.pointerId
        );


        lastX =
            position.x;

        lastY =
            position.y;


        drawDot(
            lastX,
            lastY
        );


        hasDrawing =
            true;


        document
            .getElementById(
                "drawingHint"
            )
            .classList
            .add(
                "hidden"
            );

    }
);


/* =====================================================
   DRAW
===================================================== */

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!drawing) {

            return;
        }


        event.preventDefault();


        const position =
            getPosition(event);


        if (
            !isInsideDrawingArea(
                position.x,
                position.y
            )
        ) {

            return;
        }


        drawLine(
            lastX,
            lastY,
            position.x,
            position.y
        );


        lastX =
            position.x;

        lastY =
            position.y;

    }
);


/* =====================================================
   STOP DRAWING
===================================================== */

canvas.addEventListener(
    "pointerup",
    stopDrawing
);

canvas.addEventListener(
    "pointercancel",
    stopDrawing
);


function stopDrawing() {

    drawing =
        false;

    ctx.globalCompositeOperation =
        "source-over";
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    x1,
    y1,
    x2,
    y2
) {

    ctx.beginPath();


    ctx.moveTo(
        x1,
        y1
    );


    ctx.lineTo(
        x2,
        y2
    );


    if (eraserMode) {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.lineWidth =
            35;

    }

    else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.strokeStyle =
            currentColor;

        ctx.lineWidth =
            7;

    }


    ctx.stroke();


    ctx.globalCompositeOperation =
        "source-over";
}


/* =====================================================
   DRAW DOT
===================================================== */

function drawDot(
    x,
    y
) {

    ctx.beginPath();


    ctx.arc(
        x,
        y,
        eraserMode
            ? 17
            : 3.5,
        0,
        Math.PI * 2
    );


    if (eraserMode) {

        ctx.globalCompositeOperation =
            "destination-out";

    }

    else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.fillStyle =
            currentColor;

    }


    ctx.fill();


    ctx.globalCompositeOperation =
        "source-over";
}

/* =====================================================
   NORMALIZE AI TEXT
===================================================== */

function normalizeAIText(value) {

    return String(value || "")
        .toLowerCase()
        .trim();

}


/* =====================================================
   GET AI TEXT SAFELY
===================================================== */

function getAIText(result) {

    if (
        result &&
        typeof result.ai_result === "object" &&
        result.ai_result !== null
    ) {

        try {

            return JSON.stringify(
                result.ai_result
            );

        }

        catch (error) {

            return "";

        }

    }


    return String(
        result?.ai_result || ""
    ).trim();

}


/* =====================================================
   EXTRACT AI FIELD
===================================================== */

function extractAIField(
    aiText,
    fieldName
) {

    const regex =
        new RegExp(
            fieldName +
            "\\s*[:=]\\s*[\"']?([^\\n\\r,\"'}]+)",
            "i"
        );


    const match =
        String(aiText).match(
            regex
        );


    if (!match) {

        return "";

    }


    return match[1].trim();

}


/* =====================================================
   NORMALIZE MOUTH
===================================================== */

function normalizeMouth(mouth) {

    const text =
        normalizeAIText(
            mouth
        );


    /* =================================================
       غير مبتسم أولًا
    ================================================= */

    if (
        text.includes("غير مبتسم") ||
        text.includes("غير مبتسمة") ||
        text.includes("ليس مبتسم") ||
        text.includes("ليست مبتسمة") ||
        text.includes("not smiling") ||
        text.includes("not smile")
    ) {

        return "not-happy";

    }


    /* =================================================
       غير موجود
    ================================================= */

    if (
        text.includes("غير موجود") ||
        text.includes("غير موجودة") ||
        text.includes("لا يوجد فم") ||
        text.includes("لا توجد فم") ||
        text.includes("no mouth") ||
        text.includes("missing")
    ) {

        return "missing";

    }


    /* =================================================
       غير واضح
    ================================================= */

    if (
        text.includes("غير واضح") ||
        text.includes("غير واضحة") ||
        text.includes("غير محدد") ||
        text.includes("unclear")
    ) {

        return "unclear";

    }


    /* =================================================
       حزين
    ================================================= */

    if (
        text.includes("حزين") ||
        text.includes("حزينة") ||
        text.includes("حزن") ||
        text.includes("sad")
    ) {

        return "sad";

    }


    /* =================================================
       غاضب
    ================================================= */

    if (
        text.includes("غاضب") ||
        text.includes("غاضبة") ||
        text.includes("غضب") ||
        text.includes("angry")
    ) {

        return "angry";

    }


    /* =================================================
       محايد
    ================================================= */

    if (
        text.includes("محايد") ||
        text.includes("محايدة") ||
        text.includes("neutral") ||
        text.includes("مستقيم") ||
        text.includes("straight")
    ) {

        return "neutral";

    }


    /* =================================================
       مبتسم
    ================================================= */

    if (
        text.includes("مبتسم") ||
        text.includes("مبتسمة") ||
        text.includes("ابتسامة") ||
        text.includes("smiling") ||
        text.includes("smile")
    ) {

        return "happy";

    }


    return "";

}


/* =====================================================
   SHOW AI RESULT
===================================================== */

function showAIResult(
    result
) {

    console.log(
        "🤖 Rafiq AI RESULT:",
        result
    );


    /* =================================================
       AI TEXT
    ================================================= */

    const aiText =
        getAIText(
            result
        );


    console.log(
        "🤖 AI TEXT:",
        aiText
    );


    /* =================================================
       MATCHES TARGET
    ================================================= */

    let matchesTarget =
        false;


    if (
        typeof result.matches_target ===
        "boolean"
    ) {

        matchesTarget =
            result.matches_target;

    }

    else {

        const match =
            aiText.match(
                /matches_target\s*[:=]\s*["']?(true|false)/i
            );


        if (match) {

            matchesTarget =
                match[1].toLowerCase()
                === "true";

        }

    }


    /* =================================================
       CONFIDENCE
    ================================================= */

    let confidence =
        0;


    if (
        result.confidence !== undefined &&
        result.confidence !== null
    ) {

        confidence =
            Number(
                result.confidence
            ) || 0;

    }

    else {

        const confidenceMatch =
            aiText.match(
                /confidence\s*[:=]\s*["']?(\d+(?:\.\d+)?)/i
            );


        if (confidenceMatch) {

            confidence =
                Number(
                    confidenceMatch[1]
                ) || 0;

        }

    }


    /* =================================================
       MOUTH
    ================================================= */

    let mouth =
        String(
            result.mouth || ""
        ).trim();


    if (!mouth) {

        mouth =
            extractAIField(
                aiText,
                "mouth"
            );

    }


    /* =================================================
       EMOTION
    ================================================= */

    let emotion =
        String(
            result.emotion || ""
        ).trim();


    if (!emotion) {

        emotion =
            extractAIField(
                aiText,
                "emotion"
            );

    }


    /* =================================================
       FEEDBACK
    ================================================= */

    let feedback =
        String(
            result.feedback || ""
        ).trim();


    if (!feedback) {

        feedback =
            extractAIField(
                aiText,
                "feedback"
            );

    }


    /* =================================================
       BACKEND MESSAGE
    ================================================= */

    const backendMessage =
        String(
            result.message || ""
        ).trim();


    /* =================================================
       MOUTH TYPE
    ================================================= */

    let mouthType =
        normalizeMouth(
            mouth
        );


    /* =================================================
       FALLBACK TO EMOTION
    ================================================= */

    if (!mouthType) {

        const normalizedEmotion =
            normalizeAIText(
                emotion
            );


        if (
            normalizedEmotion.includes("سعيد") ||
            normalizedEmotion.includes("سعيدة") ||
            normalizedEmotion.includes("happy")
        ) {

            mouthType =
                "happy";

        }

        else if (
            normalizedEmotion.includes("حزين") ||
            normalizedEmotion.includes("حزينة") ||
            normalizedEmotion.includes("sad")
        ) {

            mouthType =
                "sad";

        }

        else if (
            normalizedEmotion.includes("غاضب") ||
            normalizedEmotion.includes("غاضبة") ||
            normalizedEmotion.includes("angry")
        ) {

            mouthType =
                "angry";

        }

        else if (
            normalizedEmotion.includes("محايد") ||
            normalizedEmotion.includes("محايدة") ||
            normalizedEmotion.includes("neutral")
        ) {

            mouthType =
                "neutral";

        }

    }


    /* =================================================
       FALLBACK TO BACKEND MESSAGE
    ================================================= */

    if (
        !mouthType &&
        backendMessage
    ) {

        const normalizedMessage =
            normalizeAIText(
                backendMessage
            );


        if (
            normalizedMessage.includes("وجهًا مبتسمًا") ||
            normalizedMessage.includes("وجه مبتسم") ||
            normalizedMessage.includes("وجه سعيد") ||
            normalizedMessage.includes("ابتسامة جميلة")
        ) {

            mouthType =
                "happy";

        }

        else if (
            normalizedMessage.includes("وجه حزين") ||
            normalizedMessage.includes("حزين")
        ) {

            mouthType =
                "sad";

        }

        else if (
            normalizedMessage.includes("وجه غاضب") ||
            normalizedMessage.includes("غاضب")
        ) {

            mouthType =
                "angry";

        }

    }


    /* =================================================
       DEBUG
    ================================================= */

    console.log(
        "👄 MOUTH:",
        mouth
    );

    console.log(
        "👄 MOUTH TYPE:",
        mouthType
    );

    console.log(
        "😊 EMOTION:",
        emotion
    );

    console.log(
        "🎯 MATCHES:",
        matchesTarget
    );

    console.log(
        "📊 CONFIDENCE:",
        confidence
    );


    /* =================================================
       POPUP ELEMENTS
    ================================================= */

    const resultEmoji =
        document.getElementById(
            "resultEmoji"
        );


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    const successText =
        document.getElementById(
            "successText"
        );


    /* =================================================
       HAPPY
    ================================================= */

    if (
        mouthType === "happy" &&
        (
            matchesTarget ||
            confidence >= 70 ||
            normalizeAIText(emotion)
                .includes("سعيد") ||
            normalizeAIText(emotion)
                .includes("happy")
        )
    ) {

        resultEmoji.textContent =
            "🌈😊⭐";


        resultTitle.textContent =
            "أحسنت!";


        successText.textContent =
            feedback ||
            backendMessage ||
            "أحسنت! أرى وجهًا مبتسمًا سعيدًا 😊";

    }


    /* =================================================
       SAD
    ================================================= */

    else if (
        mouthType === "sad"
    ) {

        resultEmoji.textContent =
            "😢💙";


        resultTitle.textContent =
            "هذا وجه حزين";


        successText.textContent =
            "هذا وجه حزين 😢 حاول أن تجعل الفم منحنيًا إلى الأعلى ليصبح الوجه سعيدًا 😊";

    }


    /* =================================================
       ANGRY
    ================================================= */

    else if (
        mouthType === "angry"
    ) {

        resultEmoji.textContent =
            "😠💙";


        resultTitle.textContent =
            "هذا وجه غاضب";


        successText.textContent =
            "هذا وجه غاضب 😠 حاول رسم وجه سعيد بابتسامة واضحة 😊";

    }


    /* =================================================
       NEUTRAL
    ================================================= */

    else if (
        mouthType === "neutral"
    ) {

        resultEmoji.textContent =
            "😐🎨";


        resultTitle.textContent =
            "هذا وجه محايد";


        successText.textContent =
            "هذا وجه محايد 🙂 حاول أن تجعل الفم منحنيًا إلى الأعلى ليصبح الوجه سعيدًا 😊";

    }


    /* =================================================
       NOT HAPPY
    ================================================= */

    else if (
        mouthType === "not-happy"
    ) {

        resultEmoji.textContent =
            "🎨💙";


        resultTitle.textContent =
            "حاول مرة أخرى";


        successText.textContent =
            "هذا ليس وجهًا سعيدًا 😊 حاول أن تجعل الفم مبتسمًا ومنحنيًا إلى الأعلى.";

    }


    /* =================================================
       MISSING MOUTH
    ================================================= */

    else if (
        mouthType === "missing"
    ) {

        resultEmoji.textContent =
            "🎨😊";


        resultTitle.textContent =
            "حاول مرة أخرى";


        successText.textContent =
            "رائع! حاول إضافة فم مبتسم إلى الوجه 😊";

    }


    /* =================================================
       UNCLEAR
    ================================================= */

    else if (
        mouthType === "unclear"
    ) {

        resultEmoji.textContent =
            "🎨💙";


        resultTitle.textContent =
            "محاولة جميلة!";


        successText.textContent =
            "محاولة جميلة! حاول رسم الفم بشكل أوضح واجعل الابتسامة تتجه إلى الأعلى 😊";

    }


    /* =================================================
       FALLBACK
    ================================================= */

    else if (
        matchesTarget &&
        confidence >= 70
    ) {

        resultEmoji.textContent =
            "🌈😊⭐";


        resultTitle.textContent =
            "أحسنت!";


        successText.textContent =
            feedback ||
            backendMessage ||
            "أحسنت! رسمت وجهًا سعيدًا 😊";

    }


    else {

        resultEmoji.textContent =
            "🎨💙";


        resultTitle.textContent =
            "محاولة جميلة!";


        successText.textContent =
            feedback ||
            backendMessage ||
            "حاول رسم وجه سعيد بشكل أوضح، مع ابتسامة واضحة 😊";

    }


    /* =================================================
       SHOW POPUP
    ================================================= */

    document
        .getElementById(
            "successMessage"
        )
        .style.display =
        "flex";


    /* =================================================
       SPEECH
    ================================================= */

    speakResult(
        resultTitle.textContent +
        ". " +
        successText.textContent
    );

}


/* =====================================================
   SPEECH RESULT
===================================================== */

function speakResult(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "ar-SA";


    speech.rate =
        0.78;


    speech.pitch =
        1.05;


    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}

/* =====================================================
   SEND DRAWING TO AI
===================================================== */

document
    .getElementById(
        "sendButton"
    )
    .addEventListener(
        "click",
        async function() {


            if (!hasDrawing) {

                alert(
                    "🎨 ارسم شيئًا أولًا!"
                );

                return;
            }


            const sendButton =
                this;


            const imageData =
                canvas.toDataURL(
                    "image/png"
                );


            localStorage.setItem(
                "rafiqFeelingDrawing",
                imageData
            );


            sendButton.disabled =
                true;


            sendButton.textContent =
                "🤖 رفيق يحلل رسمتك...";


            try {


                const response =
                    await fetch(
                        "https://rafiq-ai-jgtp.onrender.com/analyze-drawing",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    image:
                                        imageData,

                                    emotion:
                                        "السعادة"

                                })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP Error " +
                        response.status
                    );

                }


                const result =
                    await response.json();


                console.log(
                    "🤖 Rafiq AI Result:",
                    result
                );


                if (
                    result.success
                ) {

                    showAIResult(
                        result
                    );

                }

                else {

                    alert(
                        "😔 حدث خطأ أثناء تحليل الرسمة.\n\n" +
                        (
                            result.message ||
                            "حاولي مرة أخرى."
                        )
                    );

                }

            }


            catch (error) {

                console.error(
                    "❌ AI Connection Error:",
                    error
                );


                alert(
                    "❌ لم نتمكن من الاتصال بخادم رفيق.\n\n" +
                    "حاولي مرة أخرى بعد قليل."
                );

            }


            sendButton.disabled =
                false;


            sendButton.textContent =
                "📤 إرسال رسمتي";

        }
    );

</script>
