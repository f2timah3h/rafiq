<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>رفيق - نشاط الرقم ١</title>


<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    font-family:"Tajawal","Arial",sans-serif;
    background:#e4f2ff;
    touch-action:manipulation;
    position:relative;
}


/* =====================================================
   PAGE
   BASE SIZE: 1024 × 1366
===================================================== */

.page{

    position:absolute;

    width:1024px;
    height:1366px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(var(--page-scale,1));

    transform-origin:center center;

    overflow:hidden;
}


.app{

    position:relative;

    width:1024px;
    height:1366px;

    overflow:hidden;

    background:#e4f2ff;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background{
    position:absolute;
    inset:0;

    z-index:1;

    background-image:url("images/a703.jpeg");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
}


/* =====================================================
   SUCCESS BALLOONS
===================================================== */

.number-balloons{

    position:absolute;

    inset:0;

    z-index:210;

    pointer-events:none;

    overflow:hidden;

    opacity:0;

    visibility:hidden;
}


.number-balloons.show{

    opacity:1;

    visibility:visible;
}


/* =====================================================
   BALLOON
===================================================== */

.number-balloon{

    position:absolute;

    bottom:-230px;

    width:105px;

    height:135px;

    border-radius:50% 50% 48% 48%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:"Tajawal","Arial",sans-serif;

    font-size:72px;

    font-weight:900;

    color:#ffffff;

    text-shadow:
        2px 3px 0 rgba(0,0,0,.08);

    box-shadow:
        inset 12px 10px 20px rgba(255,255,255,.28),
        inset -10px -12px 20px rgba(0,0,0,.08),
        0 7px 10px rgba(0,0,0,.12);

    animation:
        balloonRise
        6s
        ease-in
        forwards;
}


/* =====================================================
   BALLOON HIGHLIGHT
===================================================== */

.number-balloon::before{

    content:"";

    position:absolute;

    width:18px;

    height:42px;

    border-radius:50%;

    background:rgba(255,255,255,.7);

    top:17px;

    left:18px;

    transform:rotate(-25deg);

}


/* =====================================================
   BALLOON KNOT
===================================================== */

.number-balloon::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-12px;

    transform:translateX(-50%);

    width:0;

    height:0;

    border-left:9px solid transparent;

    border-right:9px solid transparent;

    border-top:15px solid currentColor;

}


/* =====================================================
   STRINGS
===================================================== */

.balloon-string{

    position:absolute;

    width:2px;

    height:70px;

    background:rgba(70,90,100,.35);

    left:50%;

    bottom:-75px;

    transform:translateX(-50%);

}


/* =====================================================
   COLORS
===================================================== */

.balloon-blue{
    background:#72c9f4;
}

.balloon-pink{
    background:#f3a8bd;
}

.balloon-yellow{
    background:#ffd365;
}

.balloon-green{
    background:#9bd5a9;
}


/* =====================================================
   BALLOON POSITIONS
===================================================== */

.balloon-1{
    left:6%;
    animation-delay:0s;
    animation-duration:6.2s;
}

.balloon-2{
    left:22%;
    animation-delay:.5s;
    animation-duration:6.8s;
}

.balloon-3{
    left:40%;
    animation-delay:1s;
    animation-duration:6.4s;
}

.balloon-4{
    left:59%;
    animation-delay:1.5s;
    animation-duration:7s;
}

.balloon-5{
    left:77%;
    animation-delay:2s;
    animation-duration:6.5s;
}

.balloon-6{
    left:88%;
    animation-delay:2.6s;
    animation-duration:7.2s;
}


/* =====================================================
   BALLOON RISING
===================================================== */

@keyframes balloonRise{

    0%{

        bottom:-230px;

        opacity:0;

        transform:
            translateX(0)
            rotate(-7deg)
            scale(.8);
    }

    8%{

        opacity:1;
    }

    25%{

        transform:
            translateX(28px)
            rotate(6deg)
            scale(1);
    }

    50%{

        transform:
            translateX(-25px)
            rotate(-5deg)
            scale(1.04);
    }

    75%{

        transform:
            translateX(22px)
            rotate(5deg)
            scale(1);
    }

    100%{

        bottom:115%;

        opacity:0;

        transform:
            translateX(-20px)
            rotate(-5deg)
            scale(.9);
    }

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    position:absolute;

    top:30px;

    left:35px;
    right:35px;

    z-index:100;

    display:block;
}


/* =====================================================
   CIRCLE BUTTON
===================================================== */

.circle-button{

    width:70px;
    height:70px;

    border:none;

    border-radius:50%;

    background:#ffffff;

    color:#1764a1;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 5px 15px rgba(0,0,0,.15);

    cursor:pointer;

    transition:.15s;
}


.circle-button:active{

    transform:scale(.93);
}


/* =====================================================
   PREVIOUS
===================================================== */

.previous-button{

    position:absolute;

    left:0;
    top:0;

    font-family:Arial,sans-serif;

    font-size:46px;

    line-height:1;
}


/* =====================================================
   MENU
===================================================== */

.menu-container{

    position:absolute;

    right:0;
    top:0;
}


.menu-button{

    font-family:Arial,sans-serif;

    font-size:28px;
}


/* =====================================================
   DROPDOWN
===================================================== */

.dropdown{

    position:absolute;

    top:82px;

    right:0;

    width:235px;

    padding:10px;

    background:#ffffff;

    border-radius:22px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.18);

    display:none;
}


.dropdown.show{

    display:block;
}


.dropdown button{

    width:100%;

    border:none;

    background:#ffffff;

    padding:16px 15px;

    margin:2px 0;

    border-radius:15px;

    text-align:right;

    color:#175b91;

    font-family:inherit;

    font-size:20px;

    font-weight:800;

    cursor:pointer;

    transition:.15s;
}


.dropdown button:active{

    background:#e4f2ff;

    transform:scale(.98);
}


/* =====================================================
   QUESTION
===================================================== */

.question-box{

    position:absolute;

    z-index:80;

    top:125px;

    left:50%;

    transform:translateX(-50%);

    width:820px;

    min-height:135px;

    padding:20px 28px;

    background:#ffffff;

    border:5px solid #9ddcff;

    border-radius:38px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:22px;

    box-shadow:
        0 7px 18px
        rgba(30,100,140,.12);
}


.question-text{

    margin:0;

    color:#1764a1;

    font-size:34px;

    font-weight:800;

    line-height:1.4;

    text-align:center;
}


/* =====================================================
   MICROPHONE
===================================================== */

.mic-button{

    flex-shrink:0;

    width:68px;
    height:68px;

    border:3px solid #bde4fa;

    border-radius:50%;

    background:#e4f2ff;

    color:#167bc4;

    font-size:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 4px 10px
        rgba(30,100,140,.12);

    transition:.15s;
}


.mic-button:active{

    transform:scale(.90);
}


/* =====================================================
   CHILDREN
===================================================== */

.children-area{

    position:absolute;

    z-index:30;

    left:0;
    right:0;

    top:500px;

    bottom:145px;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    gap:200px;

    padding:0 55px;
}


.child{

    position:relative;

    width:300px;
    height:400px;

    border:none;

    padding:0;
    margin:0;

    background:transparent;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    cursor:pointer;

    transition:transform .2s ease;
}


.child img{

    transform:scale(1.6);

    width:90%;
    height:90%;

    object-fit:contain;

    pointer-events:none;

    user-select:none;
}


/* =====================================================
   CHILD MOVEMENT
===================================================== */

.child-one{

    animation:
        childFloatOne
        3.3s
        ease-in-out
        infinite;
}


.child-two{

    animation:
        childFloatTwo
        3.7s
        ease-in-out
        infinite;
}


@keyframes childFloatOne{

    0%{
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50%{
        transform:
            translateY(-18px)
            rotate(1.5deg);
    }

    100%{
        transform:
            translateY(0)
            rotate(-1deg);
    }
}


@keyframes childFloatTwo{

    0%{
        transform:
            translateY(-4px)
            rotate(1deg);
    }

    50%{
        transform:
            translateY(-20px)
            rotate(-1.5deg);
    }

    100%{
        transform:
            translateY(-4px)
            rotate(1deg);
    }
}


/* =====================================================
   CORRECT
===================================================== */

.child.correct{

    animation:
        correctAnimation
        .7s
        ease
        forwards;
}


@keyframes correctAnimation{

    0%{
        transform:scale(1);
    }

    35%{
        transform:scale(1.09);
    }

    65%{
        transform:scale(.98);
    }

    100%{
        transform:scale(1.04);
    }
}


/* =====================================================
   WRONG
===================================================== */

.child.wrong{

    animation:
        wrongAnimation
        .45s
        ease;
}


@keyframes wrongAnimation{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-14px);
    }

    50%{
        transform:translateX(14px);
    }

    75%{
        transform:translateX(-8px);
    }
}


/* =====================================================
   ANSWER MESSAGE
===================================================== */

.answer-message{

    position:absolute;

    z-index:90;

    left:50%;

    transform:translateX(-50%);

    bottom:105px;

    min-width:430px;

    padding:14px 30px;

    background:#ffffff;

    border:4px solid #a9e6c1;

    border-radius:25px;

    color:#27865a;

    font-size:27px;

    font-weight:800;

    text-align:center;

    box-shadow:
        0 6px 18px
        rgba(30,100,80,.14);

    opacity:0;

    pointer-events:none;

    transition:.3s;
}


.answer-message.show{

    opacity:1;
}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next-button{

    position:absolute;

    z-index:100;

    right:55px;

    bottom:32px;

    border:none;

    border-radius:30px;

    padding:14px 42px;

    background:#2d9bea;

    color:#ffffff;

    font-family:inherit;

    font-size:24px;

    font-weight:800;

    box-shadow:
        0 5px 0 #1479c5;

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    transform:translateY(15px);

    transition:.3s;
}


.next-button.show{

    opacity:1;

    pointer-events:auto;

    transform:translateY(0);
}


.next-button:active{

    transform:translateY(3px);
}


/* =====================================================
   SUCCESS OVERLAY
===================================================== */

.success-overlay{

    position:absolute;

    inset:0;

    z-index:300;

    background:
        rgba(255,255,255,.62);

    display:flex;

    align-items:center;

    justify-content:center;

    opacity:0;

    pointer-events:none;

    transition:.3s;
}


.success-overlay.show{

    opacity:1;

    pointer-events:auto;
}


/* =====================================================
   SUCCESS POPUP
===================================================== */

.success-popup{

    position:relative;

    width:650px;

    min-height:350px;

    padding:35px;

    background:#ffffff;

    border:6px solid #9ddcff;

    border-radius:45px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    box-shadow:
        0 15px 40px
        rgba(30,100,140,.22);

    transform:scale(.6);

    opacity:0;

    transition:
        .5s cubic-bezier(.2,1.4,.4,1);
}


.success-overlay.show .success-popup{

    transform:scale(1);

    opacity:1;
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

.close-button{

    position:absolute;

    top:18px;

    right:20px;

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;

    background:#e4f2ff;

    color:#1764a1;

    font-size:30px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    z-index:10;
}


.close-button:active{

    transform:scale(.92);

}


.popup-star{

    font-size:70px;

    margin-bottom:8px;

    animation:
        starPop
        1s
        ease-in-out
        infinite
        alternate;
}


@keyframes starPop{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.13);
    }
}


.popup-title{

    margin:0 0 12px;

    color:#f0a500;

    font-size:42px;

    font-weight:900;
}


.popup-text{

    margin:0;

    color:#1764a1;

    font-size:30px;

    font-weight:800;

    line-height:1.6;
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti{

    position:absolute;

    z-index:320;

    pointer-events:none;

    font-size:25px;

    animation:
        confettiFall
        1.5s
        ease-out
        forwards;
}


@keyframes confettiFall{

    0%{

        opacity:1;

        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }

    100%{

        opacity:0;

        transform:
            translateY(400px)
            rotate(540deg)
            scale(.6);
    }
}


/* =====================================================
   PAGE SCALE
===================================================== */

@media(max-width:1023px){

    .page{

        transform:
            translate(-50%,-50%)
            scale(var(--page-scale,1));

    }

}

</style>

</head>


<body>

<div class="page">

<div class="app">


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background"></div>


<!-- =====================================================
     NUMBER 1 BALLOONS
===================================================== -->

<div
    class="number-balloons"
    id="numberBalloons">


    <div class="number-balloon balloon-blue balloon-1">

        ١

        <span class="balloon-string"></span>

    </div>


    <div class="number-balloon balloon-pink balloon-2">

        ١

        <span class="balloon-string"></span>

    </div>


    <div class="number-balloon balloon-yellow balloon-3">

        ١

        <span class="balloon-string"></span>

    </div>


    <div class="number-balloon balloon-green balloon-4">

        ١

        <span class="balloon-string"></span>

    </div>


    <div class="number-balloon balloon-blue balloon-5">

        ١

        <span class="balloon-string"></span>

    </div>


    <div class="number-balloon balloon-pink balloon-6">

        ١

        <span class="balloon-string"></span>

    </div>


</div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">


    <button
        class="circle-button previous-button"
        onclick="goPrevious()"
        aria-label="السابق">

        ‹

    </button>


    <div class="menu-container">


        <button
            class="circle-button menu-button"
            id="menuButton"
            aria-label="القائمة">

            ☰

        </button>


        <div
            class="dropdown"
            id="dropdownMenu">


            <button onclick="goHome()">

                🏠 الرئيسية

            </button>


            <button onclick="goProfile()">

                👤 ملفي

            </button>


            <button onclick="goProgress()">

                ⭐ تقدمي

            </button>


        </div>


    </div>


</div>


<!-- =====================================================
     QUESTION
===================================================== -->

<div class="question-box">


    <p class="question-text">

        أيٌّ من الأطفال يحمل بيده رقم واحد؟

    </p>


    <button
        class="mic-button"
        onclick="speakQuestion()"
        aria-label="إعادة قراءة السؤال">

        🎤

    </button>


</div>


<!-- =====================================================
     CHILDREN
===================================================== -->

<div class="children-area">


    <button
        class="child child-one"
        id="correctChild"
        onclick="checkAnswer(true)"
        aria-label="الطفل الذي يحمل الرقم واحد">


        <img
            src="images/a705.png"
            alt="طفل يحمل الرقم ١">


    </button>


    <button
        class="child child-two"
        id="wrongChild"
        onclick="checkAnswer(false)"
        aria-label="الطفل الذي يحمل الرقم اثنين">


        <img
            src="images/a707.png"
            alt="طفل يحمل الرقم ٢">


    </button>


</div>


<!-- =====================================================
     ANSWER MESSAGE
===================================================== -->

<div
    class="answer-message"
    id="answerMessage">

    أحسنت! 🎉 هذا هو الرقم واحد ⭐

</div>


<!-- =====================================================
     NEXT
===================================================== -->

<button
    class="next-button"
    id="nextButton"
    onclick="goNext()">

    التالي ➜

</button>


<!-- =====================================================
     SUCCESS POPUP
===================================================== -->

<div
    class="success-overlay"
    id="successOverlay">


    <div class="success-popup">


        <button
            class="close-button"
            onclick="closeSuccessPopup()"
            aria-label="إغلاق">

            ✕

        </button>


        <div class="popup-star">

            ⭐

        </div>


        <h2 class="popup-title">

            أحسنت! 🎉

        </h2>


        <p class="popup-text">

            أتقنت الرقم الأول
            <br>
            هيا بنا ننتقل إلى الرقم التالي

        </p>


    </div>


</div>


</div>

</div>


<script>

/* =====================================================
   PAGE SCALE
   BASE: 1024 × 1366
===================================================== */

const baseWidth = 1024;
const baseHeight = 1366;


function resizePage(){

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;


    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;


    const scale =
        Math.min(scaleX,scaleY);


    document.body.style.setProperty(
        "--page-scale",
        scale
    );

}


resizePage();


window.addEventListener(
    "resize",
    resizePage
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   VARIABLES
===================================================== */

let answered = false;


/* =====================================================
   NAVIGATION
===================================================== */

function goPrevious(){

    location.href =
        "number-oness.html";

}


function goHome(){

    location.href =
        "home.html";

}


function goProfile(){

    location.href =
        "profile.html";

}


function goProgress(){

    location.href =
        "progress.html";

}


/* =====================================================
   MENU
===================================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );


const dropdownMenu =
    document.getElementById(
        "dropdownMenu"
    );


menuButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        dropdownMenu.classList.toggle(
            "show"
        );

    }
);


document.addEventListener(
    "click",
    function(){

        dropdownMenu.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   SPEECH
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(
            text
        );


    voice.lang =
        "ar-SA";


    voice.rate =
        .78;


    voice.pitch =
        1.05;


    speechSynthesis.speak(
        voice
    );

}


/* =====================================================
   QUESTION
===================================================== */

function speakQuestion(){

    speak(
        "أي من الأطفال يحمل بيده رقم واحد؟"
    );

}


/* =====================================================
   AUTO READ QUESTION
===================================================== */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            function(){

                speakQuestion();

            },
            700
        );

    }
);


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(correct){

    if(answered){

        return;

    }


    const correctChild =
        document.getElementById(
            "correctChild"
        );


    const wrongChild =
        document.getElementById(
            "wrongChild"
        );


    /* =================================================
       CORRECT ANSWER
    ================================================= */

    if(correct){

        answered = true;


        correctChild.classList.remove(
            "child-one"
        );


        correctChild.classList.add(
            "correct"
        );


        document
            .getElementById(
                "answerMessage"
            )
            .classList.add(
                "show"
            );


        document
            .getElementById(
                "numberBalloons"
            )
            .classList.add(
                "show"
            );


        speak(
            "أحسنت! هذا هو الرقم واحد"
        );


        createConfetti();


        setTimeout(
            function(){

                document
                    .getElementById(
                        "nextButton"
                    )
                    .classList.add(
                        "show"
                    );

            },
            700
        );

    }


    /* =================================================
       WRONG ANSWER
    ================================================= */

    else{

        wrongChild.classList.remove(
            "wrong"
        );


        void wrongChild.offsetWidth;


        wrongChild.classList.add(
            "wrong"
        );


        speak(
            "حاول مرة أخرى"
        );

    }

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

    const app =
        document.querySelector(
            ".app"
        );


    const symbols = [

        "⭐",
        "✨",
        "💙",
        "🎉"

    ];


    for(
        let i=0;
        i<20;
        i++
    ){

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "confetti";


        item.innerHTML =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        item.style.left =
            (
                Math.random()*90+5
            ) + "%";


        item.style.top =
            (
                Math.random()*25+15
            ) + "%";


        item.style.animationDelay =
            (
                Math.random()*.4
            ) + "s";


        app.appendChild(
            item
        );


        setTimeout(
            function(){

                item.remove();

            },
            1800
        );

    }

}


/* =====================================================
   NEXT
===================================================== */

function goNext(){

    const overlay =
        document.getElementById(
            "successOverlay"
        );


    overlay.classList.add(
        "show"
    );


    speak(
        "أحسنت! أتقنت الرقم الأول. هيا بنا ننتقل إلى الرقم التالي"
    );


    createConfetti();

}


/* =====================================================
   CLOSE SUCCESS POPUP
===================================================== */

function closeSuccessPopup(){

    const overlay =
        document.getElementById(
            "successOverlay"
        );


    overlay.classList.remove(
        "show"
    );

}
