<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>اختبر معلوماتك - رفيق</title>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Tajawal","Cairo",Arial,sans-serif;
    background:#ffffff;
}


/* =========================
   PAGE
========================= */

.page{

    position:absolute;

    width:1024px;
    height:1366px;

    left:50%;
    top:50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin:center center;

    overflow:hidden;

    background:#ffffff;

    visibility:hidden;

}


/* =========================
   TOP BUTTONS
========================= */

.top-btn{

    position:absolute;

    top:20px;

    width:62px;
    height:62px;

    border:none;

    border-radius:20px;

    background:#ffffff;

    color:#365b82;

    font-size:35px;

    font-weight:900;

    box-shadow:
        0 6px 17px rgba(0,0,0,.12);

    z-index:50;

}

.back{
    left:20px;
}

.menu{
    right:20px;
}


/* =========================
   TITLE
========================= */

.title{

    position:absolute;

    top:18px;

    left:50%;

    transform:translateX(-50%);

    min-width:320px;

    padding:13px 30px;

    background:#ffffff;

    border-radius:28px;

    color:#244b76;

    font-size:29px;

    font-weight:900;

    text-align:center;

    box-shadow:
        0 7px 20px rgba(0,0,0,.12);

    z-index:30;

}


/* =========================
   TIMER
========================= */

.timer{

    position:absolute;

    top:100px;

    left:50%;

    transform:translateX(-50%);

    min-width:120px;

    padding:8px 18px;

    background:#ffffff;

    border-radius:18px;

    color:#244b76;

    font-size:19px;

    font-weight:900;

    text-align:center;

    box-shadow:
        0 5px 14px rgba(0,0,0,.10);

    z-index:30;

}

.timer.warning{

    color:#e34242;

    animation:timerPulse .7s infinite alternate;

}

@keyframes timerPulse{

    from{
        transform:translateX(-50%) scale(1);
    }

    to{
        transform:translateX(-50%) scale(1.07);
    }

}


/* =========================
   QUESTION
========================= */

.question-box{

    position:absolute;

    top:150px;

    left:50%;

    transform:translateX(-50%);

    width:650px;

    min-height:82px;

    padding:12px 22px;

    background:#ffffff;

    border:4px solid #c4e1fa;

    border-radius:27px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

    box-shadow:
        0 7px 20px rgba(0,0,0,.10);

    z-index:30;

}

.question{

    color:#244b76;

    font-size:27px;

    font-weight:900;

    text-align:center;

}

.sound{

    width:52px;

    height:52px;

    flex-shrink:0;

    border:none;

    border-radius:50%;

    background:#e4f2ff;

    color:#2478d8;

    font-size:25px;

}


/* =========================
   HINT
========================= */

.hint{

    position:absolute;

    top:242px;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    min-height:25px;

    color:#d7832e;

    font-size:18px;

    font-weight:900;

    text-align:center;

    z-index:30;

}


/* =========================
   ANSWERS
========================= */

.answers{

    position:absolute;

    top:700px;

    left:50%;

    transform:translateX(-50%);

    width:850px;

    height:270px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:20px;

    z-index:30;

    padding-top:200px;

}


/* =========================
   ANSWER BOX
========================= */

.answer{

    position:relative;

    height:270px;

    border:4px solid #c4e1fa;

    border-radius:28px;

    background:#ffffff;

    box-shadow:
        0 7px 17px rgba(0,0,0,.11);

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    transition:
        transform .15s ease,
        border-color .2s ease;

}

.answer:active{

    transform:scale(.96);

}

.answer img{

    width:67%;

    height:67%;

    object-fit:contain;

    pointer-events:none;

}


/* =========================
   CORRECT
========================= */

.answer.correct{

    border-color:#50c878;

    background:#effff4;

    animation:correctPop .5s ease;

}


/* =========================
   WRONG
========================= */

.answer.wrong{

    border-color:#edaaaa;

    animation:shake .45s ease;

}


@keyframes correctPop{

    50%{
        transform:scale(1.05);
    }

}


@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(8px);
    }

    75%{
        transform:translateX(-5px);
    }

}


/* =========================
   NEXT BUTTON
========================= */

.next{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:35px;

    width:190px;

    height:60px;

    border:none;

    border-radius:22px;

    background:#e4f2ff;

    color:#55718b;

    font-family:inherit;

    font-size:23px;

    font-weight:900;

    box-shadow:
        0 7px 17px rgba(0,0,0,.12);

    z-index:60;

    cursor:pointer;

    opacity:.5;

}

.next.ready{

    opacity:1;

}

.next:active{

    transform:
        translateX(-50%)
        scale(.95);

}


/* =========================
   POPUP
========================= */

.overlay{

    position:fixed;

    inset:0;

    background:
        rgba(25,65,100,.35);

    backdrop-filter:blur(4px);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:2000;

}

.overlay.show{

    display:flex;

}


.popup{

    width:600px;

    padding:38px 30px;

    background:white;

    border-radius:36px;

    text-align:center;

    box-shadow:
        0 20px 55px rgba(0,0,0,.22);

    animation:
        popupIn .4s ease;

}


@keyframes popupIn{

    from{

        transform:scale(.7);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}


.popup-icon{

    font-size:65px;

}


.popup h2{

    margin-top:8px;

    color:#244b76;

    font-size:34px;

    font-weight:900;

}


.popup p{

    margin-top:15px;

    color:#26384c;

    font-size:24px;

    font-weight:800;

    line-height:1.7;

}


.close{

    margin-top:25px;

    width:210px;

    height:60px;

    border:none;

    border-radius:22px;

    background:#e4f2ff;

    color:#55718b;

    font-family:inherit;

    font-size:22px;

    font-weight:900;

    cursor:pointer;

}


/* =====================================================
   SCALE FOR ALL SCREENS
===================================================== */

@media(max-width:700px){

    /*
       لا نغير قياسات العناصر.
       الصفحة كلها يتم تصغيرها كنسبة واحدة.
    */

}

</style>

</head>


<body>


<div
    class="page"
    id="page">


    <!-- السابق -->

    <button
        class="top-btn back"
        onclick="goBack()">

        ‹

    </button>


    <!-- القائمة -->

    <button
        class="top-btn menu"
        onclick="goMenu()">

        ☰

    </button>


    <!-- العنوان -->

    <div class="title">

        ⭐ اختبر معلوماتك!

    </div>


    <!-- الوقت -->

    <div
        class="timer"
        id="timer">

        ⏱️ 60

    </div>


    <!-- السؤال -->

    <div class="question-box">

        <button
            class="sound"
            onclick="readQuestion()">

            🔊

        </button>

        <div
            class="question"
            id="question">

            أين الدائرة؟

        </div>

    </div>


    <!-- التلميح -->

    <div
        class="hint"
        id="hint">

    </div>


    <!-- 3 خيارات -->

    <div
        class="answers">


        <button
            class="answer"
            data-correct="true">

            <img
                src="images/a7a.png"
                alt="الدائرة">

        </button>


        <button
            class="answer"
            data-correct="false">

            <img
                src="images/aa7.png"
                alt="اختيار">

        </button>


        <button
            class="answer"
            data-correct="false">

            <img
                src="images/a7.png"
                alt="اختيار">

        </button>


    </div>


    <!-- التالي -->

    <button
        class="next"
        id="nextButton">

        التالي ➜

    </button>


</div>


<!-- =========================
     POPUP
========================= -->

<div
    class="overlay"
    id="overlay">


    <div class="popup">


        <div class="popup-icon">

            🎉⭐

        </div>


        <h2>

            أحسنت!

        </h2>


        <p>

            انتهينا من أول شكل!<br>

            هيا بنا إلى الشكل الآخر ✨

        </p>


        <button
            class="close"
            onclick="closePopup()">

            إغلاق

        </button>

    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const page =
    document.getElementById(
        "page"
    );


const questionText =
    "أين الدائرة؟";


const hintText =
    "ابحث عن الشكل المستدير.";


const question =
    document.getElementById(
        "question"
    );


const hint =
    document.getElementById(
        "hint"
    );


const next =
    document.getElementById(
        "nextButton"
    );


const timerElement =
    document.getElementById(
        "timer"
    );


const cards =
    document.querySelectorAll(
        ".answer"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


let answered =
    false;


let timeLeft =
    60;


let timer;


/* =====================================================
   FIXED DESIGN SCALE
   1024 × 1366
===================================================== */

function resizePage(){

    const baseWidth = 1024;
    const baseHeight = 1366;

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    page.style.setProperty(
        "--page-scale",
        scale
    );

}


resizePage();


window.addEventListener(
    "resize",
    resizePage
);


window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   SPEECH
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "ar-SA";

    utterance.rate =
        .8;

    utterance.pitch =
        1.05;

    utterance.volume =
        1;

    speechSynthesis.speak(
        utterance
    );

}


function readQuestion(){

    speak(
        questionText
    );

}


/* =====================================================
   ANSWERS
===================================================== */

cards.forEach(
    card => {

        card.addEventListener(
            "click",
            function(){

                if(answered){

                    return;

                }


                const correct =
                    card.dataset.correct
                    === "true";


                if(correct){

                    answered =
                        true;


                    card.classList.add(
                        "correct"
                    );


                    cards.forEach(
                        c => {

                            c.style.pointerEvents =
                                "none";

                        }
                    );


                    hint.textContent =
                        "⭐ أحسنت!";


                    speak(
                        "أحسنت!"
                    );


                    next.classList.add(
                        "ready"
                    );

                }


                else{

                    card.classList.add(
                        "wrong"
                    );


                    hint.textContent =
                        "💡 " +
                        hintText;


                    speak(
                        "حاول مرة ثانية. " +
                        hintText
                    );


                    setTimeout(
                        () => {

                            card.classList.remove(
                                "wrong"
                            );

                        },
                        600
                    );

                }

            }
        );

    }
);


/* =====================================================
   NEXT
===================================================== */

next.addEventListener(
    "click",
    function(){

        if(!answered){

            speak(
                "اختر الإجابة الصحيحة أولًا"
            );

            return;

        }


        finishStage();

    }
);


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    clearInterval(timer);

    timeLeft =
        60;

    timerElement.textContent =
        "⏱️ 60";

    timerElement.classList.remove(
        "warning"
    );


    timer =
        setInterval(
            function(){

                timeLeft--;

                timerElement.textContent =
                    "⏱️ " +
                    timeLeft;


                if(
                    timeLeft <= 10
                ){

                    timerElement.classList.add(
                        "warning"
                    );

                }


                if(
                    timeLeft <= 0
                ){

                    clearInterval(
                        timer
                    );


                    speak(
                        "انتهى الوقت. لنحاول مرة أخرى."
                    );


                    hint.textContent =
                        "⏰ انتهى الوقت، لنحاول مرة أخرى.";


                    resetGame();

                }

            },
            1000
        );

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    answered =
        false;


    next.classList.remove(
        "ready"
    );


    cards.forEach(
        card => {

            card.classList.remove(
                "correct",
                "wrong"
            );

            card.style.pointerEvents =
                "auto";

        }
    );


    startTimer();

}


/* =====================================================
   FINISH
===================================================== */

function finishStage(){

    clearInterval(timer);


    localStorage.setItem(
        "circleShapeCompleted",
        "true"
    );


    overlay.classList.add(
        "show"
    );


    speak(
        "أحسنت! انتهينا من أول شكل. هيا بنا إلى الشكل الآخر."
    );

}


/* =====================================================
   CLOSE
===================================================== */

function closePopup(){

    overlay.classList.remove(
        "show"
    );

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    history.back();

}


/* =====================================================
   MENU
===================================================== */

function goMenu(){

    window.location.href =
        "home.html";

}


/* =====================================================
   START
===================================================== */

question.textContent =
    questionText;


/* إظهار الصفحة */

page.style.visibility =
    "visible";


/* قراءة السؤال */

setTimeout(
    readQuestion,
    500
);


/* تشغيل المؤقت */

startTimer();

</script>

</body>
</html>
