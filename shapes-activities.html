<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>اختبر معلوماتك - رفيق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Tajawal","Cairo",Arial,sans-serif;
    background:#e4f2ff;
}


/* =========================
   PAGE
========================= */

.page{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background-image:url("images/ak.jpeg");

    background-size:cover;

    background-position:center;

    /*
       مهم:
       نخفي الصفحة مؤقتًا حتى نعرف
       ثيم الطفل من قاعدة البيانات.
    */

    visibility:hidden;

}


/* SPACE */

.page.space{

    background-image:url("images/af.jpeg");

}


/* =========================
   TOP BUTTONS
========================= */

.top-btn{

    position:absolute;

    top:20px;

    width:62px;
    height:62px;

    border:none;

    border-radius:20px;

    background:rgba(255,255,255,.96);

    color:#365b82;

    font-size:35px;

    font-weight:900;

    box-shadow:
        0 6px 17px rgba(0,0,0,.12);

    z-index:50;

}

.back{
    left:20px;
}

.menu{
    right:20px;
}


/* =========================
   TITLE
========================= */

.title{

    position:absolute;

    top:18px;

    left:50%;

    transform:translateX(-50%);

    min-width:320px;

    padding:13px 30px;

    background:rgba(255,255,255,.96);

    border-radius:28px;

    color:#244b76;

    font-size:29px;

    font-weight:900;

    text-align:center;

    box-shadow:
        0 7px 20px rgba(0,0,0,.12);

    z-index:30;

}


/* =========================
   TIMER
========================= */

.timer{

    position:absolute;

    top:100px;

    left:50%;

    transform:translateX(-50%);

    min-width:120px;

    padding:8px 18px;

    background:rgba(255,255,255,.96);

    border-radius:18px;

    color:#244b76;

    font-size:19px;

    font-weight:900;

    text-align:center;

    box-shadow:
        0 5px 14px rgba(0,0,0,.10);

    z-index:30;

}

.timer.warning{

    color:#e34242;

    animation:timerPulse .7s infinite alternate;

}

@keyframes timerPulse{

    from{
        transform:translateX(-50%) scale(1);
    }

    to{
        transform:translateX(-50%) scale(1.07);
    }

}


/* =========================
   QUESTION
========================= */

.question-box{

    position:absolute;

    top:150px;

    left:50%;

    transform:translateX(-50%);

    width:min(650px,88vw);

    min-height:82px;

    padding:12px 22px;

    background:rgba(255,255,255,.97);

    border:4px solid #c4e1fa;

    border-radius:27px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

    box-shadow:
        0 7px 20px rgba(0,0,0,.10);

    z-index:30;

}

.question{

    color:#244b76;

    font-size:27px;

    font-weight:900;

    text-align:center;

}

.sound{

    width:52px;

    height:52px;

    flex-shrink:0;

    border:none;

    border-radius:50%;

    background:#e4f2ff;

    color:#2478d8;

    font-size:25px;

}


/* =========================
   HINT
========================= */

.hint{

    position:absolute;

    top:242px;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    min-height:25px;

    color:#d7832e;

    font-size:18px;

    font-weight:900;

    text-align:center;

    z-index:30;

}


/* =========================
   ANSWERS
========================= */

.answers{

    position:absolute;

    top:700px;

    left:50%;

    transform:translateX(-50%);

    width:min(850px,88vw);

    height:270px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:20px;

    z-index:30;

    padding-top:200px;

}


/* =========================
   ANSWER BOX
========================= */

.answer{

    position:relative;

    height:270px;

    border:4px solid #c4e1fa;

    border-radius:28px;

    background:rgba(255,255,255,.97);

    box-shadow:
        0 7px 17px rgba(0,0,0,.11);

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    transition:
        transform .15s ease,
        border-color .2s ease;

}

.answer:active{

    transform:scale(.96);

}

.answer img{

    width:67%;

    height:67%;

    object-fit:contain;

    pointer-events:none;

}


/* CORRECT */

.answer.correct{

    border-color:#50c878;

    background:#effff4;

    animation:correctPop .5s ease;

}


/* WRONG */

.answer.wrong{

    border-color:#edaaaa;

    animation:shake .45s ease;

}


@keyframes correctPop{

    50%{
        transform:scale(1.05);
    }

}


@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(8px);
    }

    75%{
        transform:translateX(-5px);
    }

}


/* =========================
   NEXT BUTTON
========================= */

.next{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:35px;

    width:190px;

    height:60px;

    border:none;

    border-radius:22px;

    background:#e4f2ff;

    color:#55718b;

    font-family:inherit;

    font-size:23px;

    font-weight:900;

    box-shadow:
        0 7px 17px rgba(0,0,0,.12);

    z-index:60;

    cursor:pointer;

    opacity:.5;

}

.next.ready{

    opacity:1;

}

.next:active{

    transform:
        translateX(-50%)
        scale(.95);

}


/* =========================
   CELEBRATION
========================= */

.celebration{

    position:fixed;

    inset:0;

    display:none;

    overflow:hidden;

    pointer-events:none;

    z-index:1000;

}

.celebration.show{

    display:block;

}


/* =========================
   CAR BALLOON
========================= */

.car-balloon{

    position:absolute;

    bottom:-190px;

    width:155px;

    height:180px;

    animation:
        carUp 5.5s ease-out forwards;

    animation-delay:var(--delay);

    filter:
        drop-shadow(
            0 8px 8px rgba(0,0,0,.15)
        );

}

.car-balloon-body{

    position:absolute;

    left:7px;

    top:10px;

    width:141px;

    height:110px;

    border-radius:
        52% 48% 45% 45%;

    background:
        linear-gradient(
            145deg,
            #ffb2b2,
            #ef6173
        );

    border:4px solid white;

}

.car-shape{

    position:absolute;

    left:18px;

    top:43px;

    width:105px;

    height:48px;

    background:
        linear-gradient(
            #ffffff,
            #e5f3ff
        );

    border:3px solid #405c73;

    border-radius:
        23px 27px 12px 12px;

}

.car-shape::before{

    content:"";

    position:absolute;

    left:22px;

    top:-24px;

    width:55px;

    height:27px;

    background:#8ed5ff;

    border:3px solid #405c73;

    border-bottom:none;

    border-radius:
        18px 18px 0 0;

}

.wheels{

    position:absolute;

    left:9px;

    right:9px;

    bottom:-17px;

    display:flex;

    justify-content:space-between;

}

.wheel{

    width:27px;

    height:27px;

    border-radius:50%;

    background:#263849;

    border:4px solid white;

}

.car-string{

    position:absolute;

    left:76px;

    top:116px;

    width:3px;

    height:65px;

    background:#718294;

}


@keyframes carUp{

    0%{

        bottom:-200px;

        opacity:0;

        transform:
            translateX(0)
            rotate(-7deg);

    }

    12%{
        opacity:1;
    }

    45%{

        transform:
            translateX(30px)
            rotate(7deg);

    }

    70%{

        transform:
            translateX(-25px)
            rotate(-5deg);

    }

    100%{

        bottom:115%;

        opacity:0;

        transform:
            translateX(25px)
            rotate(5deg);

    }

}


/* =========================
   ROCKET BALLOON
========================= */

.rocket-balloon{

    position:absolute;

    bottom:-210px;

    width:150px;

    height:195px;

    animation:
        rocketUp 5.5s ease-out forwards;

    animation-delay:var(--delay);

}


.rocket-body{

    position:absolute;

    left:40px;

    top:8px;

    width:70px;

    height:130px;

    border-radius:
        50px 50px 25px 25px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #d8edff
        );

    border:4px solid #557b9d;

}

.rocket-window{

    position:absolute;

    left:16px;

    top:27px;

    width:38px;

    height:38px;

    border-radius:50%;

    background:#72ccff;

    border:4px solid #4f769b;

}

.rocket-wing-left,
.rocket-wing-right{

    position:absolute;

    bottom:17px;

    width:38px;

    height:55px;

    background:#ef6673;

    border:3px solid #c94e5c;

}

.rocket-wing-left{

    left:3px;

    border-radius:
        24px 5px 5px 15px;

}

.rocket-wing-right{

    right:3px;

    border-radius:
        5px 24px 15px 5px;

}

.rocket-fire{

    position:absolute;

    left:48px;

    top:128px;

    width:55px;

    height:58px;

    background:
        linear-gradient(
            #ffd34e,
            #ff754f
        );

    clip-path:
        polygon(
            50% 100%,
            10% 25%,
            38% 43%,
            50% 0,
            62% 43%,
            90% 25%
        );

}

.rocket-string{

    position:absolute;

    left:74px;

    top:172px;

    width:3px;

    height:30px;

    background:#718294;

}


@keyframes rocketUp{

    0%{

        bottom:-220px;

        opacity:0;

        transform:
            translateX(0)
            rotate(-6deg);

    }

    12%{
        opacity:1;
    }

    45%{

        transform:
            translateX(-30px)
            rotate(7deg);

    }

    70%{

        transform:
            translateX(25px)
            rotate(-5deg);

    }

    100%{

        bottom:115%;

        opacity:0;

        transform:
            translateX(-20px)
            rotate(5deg);

    }

}


/* =========================
   SPARKLES
========================= */

.sparkle{

    position:absolute;

    font-size:34px;

    animation:
        sparkle 1.5s ease-out forwards;

}


@keyframes sparkle{

    0%{

        transform:scale(0);

        opacity:0;

    }

    50%{

        transform:scale(1.3);

        opacity:1;

    }

    100%{

        transform:
            translateY(-80px)
            scale(.6);

        opacity:0;

    }

}


/* =========================
   POPUP
========================= */

.overlay{

    position:fixed;

    inset:0;

    background:
        rgba(25,65,100,.45);

    backdrop-filter:blur(6px);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:2000;

}

.overlay.show{

    display:flex;

}


.popup{

    width:min(600px,88vw);

    padding:38px 30px;

    background:white;

    border-radius:36px;

    text-align:center;

    box-shadow:
        0 20px 55px rgba(0,0,0,.22);

    animation:
        popupIn .4s ease;

}


@keyframes popupIn{

    from{

        transform:scale(.7);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}


.popup-icon{

    font-size:65px;

}


.popup h2{

    margin-top:8px;

    color:#244b76;

    font-size:34px;

    font-weight:900;

}


.popup p{

    margin-top:15px;

    color:#26384c;

    font-size:24px;

    font-weight:800;

    line-height:1.7;

}


.close{

    margin-top:25px;

    width:210px;

    height:60px;

    border:none;

    border-radius:22px;

    background:#e4f2ff;

    color:#55718b;

    font-family:inherit;

    font-size:22px;

    font-weight:900;

    cursor:pointer;

}


/* =========================
   iPAD
========================= */

@media(min-width:768px){

    .answers{

        top:300px;

        height:270px;

    }

    .answer{

        height:270px;

    }

    .next{

        bottom:30px;

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .top-btn{

        width:52px;
        height:52px;

        top:12px;

        font-size:28px;

    }

    .back{
        left:12px;
    }

    .menu{
        right:12px;
    }

    .title{

        min-width:235px;

        font-size:22px;

        padding:10px 18px;

    }

    .timer{

        top:78px;

        font-size:16px;

    }

    .question-box{

        top:120px;

        width:92vw;

        min-height:70px;

    }

    .question{

        font-size:21px;

    }

    .sound{

        width:44px;
        height:44px;

        font-size:20px;

    }

    .hint{

        top:200px;

        font-size:15px;

    }

    .answers{

        top:235px;

        width:94vw;

        height:230px;

        gap:8px;

    }

    .answer{

        height:230px;

        border-radius:20px;

    }

    .answer img{

        width:70%;

        height:70%;

    }

    .next{

        width:140px;

        height:52px;

        bottom:15px;

        font-size:19px;

    }

    .popup{

        padding:28px 18px;

    }

    .popup-icon{

        font-size:55px;

    }

    .popup h2{

        font-size:28px;

    }

    .popup p{

        font-size:19px;

    }

}

</style>

</head>


<body>


<div
    class="page"
    id="page">


    <!-- السابق -->

    <button

    <!-- القائمة -->

    <button

    <div class="title">

    <!-- السؤال -->

    <div class="question-box">

            class="sound"
            onclick="readQuestion()">

        </div>

    </div>

    </div>

        class="answers">

            class="answer"

                src="images/a7a.png"

                src="images/aa7.png"
                alt="اختيار">

            class="answer"
            data-correct="false">

            <img
                src="images/a7.png"
                alt="اختيار">

        </button>


    </div>


    <!-- التالي -->

    <button
        class="next"
        id="nextButton">

        التالي ➜

    </button>


</div>


<!-- =========================
     CELEBRATION
========================= -->

<div
    class="celebration"
    id="celebration">

</div>


<!-- =========================
     POPUP
========================= -->

<div
    class="overlay"
    id="overlay">


    <div class="popup">


        <div class="popup-icon">

            🎉⭐

        </div>


        <h2>

            أحسنت!

        </h2>


        <p>

            انتهينا من أول شكل!<br>

            هيا بنا إلى الشكل الآخر ✨

        </p>

            إغلاق

        </button>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";


/*
   خلي نفس Publishable Key الموجود عندك
   في start.html
*/

const SUPABASE_ANON_KEY =
    "sb_publishable_m6m2gJXfPnu_Ns6LV-jxhg_cHa00bj6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   THEME
===================================================== */

let theme = "car";


/* =====================================================
   ELEMENTS
===================================================== */

const page =
    document.getElementById(
        "page"
    );

const questionText =
    "أين الدائرة؟";

const hintText =
    "ابحث عن الشكل المستدير.";

const question =
    document.getElementById(
        "question"
    );

const hint =
    document.getElementById(
        "hint"
    );

const next =
    document.getElementById(
        "nextButton"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const cards =
    document.querySelectorAll(
        ".answer"
    );

const celebration =
    document.getElementById(
        "celebration"
    );

const overlay =
    document.getElementById(
        "overlay"
    );


let answered =
    false;

let timeLeft =
    60;

let timer;


/* =====================================================
   WAIT FOR IMAGE
===================================================== */

function waitForImage(src){

    return new Promise(
        function(resolve){

            const img =
                new Image();

            img.onload =
                function(){

                    resolve();

                };

            img.onerror =
                function(){

                    resolve();

                };

            img.src =
                src;

        }
    );

}


/* =====================================================
   LOAD CHILD THEME
===================================================== */

async function loadChildTheme(){

    try{

        const childId =
            localStorage.getItem(
                "rafiqChildId"
            );


        console.log(
            "Shapes - Child ID:",
            childId
        );


        /*
           إذا لم يوجد الطفل
           نستخدم السيارات كافتراضي.
        */

        if(!childId){

            console.warn(
                "لا يوجد rafiqChildId، سيتم استخدام ثيم السيارات."
            );

            theme =
                "car";

            await showCorrectTheme();

            return;

        }


        const {
            data,
            error
        } =
            await supabaseClient

                .from("children")

                .select(
                    "id, interests"
                )

                .eq(
                    "id",
                    childId
                )

                .maybeSingle();


        if(error){

            console.error(
                "Shapes - Supabase Error:",
                error
            );

            theme =
                "car";

            await showCorrectTheme();

            return;

        }


        console.log(
            "Shapes - Child Data:",
            data
        );


        const interest =
            String(
                data?.interests || ""
            )
            .trim()
            .toLowerCase();


        console.log(
            "Shapes - Child Interest:",
            interest
        );


        if(

            interest === "فضاء" ||
            interest === "space"

        ){

            theme =
                "space";

        }

        else if(

            interest === "سيارات" ||
            interest === "سيارة" ||
            interest === "cars" ||
            interest === "car"

        ){

            theme =
                "car";

        }

        else{

            theme =
                "car";

        }


        await showCorrectTheme();

    }

    catch(error){

        console.error(
            "Shapes - Theme Error:",
            error
        );

        theme =
            "car";

        await showCorrectTheme();

    }

}


/* =====================================================
   SHOW CORRECT THEME
===================================================== */

async function showCorrectTheme(){

    const background =
        theme === "space"
        ? "images/af.jpeg"
        : "images/ak.jpeg";


    /*
       تحميل الخلفية أولًا
    */

    await waitForImage(
        background
    );


    /*
       إزالة أي ثيم سابق
    */

    page.classList.remove(
        "space"
    );


    /*
       تطبيق ثيم الفضاء
    */

    if(theme === "space"){

        page.classList.add(
            "space"
        );

    }


    /*
       إظهار الصفحة بعد تحديد الثيم
    */

    page.style.visibility =
        "visible";


    console.log(
        "Shapes Theme Ready:",
        theme
    );

}


/* =====================================================
   SPEECH
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "ar-SA";

    utterance.rate =
        .8;

    utterance.pitch =
        1.05;

    utterance.volume =
        1;

    speechSynthesis.speak(
        utterance
    );

}


function readQuestion(){

    speak(
        questionText
    );

}


/* =====================================================
   ANSWERS
===================================================== */

cards.forEach(
    card => {

        card.addEventListener(
            "click",
            function(){

                if(answered){

                    return;

                }


                const correct =
                    card.dataset.correct
                    === "true";


                /* CORRECT */

                if(correct){

                    answered =
                        true;


                    card.classList.add(
                        "correct"
                    );


                    cards.forEach(
                        c => {

                            c.style.pointerEvents =
                                "none";

                        }
                    );


                    hint.textContent =
                        "⭐ أحسنت!";


                    speak(
                        "أحسنت!"
                    );


                    next.classList.add(
                        "ready"
                    );


                    celebrate();

                }


                /* WRONG */

                else{

                    card.classList.add(
                        "wrong"
                    );


                    hint.textContent =
                        "💡 " +
                        hintText;


                    speak(
                        "حاول مرة ثانية. " +
                        hintText
                    );


                    setTimeout(
                        () => {

                            card.classList.remove(
                                "wrong"
                            );

                        },
                        600
                    );

                }

            }
        );

    }
);


/* =====================================================
   NEXT
===================================================== */

next.addEventListener(
    "click",
    function(){

        if(!answered){

            speak(
                "اختر الإجابة الصحيحة أولًا"
            );

            return;

        }


        finishStage();

    }
);


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    clearInterval(timer);

    timeLeft =
        60;

    timerElement.textContent =
        "⏱️ 60";

    timerElement.classList.remove(
        "warning"
    );


    timer =
        setInterval(
            function(){

                timeLeft--;

                timerElement.textContent =
                    "⏱️ " +
                    timeLeft;


                if(
                    timeLeft <= 10
                ){

                    timerElement.classList.add(
                        "warning"
                    );

                }


                if(
                    timeLeft <= 0
                ){

                    clearInterval(
                        timer
                    );


                    speak(
                        "انتهى الوقت. لنحاول مرة أخرى."
                    );


                    hint.textContent =
                        "⏰ انتهى الوقت، لنحاول مرة أخرى.";


                    resetGame();

                }

            },
            1000
        );

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    answered =
        false;


    next.classList.remove(
        "ready"
    );


    cards.forEach(
        card => {

            card.classList.remove(
                "correct",
                "wrong"
            );

            card.style.pointerEvents =
                "auto";

        }
    );


    startTimer();

}


/* =====================================================
   CELEBRATION
===================================================== */

function celebrate(){

    celebration.classList.add(
        "show"
    );


    if(theme === "car"){

        createCars();

    }

    else{

        createRockets();

    }


    createSparkles();


    setTimeout(
        () => {

            celebration.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =====================================================
   CARS
===================================================== */

function createCars(){

    for(
        let i=0;
        i<7;
        i++
    ){

        const car =
            document.createElement(
                "div"
            );


        car.className =
            "car-balloon";


        car.style.left =
            (
                2 +
                Math.random()*92
            ) + "%";


        car.style.setProperty(
            "--delay",
            (
                Math.random()*.6
            ) + "s"
        );


        car.innerHTML = `

            <div
                class="car-balloon-body">

                <div
                    class="car-shape">

                    <div
                        class="wheels">

                        <span
                            class="wheel">
                        </span>

                        <span
                            class="wheel">
                        </span>

                    </div>

                </div>

            </div>

            <div
                class="car-string">
            </div>

        `;


        celebration.appendChild(
            car
        );


        setTimeout(
            () => car.remove(),
            6500
        );

    }

}


/* =====================================================
   ROCKETS
===================================================== */

function createRockets(){

    for(
        let i=0;
        i<7;
        i++
    ){

        const rocket =
            document.createElement(
                "div"
            );


        rocket.className =
            "rocket-balloon";


        rocket.style.left =
            (
                2 +
                Math.random()*92
            ) + "%";


        rocket.style.setProperty(
            "--delay",
            (
                Math.random()*.6
            ) + "s"
        );


        rocket.innerHTML = `

            <div
                class="rocket-body">

                <div
                    class="rocket-window">
                </div>

                <div
                    class="rocket-wing-left">
                </div>

                <div
                    class="rocket-wing-right">
                </div>

            </div>

            <div
                class="rocket-fire">
            </div>

            <div
                class="rocket-string">
            </div>

        `;


        celebration.appendChild(
            rocket
        );


        setTimeout(
            () => rocket.remove(),
            6500
        );

    }

}


/* =====================================================
   SPARKLES
===================================================== */

function createSparkles(){

    for(
        let i=0;
        i<14;
        i++
    ){

        const sparkle =
            document.createElement(
                "div"
            );


        sparkle.className =
            "sparkle";


        sparkle.textContent =
            Math.random() > .5
            ? "⭐"
            : "✨";


        sparkle.style.left =
            (
                5 +
                Math.random()*90
            ) + "%";


        sparkle.style.top =
            (
                20 +
                Math.random()*65
            ) + "%";


        sparkle.style.animationDelay =
            (
                Math.random()*.4
            ) + "s";


        celebration.appendChild(
            sparkle
        );


        setTimeout(
            () => sparkle.remove(),
            1800
        );

    }

}


/* =====================================================
   FINISH
===================================================== */

function finishStage(){

    clearInterval(timer);


    localStorage.setItem(
        "circleShapeCompleted",
        "true"
    );


    overlay.classList.add(
        "show"
    );


    speak(
        "أحسنت! انتهينا من أول شكل. هيا بنا إلى الشكل الآخر."
    );

}


/* =====================================================
   CLOSE
===================================================== */

function closePopup(){

    overlay.classList.remove(
        "show"
    );

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    history.back();

}


/* =====================================================
   MENU
===================================================== */

function goMenu(){

    window.location.href =
        "home.html";

}


/* =====================================================
   START
===================================================== */

question.textContent =
    questionText;


/*
   مهم جدًا:
   ما يبدأ السؤال ولا المؤقت
   إلا بعد معرفة ثيم الطفل.
*/

async function startGame(){

    await loadChildTheme();


    /*
       الآن الصفحة ظهرت بالثيم الصحيح.
    */

    setTimeout(
        readQuestion,
        500
    );


    startTimer();

}


/* =====================================================
   START GAME
===================================================== */

startGame();

</script>
