<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ارسم شعورك - رفيق</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    background-image:
        url("images/Car4.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;

    color: #555;

    overflow-x: hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: 100%;

    min-height: 100vh;

    padding:
        90px 20px 70px;

    position: relative;
}


/* =====================================================
   PREVIOUS BUTTON - TOP LEFT
===================================================== */

.previous-button {

    position: fixed;

    top: 35px;

    left: 35px;

    width: 155px;

    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,0.18);

    z-index: 1001;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.previous-button:hover {

    transform:
        translateY(-3px);

    background: #d8edfc;
}

.previous-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: fixed;

    top: 35px;

    right: 35px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.94);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,0.18);

    z-index: 1000;

    transition:
        transform 0.2s ease;
}

.menu-button:hover {

    transform:
        translateY(-3px);
}

.menu-button:active {

    transform:
        scale(0.95);
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: fixed;

    top: 115px;

    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,0.96);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,0.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: 0.2s ease;
}

.side-menu button:hover {

    background: #e4f2ff;

    transform:
        translateX(-3px);
}

.side-menu button:last-child {

    margin-bottom: 0;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width:
        min(1100px, 96vw);

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    z-index: 10;
}


/* =====================================================
   FEELING CARD
   TITLE REMOVED
===================================================== */

.feeling-card {

    width: 650px;

    max-width: 92vw;

    min-height: 125px;

    background: #e4f2ff;

    border-radius: 32px;

    padding:
        20px 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    box-shadow:
        0 10px 25px
        rgba(70,100,120,0.17);

    animation:
        cardFloat 4s ease-in-out infinite;
}

@keyframes cardFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-5px);
    }
}


/* =====================================================
   ROBOT
===================================================== */

.robot {

    font-size: 66px;

    display: inline-block;

    animation:
        robotBounce 2.4s
        ease-in-out infinite;
}

@keyframes robotBounce {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    30% {
        transform:
            translateY(-7px)
            rotate(-4deg);
    }

    60% {
        transform:
            translateY(0)
            rotate(4deg);
    }
}


/* =====================================================
   FEELING TEXT
===================================================== */

.feeling-text {

    text-align: right;
}

.feeling-text h2 {

    margin:
        0 0 7px;

    font-size: 29px;

    font-weight: 900;

    color: #555;
}

.feeling-text p {

    margin: 0;

    font-size: 20px;

    font-weight: 600;

    color: #777;
}


/* =====================================================
   DRAWING TOOLS AREA
===================================================== */

.drawing-tools-area {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    margin-top: 25px;

    position: relative;

    z-index: 30;
}


/* =====================================================
   COLORS
===================================================== */

.colors {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 14px;

    flex-wrap: wrap;

    position: relative;

    z-index: 30;
}

.color {

    width: 52px;

    height: 52px;

    border-radius: 50%;

    border: 5px solid #fff;

    cursor: pointer;

    box-shadow:
        0 5px 12px
        rgba(50,70,90,0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.color:hover {

    transform:
        scale(1.12);
}

.color:active {

    transform:
        scale(0.95);
}

.color.active {

    transform:
        scale(1.18);

    box-shadow:
        0 0 0 4px
        rgba(120,150,170,0.28),
        0 6px 15px
        rgba(50,70,90,0.20);
}


/* =====================================================
   COLORS
===================================================== */

.yellow {
    background: #f4d35e;
}

.light-blue {
    background: #9ed5ed;
}

.purple {
    background: #9b6bb3;
}

.dark-blue {
    background: #263b4d;
}

.green {
    background: #4f8b50;
}

.red {
    background: #c94c55;
}

.pink {
    background: #e6a1ae;
}


/* =====================================================
   TOOLS
===================================================== */

.tools {

    margin-top: 22px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 20px;

    position: relative;

    z-index: 30;
}

.tool-button {

    width: 200px;

    height: 62px;

    border: none;

    border-radius: 22px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 16px
        rgba(70,90,110,0.15);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.tool-button:hover {

    transform:
        translateY(-3px);
}

.tool-button:active {

    transform:
        scale(0.97);
}

.tool-button.active {

    box-shadow:
        0 0 0 4px
        rgba(120,150,170,0.25),
        0 8px 18px
        rgba(70,90,110,0.18);
}


/* =====================================================
   SEND BUTTON
===================================================== */

.send-button {

    width: 330px;

    height: 68px;

    margin-top: 22px;

    border: none;

    border-radius: 24px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 23px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(70,90,110,0.17);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    position: relative;

    z-index: 30;
}

.send-button:hover {

    transform:
        translateY(-4px);
}

.send-button:active {

    transform:
        scale(0.97);
}


/* =====================================================
   CAR STAGE
===================================================== */

.car-stage {

    position: relative;

    width: 955px;

    height: 580px;

    max-width: 96vw;

    margin-top: 100px;

    overflow: visible;

    z-index: 10;
}


/* =====================================================
   CAR IMAGE
===================================================== */

.car-image {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

    z-index: 1;
}


/* =====================================================
   CANVAS
===================================================== */

#drawingCanvas {

    position: absolute;

    z-index: 2;

    left: 8.8%;

    top: 7.5%;

    width: 82.5%;

    height: 71%;

    background: transparent;

    touch-action: none;

    cursor: crosshair;

    clip-path:
        polygon(
            14% 7%,
            22% 0%,
            70% 0%,
            75% 8%,
            88% 18%,
            95% 40%,
            98% 70%,
            94% 87%,
            86% 91%,
            76% 88%,
            71% 96%,
            27% 96%,
            22% 88%,
            12% 91%,
            5% 86%,
            2% 68%,
            4% 40%,
            8% 22%
        );
}


/* =====================================================
   DRAWING HINT
===================================================== */

.drawing-hint {

    position: absolute;

    left: 50%;

    top: 42%;

    transform:
        translate(-50%, -50%);

    z-index: 4;

    pointer-events: none;

    font-size: 20px;

    font-weight: 700;

    color:
        rgba(100,120,135,0.28);

    white-space: nowrap;

    transition:
        opacity 0.3s ease;
}

.drawing-hint.hidden {

    opacity: 0;
}


/* =====================================================
   IPAD PORTRAIT
===================================================== */

@media (min-width: 768px) {

    .page {

        min-height: 1366px;

        padding-top: 105px;
    }


    /* =================================================
       KEEP FEELING CARD HIGH
       EVEN AFTER REMOVING THE TITLE
    ================================================= */

    .feeling-card {

        width: 650px;

        margin-top: 80px;
    }


    /* =================================================
       TOOLS CENTER
    ================================================= */

    .drawing-tools-area {

        margin-top: 22px;

        width: 100%;

        align-items: center;
    }


    .colors {

        justify-content: center;

        width: 100%;
    }


    .tools {

        justify-content: center;

        width: 100%;
    }


    .send-button {

        align-self: center;
    }


    /* =================================================
       CAR - SAME LOWER POSITION
    ================================================= */

    .car-stage {

        width: 900px;

        height: 547px;

        margin-top: 120px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 767px) {

    .page {

        padding:
            95px 10px 50px;
    }


    .previous-button {

        top: 20px;

        left: 20px;

        width: 125px;

        height: 52px;

        font-size: 18px;
    }


    .menu-button {

        top: 20px;

        right: 20px;

        width: 55px;

        height: 55px;

        font-size: 27px;
    }


    .side-menu {

        top: 90px;

        right: 20px;

        width: 220px;
    }


    /* =================================================
       FEELING CARD
    ================================================= */

    .feeling-card {

        width: 94vw;

        min-height: 105px;

        padding: 15px;

        gap: 12px;

        margin-top: 25px;
    }


    .robot {

        font-size: 48px;
    }


    .feeling-text h2 {

        font-size: 21px;
    }


    .feeling-text p {

        font-size: 15px;
    }


    /* =================================================
       TOOLS
    ================================================= */

    .drawing-tools-area {

        margin-top: 18px;

        align-items: center;
    }


    .colors {

        gap: 9px;

        justify-content: center;

        width: 100%;
    }


    .color {

        width: 42px;

        height: 42px;

        border-width: 4px;
    }


    .tools {

        gap: 10px;

        margin-top: 18px;

        justify-content: center;

        width: 100%;
    }


    .tool-button {

        width: 160px;

        height: 56px;

        font-size: 17px;
    }


    .send-button {

        width: 280px;

        height: 62px;

        margin-top: 18px;

        font-size: 20px;
    }


    /* =================================================
       CAR
    ================================================= */

    .car-stage {

        width: 96vw;

        height:
            calc(96vw * 0.6073);

        margin-top: 45px;
    }


    #drawingCanvas {

        left: 8.8%;

        top: 7.5%;

        width: 82.5%;

        height: 71%;
    }


    .drawing-hint {

        font-size: 14px;
    }

}

</style>

<body>

<script>

/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle(
        "show"
    );
}


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );


        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goHome() {

    window.location.href =
        "home.html";
}


function goProfile() {

    alert(
        "👤 صفحة ملفي\n\nسنصممها لاحقًا."
    );
}


function goProgress() {

    alert(
        "⭐ صفحة تقدمي\n\nسنصممها لاحقًا."
    );
}


function goBackToEmotions() {

    window.location.href =
        "emotions.html";
}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "drawingCanvas"
    );

const ctx =
    canvas.getContext("2d");


let drawing = false;

let currentColor =
    "#f4d35e";

let eraserMode =
    false;

let lastX = 0;

let lastY = 0;

let hasDrawing =
    false;


/* =====================================================
   CANVAS SETUP
===================================================== */

function setupCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.round(
            rect.width * dpr
        );

    canvas.height =
        Math.round(
            rect.height * dpr
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.lineWidth =
        7;
}


setupCanvas();


/* =====================================================
   GET POSITION
===================================================== */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };
}


/* =====================================================
   CHECK DRAWING AREA
===================================================== */

function isInsideDrawingArea(
    x,
    y
) {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    const nx =
        x / width;

    const ny =
        y / height;


    if (
        nx < 0.03 ||
        nx > 0.98 ||
        ny < 0 ||
        ny > 0.96
    ) {

        return false;
    }


    if (
        ny < 0.20 &&
        nx < 0.14
    ) {

        return false;
    }


    if (
        ny < 0.18 &&
        nx > 0.75
    ) {

        return false;
    }


    const wheelLeftX =
        0.18;

    const wheelRightX =
        0.82;

    const wheelY =
        0.96;


    const leftDistance =
        Math.sqrt(
            Math.pow(
                nx - wheelLeftX,
                2
            ) +
            Math.pow(
                ny - wheelY,
                2
            )
        );


    const rightDistance =
        Math.sqrt(
            Math.pow(
                nx - wheelRightX,
                2
            ) +
            Math.pow(
                ny - wheelY,
                2
            )
        );


    if (
        leftDistance < 0.15 ||
        rightDistance < 0.15
    ) {

        return false;
    }


    return true;
}


/* =====================================================
   START DRAWING
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        const position =
            getPosition(event);


        if (
            !isInsideDrawingArea(
                position.x,
                position.y
            )
        ) {

            return;
        }


        drawing = true;


        canvas.setPointerCapture(
            event.pointerId
        );


        lastX =
            position.x;

        lastY =
            position.y;


        drawDot(
            lastX,
            lastY
        );


        hasDrawing =
            true;


        document
            .getElementById(
                "drawingHint"
            )
            .classList
            .add(
                "hidden"
            );

    }
);


/* =====================================================
   DRAW
===================================================== */

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!drawing) {

            return;
        }


        const position =
            getPosition(event);


        if (
            !isInsideDrawingArea(
                position.x,
                position.y
            )
        ) {

            return;
        }


        drawLine(
            lastX,
            lastY,
            position.x,
            position.y
        );


        lastX =
            position.x;

        lastY =
            position.y;

    }
);


/* =====================================================
   STOP
===================================================== */

canvas.addEventListener(
    "pointerup",
    stopDrawing
);

canvas.addEventListener(
    "pointercancel",
    stopDrawing
);

canvas.addEventListener(
    "pointerleave",
    stopDrawing
);


function stopDrawing() {

    drawing = false;
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    x1,
    y1,
    x2,
    y2
) {

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );


    if (eraserMode) {

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.lineWidth =
            35;

    } else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.strokeStyle =
            currentColor;

        ctx.lineWidth =
            7;
    }


    ctx.stroke();


    ctx.globalCompositeOperation =
        "source-over";
}


/* =====================================================
   DRAW DOT
===================================================== */

function drawDot(
    x,
    y
) {

    ctx.beginPath();


    ctx.arc(
        x,
        y,
        eraserMode
            ? 17
            : 3.5,
        0,
        Math.PI * 2
    );


    if (eraserMode) {

        ctx.globalCompositeOperation =
            "destination-out";

    } else {

        ctx.globalCompositeOperation =
            "source-over";

        ctx.fillStyle =
            currentColor;
    }


    ctx.fill();


    ctx.globalCompositeOperation =
        "source-over";
}


/* =====================================================
   COLORS
===================================================== */

const colorButtons =
    document.querySelectorAll(
        ".color"
    );


colorButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                currentColor =
                    this.dataset.color;


                eraserMode =
                    false;


                document
                    .getElementById(
                        "eraserButton"
                    )
                    .classList
                    .remove(
                        "active"
                    );


                colorButtons.forEach(
                    item => {

                        item.classList
                            .remove(
                                "active"
                            );

                    }
                );


                this.classList.add(
                    "active"
                );

            }
        );

    }
);


/* =====================================================
   ERASER
===================================================== */

document
    .getElementById(
        "eraserButton"
    )
    .addEventListener(
        "click",
        function() {

            eraserMode =
                !eraserMode;


            this.classList.toggle(
                "active",
                eraserMode
            );

        }
    );


/* =====================================================
   CLEAR ALL
===================================================== */

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        function() {

            ctx.clearRect(
                0,
                0,
                canvas.clientWidth,
                canvas.clientHeight
            );


            hasDrawing =
                false;


            document
                .getElementById(
                    "drawingHint"
                )
                .classList
                .remove(
                    "hidden"
                );

        }
    );


/* =====================================================
   SEND DRAWING
===================================================== */

document
    .getElementById(
        "sendButton"
    )
    .addEventListener(
        "click",
        function() {

            if (!hasDrawing) {

                alert(
                    "🎨 ارسم شيئًا أولًا!"
                );

                return;
            }


            const imageData =
                canvas.toDataURL(
                    "image/png"
                );


            localStorage.setItem(
                "rafiqFeelingDrawing",
                imageData
            );


            alert(
                "🌈 أحسنت!\n\nتم إرسال رسمتك بنجاح."
            );

        }
    );

</script>
