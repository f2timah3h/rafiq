<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>الألعاب - رفيق</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    color: #555;

    overflow-x: hidden;

    background-color: #ffffff;

    background-image:
        url("images/play.jpeg");

    background-size: 100% auto;

    background-position:
        center bottom;

    background-repeat: no-repeat;

    background-attachment: fixed;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}


/* Clouds */

.cloud {

    position: absolute;

    color: #ffffff;

    font-size: 90px;

    opacity: .55;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(100,150,180,.08)
        );

    animation:
        cloudFloat 5s ease-in-out infinite;
}

.cloud-one {

    top: 120px;

    left: 45px;
}

.cloud-two {

    top: 230px;

    right: 35px;

    animation-delay: 1.5s;
}

.cloud-three {

    top: 690px;

    left: 15px;

    font-size: 75px;

    animation-delay: 2s;
}

.cloud-four {

    top: 720px;

    right: 20px;

    font-size: 75px;

    animation-delay: 1s;
}


@keyframes cloudFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-10px);
    }
}


/* Stars */

.star {

    position: absolute;

    color: #f6d66b;

    font-size: 28px;

    animation:
        starTwinkle 2.5s ease-in-out infinite;
}

.star-one {

    top: 250px;

    left: 95px;
}

.star-two {

    top: 310px;

    right: 90px;

    animation-delay: .8s;
}

.star-three {

    top: 600px;

    left: 70px;

    animation-delay: 1.2s;
}

.star-four {

    top: 650px;

    right: 65px;

    animation-delay: 1.8s;
}


@keyframes starTwinkle {

    0%,
    100% {

        opacity: .4;

        transform:
            scale(.9);
    }

    50% {

        opacity: 1;

        transform:
            scale(1.15);
    }
}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button {

    position: fixed;

    top: 35px;

    left: 35px;

    width: 155px;

    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,.18);

    z-index: 1001;

    transition: .2s ease;
}

.previous-button:hover {

    transform:
        translateY(-3px);

    background:
        #d8edfc;
}

.previous-button:active {

    transform:
        scale(.96);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: fixed;

    top: 35px;

    right: 35px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,.96);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,.18);

    z-index: 1000;

    transition: .2s ease;
}

.menu-button:hover {

    transform:
        translateY(-3px);
}

.menu-button:active {

    transform:
        scale(.95);
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: fixed;

    top: 115px;

    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition: .3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: .2s ease;
}

.side-menu button:hover {

    background:
        #e4f2ff;

    transform:
        translateX(-3px);
}


/* =====================================================
   PAGE
===================================================== */

.page {

    position: relative;

    z-index: 5;

    width: 100%;

    min-height: 1366px;

    padding:
        115px 35px 180px;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width:
        900px;

    max-width: 95vw;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    margin:
        20px 0 5px;

    padding:
        18px 50px;

    border-radius: 40px;

    background:
        rgba(255,255,255,.80);

    box-shadow:
        0 8px 25px
        rgba(90,130,160,.10);

    color:
        #40566d;

    font-size: 42px;

    font-weight: 900;

    text-align: center;
}

.subtitle {

    margin:
        8px 0 35px;

    color:
        #8296a9;

    font-size: 22px;

    font-weight: 700;

    text-align: center;
}


/* =====================================================
   GAME GRID
===================================================== */

.games-grid {

    width: 850px;

    max-width: 100%;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 25px 30px;
}


/* =====================================================
   GAME CARD
===================================================== */

.game-card {

    position: relative;

    height: 245px;

    border-radius: 32px;

    border:
        3px solid
        rgba(255,255,255,.9);

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 9px 25px
        rgba(70,100,120,.15);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.game-card:hover {

    transform:
        translateY(-7px)
        scale(1.015);

    box-shadow:
        0 15px 32px
        rgba(70,100,120,.20);
}

.game-card:active {

    transform:
        scale(.97);
}


/* =====================================================
   CARD BACKGROUNDS
===================================================== */

.colors-card {

    background:
        linear-gradient(
            135deg,
            #fff0f2,
            #eaf6ff
        );
}

.fruits-card {

    background:
        linear-gradient(
            135deg,
            #effbe9,
            #fff8dc
        );
}

.shapes-card {

    background:
        linear-gradient(
            135deg,
            #eef0ff,
            #eaf7ff
        );
}

.social-card {

    background:
        linear-gradient(
            135deg,
            #fff6e3,
            #fff0d2
        );
}

.routine-card {

    background:
        linear-gradient(
            135deg,
            #f2ecff,
            #eaf5ff
        );
}

.letters-card {

    background:
        linear-gradient(
            135deg,
            #eaf7ff,
            #edf4ff
        );
}


/* =====================================================
   CARD TITLE
===================================================== */

.card-title {

    position: absolute;

    top: 18px;

    right: 20px;

    left: 20px;

    z-index: 3;

    margin: 0;

    color:
        #40566d;

    font-size: 27px;

    font-weight: 900;

    text-align: center;

    line-height: 1.3;
}


/* =====================================================
   CARD IMAGE
===================================================== */

.card-image {

    position: absolute;

    left: 50%;

    bottom: 5px;

    transform:
        translateX(-50%);

    width: 78%;

    height: 175px;

    object-fit: contain;

    object-position: center bottom;

    transition:
        transform .3s ease;
}

.game-card:hover .card-image {

    transform:
        translateX(-50%)
        scale(1.06);
}


/* =====================================================
   ARROW
===================================================== */

.card-arrow {

    position: absolute;

    left: 18px;

    bottom: 15px;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.92);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    font-weight: 900;

    color:
        #55718b;

    box-shadow:
        0 5px 12px
        rgba(60,80,100,.15);

    z-index: 5;
}


/* =====================================================
   BOTTOM DECORATION
===================================================== */

.playground {

    width: 100%;

    height: 170px;

    position: fixed;

    bottom: 0;

    left: 0;

    z-index: 1;

    pointer-events: none;

    background:
        linear-gradient(
            180deg,
            transparent 0%,
            rgba(228,242,255,.3) 30%,
            rgba(198,229,190,.55) 100%
        );

    border-radius:
        50% 50% 0 0;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 767px) {

    .page {

        min-height: 100vh;

        padding:
            90px 15px 100px;
    }

    .previous-button {

        top: 20px;

        left: 20px;

        width: 125px;

        height: 52px;

        font-size: 18px;
    }

    .menu-button {

        top: 20px;

        right: 20px;

        width: 55px;

        height: 55px;

        font-size: 27px;
    }

    .side-menu {

        top: 90px;

        right: 20px;

        width: 220px;
    }

    .title {

        font-size: 29px;

        padding:
            14px 22px;

        margin-top: 10px;
    }

    .subtitle {

        font-size: 17px;

        margin-bottom: 25px;
    }

    .games-grid {

        grid-template-columns:
            1fr;

        gap: 16px;
    }

    .game-card {

        height: 220px;
    }

    .card-title {

        font-size: 23px;

        top: 14px;
    }

    .card-image {

        height: 155px;

        width: 75%;
    }

    .card-arrow {

        width: 43px;

        height: 43px;

        left: 14px;

        bottom: 12px;

        font-size: 22px;
    }

}


/* =====================================================
   TABLET / IPAD PORTRAIT
===================================================== */

@media
(min-width: 768px)
and (max-width: 1100px) {

    .games-grid {

        width: 850px;

        max-width: 94vw;
    }

    .game-card {

        height: 235px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    

</div>


<!-- =====================================================
     PREVIOUS
===================================================== -->

<button
class="previous-button"
onclick="goBack()">

← السابق

</button>


<!-- =====================================================
     MENU
===================================================== -->

<button
class="menu-button"
id="menuButton"
onclick="toggleMenu()">

☰

</button>


<div
class="side-menu"
id="sideMenu">

    <button onclick="goHome()">
        🏠 الرئيسية
    </button>

    <button onclick="goProfile()">
        👤 ملفي
    </button>

    <button onclick="goProgress()">
        ⭐ تقدمي
    </button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">

<div class="content">


    <!-- TITLE -->

    <h1 class="title">

        🎮 اختر اللعبة التي تريدها

    </h1>


    <p class="subtitle">

        هيا نلعب ونتعلم معًا يا رفيق! ٍ

    </p>


    <!-- =================================================
         GAME CARDS
    ================================================== -->

    <div class="games-grid">


        <!-- COLORS -->

        <div
        class="game-card colors-card"
        onclick="openGame('colors')">

            <h2 class="card-title">

                الألوان

            </h2>

            <img
            src="images/colori.png"
            class="card-image"
            alt="الألوان">

            

        </div>


        <!-- SHAPES -->

        <div
        class="game-card shapes-card"
        onclick="openGame('shapes')">

            <h2 class="card-title">

                الأشكال

            </h2>

            <img
            src="images/ash.png"
            class="card-image"
            alt="الأشكال">

            

        </div>


        <!-- FRUITS -->

        <div
        class="game-card fruits-card"
        onclick="openGame('fruits')">

            <h2 class="card-title">

                الفواكه والخضروات

            </h2>

            <img
            src="images/fruit.png"
            class="card-image"
            alt="الفواكه والخضروات">

          

        </div>


        <!-- SOCIAL -->

        <div
        class="game-card social-card"
        onclick="openGame('social')">

            <h2 class="card-title">

                التواصل والمواقف الاجتماعية

            </h2>

            <img
            src="images/taw.png"
            class="card-image"
            alt="التواصل والمواقف الاجتماعية">

           

        </div>


        <!-- ROUTINE -->

        <div
        class="game-card routine-card"
        onclick="openGame('routine')">

            <h2 class="card-title">

                الروتين

            </h2>

            <img
            src="images/rut.png"
            class="card-image"
            alt="الروتين">

           

        </div>


        <!-- LETTERS & NUMBERS -->

        <div
        class="game-card letters-card"
        onclick="openGame('letters')">

            <h2 class="card-title">

                الحروف والأرقام

            </h2>

            <img
            src="images/letter.png"
            class="card-image"
            alt="الحروف والأرقام">

            
        </div>


    </div>


</div>

</main>


<!-- =====================================================
     BOTTOM
===================================================== -->



<script>

/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle(
        "show"
    );
}


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );

        if (
            !menu.contains(
                event.target
            ) &&
            !button.contains(
                event.target
            )
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goBack() {

    window.location.href =
        "home.html";
}


function goHome() {

    window.location.href =
        "home.html";
}


function goProfile() {

    alert(
        "👤 صفحة ملفي\n\nسنصممها لاحقًا."
    );
}


function goProgress() {

    alert(
        "⭐ صفحة تقدمي\n\nسنصممها لاحقًا."
    );
}


/* =====================================================
   OPEN GAME
===================================================== */

function openGame(game) {


    if (game === "colors") {

        window.location.href =
            "colors.html";

    }


    else if (game === "shapes") {

        window.location.href =
            "shapes.html";

    }


    else if (game === "fruits") {

        window.location.href =
            "fruits.html";

    }


    else if (game === "social") {

        window.location.href =
            "social.html";

    }


    else if (game === "routine") {

        window.location.href =
            "routine.html";

    }


    else if (game === "letters") {

        window.location.href =
            "letters.html";

    }

}

</script>


</body>

</html>
