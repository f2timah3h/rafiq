<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ما لون هذه السمكة؟</title>


<style>

/* =========================================================
   إعدادات الصفحة الأساسية
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {

    font-family: "Tajawal", "Cairo", Arial, sans-serif;

    /* خلفية صفحة الأخضر */
    background-image: url("images/gt.jpeg");

    background-size: 100% 100%;

    background-position: center;

    background-repeat: no-repeat;

    color: #55718b;
}


/* =========================================================
   زر السابق
========================================================= */

.previous-btn {

    position: fixed;

    top: 35px;
    left: 35px;

    width: 155px;
    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 24px;

    font-weight: 700;

    cursor: pointer;

    z-index: 1000;

    transition: 0.2s ease;
}

.previous-btn:hover {

    background: #d8edfc;

    transform: translateY(-2px);
}


/* =========================================================
   زر القائمة
========================================================= */

.menu-btn {

    position: fixed;

    top: 32px;
    right: 35px;

    width: 65px;
    height: 65px;

    border: none;

    border-radius: 22px;

    background: rgba(255,255,255,0.82);

    font-size: 31px;

    cursor: pointer;

    z-index: 1100;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.06);
}


/* =========================================================
   القائمة الجانبية
========================================================= */

.side-menu {

    position: fixed;

    top: 108px;
    right: 35px;

    width: 245px;

    background: rgba(255,255,255,0.94);

    border-radius: 28px;

    padding: 15px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.10);

    backdrop-filter: blur(10px);

    z-index: 1050;

    display: none;
}

.side-menu.show {

    display: block;
}

.side-menu button {

    width: 100%;

    border: none;

    background: transparent;

    padding: 15px;

    border-radius: 18px;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    color: #55718b;

    cursor: pointer;
}

.side-menu button:hover {

    background: #eaf5ff;
}


/* =========================================================
   الفقاعات
========================================================= */

.bubbles {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 1;

    transition:
        opacity 0.4s ease;
}


.bubble {

    position: absolute;

    bottom: -60px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.45);

    border:
        2px solid rgba(255,255,255,0.55);

    box-shadow:
        inset 3px 3px 5px rgba(255,255,255,0.45);

    animation:
        bubbleUp linear infinite;
}


/* =========================================================
   أحجام ومواقع الفقاعات
========================================================= */

.bubble:nth-child(1) {

    width: 18px;
    height: 18px;

    left: 15%;

    animation-duration: 7s;

    animation-delay: 0s;
}


.bubble:nth-child(2) {

    width: 28px;
    height: 28px;

    left: 27%;

    animation-duration: 9s;

    animation-delay: 2s;
}


.bubble:nth-child(3) {

    width: 13px;
    height: 13px;

    left: 42%;

    animation-duration: 6.5s;

    animation-delay: 1s;
}


.bubble:nth-child(4) {

    width: 22px;
    height: 22px;

    left: 58%;

    animation-duration: 8s;

    animation-delay: 3s;
}


.bubble:nth-child(5) {

    width: 16px;
    height: 16px;

    left: 72%;

    animation-duration: 7.5s;

    animation-delay: 1.5s;
}


.bubble:nth-child(6) {

    width: 31px;
    height: 31px;

    left: 86%;

    animation-duration: 10s;

    animation-delay: 0.5s;
}


/* =========================================================
   حركة الفقاعات
========================================================= */

@keyframes bubbleUp {

    0% {

        transform:
            translateY(0)
            translateX(0)
            scale(0.8);

        opacity: 0;
    }

    10% {

        opacity: 0.8;
    }

    50% {

        transform:
            translateY(-45vh)
            translateX(15px)
            scale(1);
    }

    100% {

        transform:
            translateY(-115vh)
            translateX(-12px)
            scale(1.1);

        opacity: 0;
    }
}


/* =========================================================
   المحتوى الرئيسي
========================================================= */

.content {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 900px;

    max-width: 90vw;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    z-index: 10;
}


/* =========================================================
   السؤال
========================================================= */

.question {

    margin: 0;

    font-size: 48px;

    font-weight: 800;

    color: #55718b;

    text-shadow:
        0 2px 0 rgba(255,255,255,0.8);
}


/* =========================================================
   التوجيه
========================================================= */

.hint {

    margin-top: 12px;

    margin-bottom: 20px;

    font-size: 24px;

    font-weight: 600;

    color: #7892a6;
}


/* =========================================================
   منطقة السمكة
========================================================= */

.fish-wrapper {

    width: 380px;

    height: 260px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 18px;

    position: relative;
}


/* =========================================================
   السمكة
========================================================= */

.fish {

    width: 330px;

    max-height: 245px;

    object-fit: contain;

    transform-origin: center center;

    animation:
        fishSwim 4s ease-in-out infinite;

    will-change: transform;
}


/* =========================================================
   حركة السباحة
========================================================= */

@keyframes fishSwim {

    0%,
    100% {

        transform:
            translateX(-7px)
            translateY(0)
            rotate(-1deg);
    }

    25% {

        transform:
            translateX(5px)
            translateY(-7px)
            rotate(1deg);
    }

    50% {

        transform:
            translateX(10px)
            translateY(0)
            rotate(2deg);
    }

    75% {

        transform:
            translateX(-4px)
            translateY(-6px)
            rotate(-1deg);
    }
}


/* =========================================================
   إيقاف حركة السمكة
========================================================= */

.fish.stop {

    animation-play-state: paused;
}


/* =========================================================
   خيارات الإجابة
========================================================= */

.answers {

    display: flex;

    flex-direction: row;

    direction: rtl;

    justify-content: center;

    align-items: center;

    gap: 28px;

    margin-top: 3px;
}


/* =========================================================
   جميع الأزرار نفس اللون
========================================================= */

.answer-btn {

    width: 210px;

    height: 82px;

    border: 4px solid transparent;

    border-radius: 26px;

    /*
       كل الأزرار سماوية
       حتى لا يعرف الطفل الإجابة من لون الزر
    */

    background: #e4f2ff;

    /*
       النص أسود / داكن
    */

    color: #222222;

    font-family: inherit;

    font-size: 29px;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.08);
}


/* =========================================================
   حركة عند لمس الزر
========================================================= */

.answer-btn:hover {

    transform:
        translateY(-5px);

    background: #d8edfc;

    box-shadow:
        0 12px 22px rgba(85,113,139,0.15);
}


/* =========================================================
   الإجابة الصحيحة
========================================================= */

.answer-btn.correct {

    border-color: #72ad7d;

    background: #e4f2ff;

    color: #222222;

    transform:
        scale(1.06);

    box-shadow:

        0 0 0 6px rgba(114,173,125,0.15),

        0 12px 25px rgba(0,0,0,0.10);
}


/* =========================================================
   الإجابة الخاطئة
========================================================= */

.answer-btn.wrong {

    animation:
        wrongShake 0.35s ease;
}


@keyframes wrongShake {

    0%,
    100% {

        transform:
            translateX(0);
    }

    25% {

        transform:
            translateX(-8px);
    }

    75% {

        transform:
            translateX(8px);
    }
}


/* =========================================================
   رسالة النتيجة
========================================================= */

.feedback {

    min-height: 42px;

    margin-top: 12px;

    font-size: 24px;

    font-weight: 800;

    opacity: 0;

    transition:
        opacity 0.2s ease;
}


.feedback.show {

    opacity: 1;
}


.feedback.correct-message {

    color: #4f9b63;
}


.feedback.wrong-message {

    color: #c47c7c;
}


/* =========================================================
   زخارف النجاح
========================================================= */

.success-decoration {

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0;

    z-index: 50;

    transition:
        opacity 0.3s ease;
}


.success-decoration.show {

    opacity: 1;
}


.star {

    position: absolute;

    font-size: 32px;

    animation:
        starPop 1.5s ease forwards;
}


.star.one {

    top: 25%;
    left: 25%;
}


.star.two {

    top: 30%;
    right: 25%;
}


.star.three {

    bottom: 25%;
    left: 30%;
}


.star.four {

    bottom: 28%;
    right: 30%;
}


@keyframes starPop {

    0% {

        transform:
            scale(0)
            rotate(0deg);

        opacity: 0;
    }

    50% {

        transform:
            scale(1.2)
            rotate(15deg);

        opacity: 1;
    }

    100% {

        transform:
            scale(1)
            rotate(0deg);

        opacity: 1;
    }
}


/* =========================================================
   زر التالي
========================================================= */

.next-btn {

    position: fixed;

    right: 40px;

    bottom: 35px;

    width: 165px;

    height: 62px;

    border: none;

    border-radius: 22px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 24px;

    font-weight: 800;

    cursor: pointer;

    z-index: 1000;

    opacity: 0.5;

    pointer-events: none;

    transition:
        0.2s ease,
        transform 0.2s ease;
}


.next-btn.ready {

    opacity: 1;

    pointer-events: auto;
}


.next-btn.ready:hover {

    background: #d8edfc;

    transform:
        translateY(-3px);
}


/* =========================================================
   iPad Portrait
========================================================= */

@media (min-width: 768px)
       and (max-width: 1100px) {

    .question {

        font-size: 46px;
    }


    .fish-wrapper {

        width: 350px;

        height: 245px;
    }


    .fish {

        width: 310px;
    }


    .answer-btn {

        width: 195px;

        height: 78px;

        font-size: 27px;
    }


    .answers {

        gap: 25px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     الفقاعات
======================================================= -->

<div

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

        ✨

<!-- =======================================================
     المحتوى
======================================================= -->

<main class="content">


    <!-- السؤال -->

    <h1 class="question">

        ما لون هذه السمكة؟ 

    </h1>


    <!-- التوجيه -->

    <p class="hint">

        اختر اللون الصحيح

    </p>



    <!-- ===================================================
         صورة السمكة
    ==================================================== -->

            src="images/f.png"

    ==================================================== -->

======================================================= -->

    class="next-btn"
    id="nextButton"
    onclick="goNext()">

    التالي →

</button>



<script>

/* =========================================================
   إعداد السؤال
========================================================= */

const correctAnswer = "green";

let answered = false;


/* =========================================================
   نطق عربي
========================================================= */

function speakArabic(text) {

    /*
       التأكد من أن المتصفح يدعم
       Speech Synthesis
    */

    if (!("speechSynthesis" in window)) {

        return;

    }


    /*
       إيقاف أي نطق سابق
    */

    window.speechSynthesis.cancel();


    /*
       إنشاء الكلام
    */

    const speech =
        new SpeechSynthesisUtterance(text);


    /*
       اللغة العربية السعودية
    */

    speech.lang = "ar-SA";


    /*
       سرعة هادئة ومناسبة للطفل
    */

    speech.rate = 0.78;


    /*
       نبرة الصوت
    */

    speech.pitch = 1.05;


    /*
       مستوى الصوت
    */

    speech.volume = 1;


    /*
       تشغيل الكلام
    */

    window.speechSynthesis.speak(
        speech
    );

}


/* =========================================================
   نطق السؤال تلقائيًا
========================================================= */

window.addEventListener(
    "load",
    function() {


        /*
           ننتظر قليلًا حتى تظهر الصفحة
           قبل تشغيل الصوت.
        */

        setTimeout(
            function() {

                speakArabic(
                    "ما لون هذه السمكة؟"
                );

            },
            700
        );

    }
);


/* =========================================================
   نظام حفظ الأخطاء
========================================================= */

function getErrors() {

    const saved =
        localStorage.getItem(
            "colorLearningErrors"
        );


    if (!saved) {

        return {

            green: 0,
            red: 0,
            blue: 0

        };

    }


    try {

        return JSON.parse(saved);

    }

    catch (error) {

        return {

            green: 0,
            red: 0,
            blue: 0

        };

    }

}


/* =========================================================
   حفظ خطأ جديد
========================================================= */

function saveError(color) {

    const errors = getErrors();


    if (!errors[color]) {

        errors[color] = 0;

    }


    errors[color]++;


    localStorage.setItem(

        "colorLearningErrors",

        JSON.stringify(errors)

    );

}


/* =========================================================
   حفظ اللون الذي يحتاج تعزيز
========================================================= */

function saveReinforcementColor(color) {

    localStorage.setItem(

        "colorNeedsReinforcement",

        color

    );

}


/* =========================================================
   قراءة لون التعزيز
========================================================= */

function getReinforcementColor() {

    return localStorage.getItem(

        "colorNeedsReinforcement"

    );

}


/* =========================================================
   فحص الإجابة
========================================================= */

function checkAnswer(
    selectedColor,
    button
) {


    /*
       إذا سبق وأجاب الطفل بشكل صحيح
       لا نسمح بإجابة أخرى.
    */

    if (answered) {

        return;

    }


    /* =====================================================
       نطق الخيار الذي لمسه الطفل
    ===================================================== */

    const optionNames = {

        green: "أخضر",

        red: "أحمر",

        blue: "أزرق"

    };


    speakArabic(
        optionNames[selectedColor]
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    /* =====================================================
       الإجابة الصحيحة
    ===================================================== */

    if (
        selectedColor ===
        correctAnswer
    ) {


        answered = true;


        /*
           تحديد الزر الصحيح
        */

        button.classList.add(
            "correct"
        );


        /*
           إيقاف حركة السمكة
        */

        document
            .getElementById("fish")
            .classList.add("stop");


        /*
           إيقاف الفقاعات
        */

        document
            .getElementById("bubbles")
            .style.opacity = "0";


        /*
           رسالة النجاح
        */

        feedback.textContent =
            "أحسنت! 🌟 هذا اللون أخضر 💚";


        feedback.className =
            "feedback show correct-message";


        /*
           حفظ نجاح السؤال
        */

        localStorage.setItem(

            "greenQuestionCompleted",

            "true"

        );


        /*
           إظهار النجوم
        */

        document
            .getElementById(
                "successDecoration"
            )
            .classList.add("show");


        /*
           تفعيل زر التالي
        */

        document
            .getElementById(
                "nextButton"
            )
            .classList.add("ready");


        /*
           تشغيل التصفيق
        */

        playApplause();

    }


    /* =====================================================
       الإجابة الخاطئة
    ===================================================== */

    else {


        /*
           تسجيل خطأ في اللون المطلوب.

           اللون المطلوب هنا = الأخضر
        */

        saveError(
            correctAnswer
        );


        /*
           حفظ اللون الذي يحتاج
           إلى تعزيز.
        */

        saveReinforcementColor(
            correctAnswer
        );


        /*
           اهتزاز الزر
        */

        button.classList.add(
            "wrong"
        );


        /*
           رسالة تشجيعية
        */

        feedback.textContent =
            "حاول مرة أخرى 🌱";


        feedback.className =
            "feedback show wrong-message";


        /*
           إزالة الاهتزاز
        */

        setTimeout(
            function() {

                button.classList.remove(
                    "wrong"
                );

            },
            400
        );


        /*
           إخفاء الرسالة
        */

        setTimeout(
            function() {

                feedback.classList.remove(
                    "show"
                );

            },
            1200
        );

    }

}


/* =========================================================
   صوت التصفيق
========================================================= */

function playApplause() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audioContext =
            new AudioContext();


        const startTime =
            audioContext.currentTime;


        /*
           مجموعة أصوات قصيرة
           تعطي إحساس التصفيق.
        */

        for (
            let i = 0;
            i < 24;
            i++
        ) {


            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.type =
                "square";


            oscillator.frequency.value =
                700 +
                Math.random() * 500;


            const time =
                startTime +
                i * 0.055;


            gain.gain.setValueAtTime(
                0,
                time
            );


            gain.gain.linearRampToValueAtTime(
                0.07,
                time + 0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                time + 0.045
            );


            oscillator.connect(gain);


            gain.connect(
                audioContext.destination
            );


            oscillator.start(time);


            oscillator.stop(
                time + 0.05
            );

        }

    }

    catch (error) {

        console.log(
            "Audio غير متاح:",
            error
        );

    }

}


/* =========================================================
   زر التالي
========================================================= */

function goNext() {


    /*
       لا ينتقل الطفل إلا بعد
       الإجابة الصحيحة.
    */

    if (!answered) {

        return;

    }


    /*
       إذا أخطأ الطفل سابقًا،
       ستكون القيمة:

       colorNeedsReinforcement = "green"

       والصفحة التالية تستطيع
       قراءة هذه القيمة وعرض
       محتوى إضافي عن الأخضر.
    */

    window.location.href =
        "green-reinforcement.html";

}


/* =========================================================
   زر السابق
========================================================= */

function goPrevious() {

    window.location.href =
        "colors.html";

}


/* =========================================================
   القائمة
========================================================= */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );


    menu.classList.toggle(
        "show"
    );

}


/* =========================================================
   صفحات القائمة
========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}


function goProgress() {

    window.location.href =
        "progress.html";

}


/* =========================================================
   إغلاق القائمة عند الضغط خارجها
========================================================= */

document.addEventListener(
    "click",
    function(event) {


        const menu =
            document.getElementById(
                "sideMenu"
            );


        const menuButton =
            document.querySelector(
                ".menu-btn"
            );


        if (
            !menu.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);

</script>
