<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>صنّف السيارات</title>


<style>

/* =====================================================
   الخط
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');


/* =====================================================
   الأساس
===================================================== */

* {

    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;

    -webkit-touch-callout: none;

}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

}


body {

    font-family: "Tajawal", Arial, sans-serif;

    background: #ffffff;

    touch-action: none;

}


/* =====================================================
   اللعبة
===================================================== */

.game {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

}


/* =====================================================
   صورة الكراج الخلفية
===================================================== */

.background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;

    pointer-events: none;

}


/*
   طبقة خفيفة جدًا فوق الخلفية
   حتى تكون عناصر الواجهة واضحة.
*/

.background-overlay {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.04),
            rgba(255,255,255,0)
        );

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   زر السابق
===================================================== */

.previous-btn {

    position: fixed;

    top: 25px;
    left: 25px;

    width: 145px;
    height: 58px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    z-index: 5000;

    box-shadow:
        0 5px 16px rgba(0,0,0,.10);

}


/* =====================================================
   زر القائمة
===================================================== */

.menu-btn {

    position: fixed;

    top: 25px;
    right: 25px;

    width: 62px;
    height: 62px;

    border: none;

    border-radius: 20px;

    background: rgba(255,255,255,.95);

    font-size: 27px;

    z-index: 5000;

    box-shadow:
        0 5px 16px rgba(0,0,0,.10);

}


/* =====================================================
   القائمة
===================================================== */

.side-menu {

    position: fixed;

    top: 100px;
    right: 30px;

    width: 240px;

    padding: 16px;

    border-radius: 25px;

    background: rgba(255,255,255,.97);

    box-shadow:
        0 12px 35px rgba(0,0,0,.15);

    z-index: 6000;

    display: none;

}


.side-menu.show {

    display: block;

}


.side-menu button {

    width: 100%;

    border: none;

    border-radius: 16px;

    background: #f2f7fc;

    padding: 13px;

    margin-bottom: 9px;

    font-family: inherit;

    font-size: 18px;

    font-weight: 700;

}


/* =====================================================
   الهيدر
===================================================== */

.header {

    position: fixed;

    top: 22px;

    left: 180px;
    right: 95px;

    z-index: 4000;

    display: flex;

    justify-content: center;

}


.header-box {

    width: 450px;

    min-height: 74px;

    padding: 8px 25px;

    background: rgba(255,244,188,.96);

    border: 3px solid rgba(80,60,30,.16);

    border-radius: 22px;

    text-align: center;

    display: flex;

    flex-direction: column;

    justify-content: center;

    box-shadow:
        0 7px 20px rgba(0,0,0,.10);

}


.header-title {

    font-size: 28px;

    font-weight: 900;

    color: #5b78b8;

}


.header-subtitle {

    margin-top: 3px;

    font-size: 17px;

    font-weight: 800;

    color: #536b91;

}


/* =====================================================
   المستوى
===================================================== */

.info {

    position: fixed;

    top: 25px;
    right: 95px;

    width: 90px;

    min-height: 74px;

    border-radius: 20px;

    background: rgba(242,248,255,.95);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 4000;

    box-shadow:
        0 5px 16px rgba(0,0,0,.10);

}


.info-label {

    font-size: 14px;

    font-weight: 800;

    color: #6c8cd5;

}


.level {

    font-size: 21px;

    font-weight: 900;

    color: #6c8cd5;

}


/* =====================================================
   المؤقت
===================================================== */

.timer-box {

    position: fixed;

    top: 110px;

    right: 95px;

    width: 90px;

    height: 47px;

    border-radius: 18px;

    background: rgba(242,248,255,.95);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    z-index: 4000;

    box-shadow:
        0 5px 16px rgba(0,0,0,.08);

}


.timer-icon {

    font-size: 18px;

}


.timer {

    font-size: 20px;

    font-weight: 900;

    color: #5b78b8;

}


.timer.warning {

    color: #ff4d5a;

    animation: pulse .7s infinite;

}


@keyframes pulse {

    50% {

        transform: scale(1.12);

    }

}


/* =====================================================
   النجوم
===================================================== */

.stars-box {

    position: fixed;

    top: 110px;

    left: 50%;

    transform: translateX(-50%);

    padding: 5px 16px;

    border-radius: 25px;

    background: rgba(247,250,255,.94);

    border: 2px solid #e2ecfa;

    z-index: 4000;

    direction: ltr;

    box-shadow:
        0 5px 16px rgba(0,0,0,.08);

}


.star {

    font-size: 25px;

    margin: 0 2px;

    color: #c8d4e8;

}


.star.active {

    color: #ffc928;

    text-shadow:
        0 0 5px rgba(255,201,40,.35);

}


/* =====================================================
   التعليمات
===================================================== */

.instruction {

    position: fixed;

    top: 160px;

    left: 50%;

    transform: translateX(-50%);

    padding: 10px 22px;

    min-width: 410px;

    text-align: center;

    background: rgba(242,248,255,.94);

    border-radius: 25px;

    color: #536b91;

    font-size: 19px;

    font-weight: 800;

    z-index: 3500;

    box-shadow:
        0 5px 15px rgba(0,0,0,.08);

}


/* =====================================================
   شريط الوقت
===================================================== */

.time-bar {

    position: fixed;

    top: 205px;

    left: 12%;
    right: 12%;

    height: 17px;

    padding: 3px;

    border-radius: 20px;

    background: rgba(233,239,248,.92);

    z-index: 3500;

}


.time-fill {

    height: 100%;

    width: 100%;

    border-radius: 20px;

    background: #6c8cd5;

    transition:
        width .3s linear,
        background .3s ease;

}


/* =====================================================
   مناطق الكراجات
===================================================== */

/*
   هذه المناطق شفافة.
   
   نحن نضعها فوق فتحات الكراجات الموجودة
   في صورة playca.jpeg.

   الأزرق = الكراج الأول
   الأحمر = الكراج الأوسط
   الأصفر = الكراج الثالث.
*/

.garage-target {

    position: fixed;

    z-index: 1800;

    border-radius: 22px;

    background: transparent;

    border: 4px solid transparent;

    transition:
        .18s ease;

    pointer-events: auto;

}


/* الكراج الأزرق */

.garage-target.blue {

    left: 7.5%;

    top: 37%;

    width: 28.5%;

    height: 23%;

}


/* الكراج الأحمر */

.garage-target.red {

    left: 37.2%;

    top: 37%;

    width: 28.7%;

    height: 23%;

}


/* الكراج الأصفر */

.garage-target.yellow {

    left: 67.8%;

    top: 37%;

    width: 28.5%;

    height: 23%;

}


/*
   عندما تكون السيارة فوق الكراج الصحيح
   يظهر إطار لطيف.
*/

.garage-target.hover {

    background: rgba(255,255,255,.12);

    border-color: rgba(255,255,255,.9);

    box-shadow:
        0 0 0 5px rgba(255,255,255,.20),
        0 0 25px rgba(255,255,255,.45);

    transform: scale(1.025);

}


/* =====================================================
   اهتزاز الكراج عند الخطأ
===================================================== */

.garage-target.wrong {

    animation:
        garageWrong .45s ease;

}


@keyframes garageWrong {

    0%,100% {

        transform: translateX(0);

    }

    25% {

        transform: translateX(-8px);

    }

    50% {

        transform: translateX(8px);

    }

    75% {

        transform: translateX(-5px);

    }

}


/* =====================================================
   منطقة السيارات
===================================================== */

.cars-area {

    position: fixed;

    left: 5%;

    right: 5%;

    bottom: 5%;

    height: 31%;

    z-index: 2500;

}


/* =====================================================
   السيارة
===================================================== */

.car {

    position: absolute;

    width: 145px;

    height: 95px;

    object-fit: contain;

    cursor: grab;

    touch-action: none;

    z-index: 2500;

    transition:

        left .35s cubic-bezier(.2,.8,.3,1),

        top .35s cubic-bezier(.2,.8,.3,1),

        opacity .35s ease,

        transform .25s ease,

        filter .2s ease;

    will-change:
        left,
        top,
        transform;

}


/*
   السيارة أثناء السحب.
*/

.car.dragging {

    cursor: grabbing;

    z-index: 999999;

    transition: none;

    transform:
        scale(1.14)
        rotate(-2deg);

    filter:
        drop-shadow(
            0 15px 12px
            rgba(0,0,0,.25)
        );

}


/*
   السيارة التي تم وضعها بنجاح.
*/

.car.done {

    opacity: 0;

    pointer-events: none;

    transform:
        scale(.55);

}


/* =====================================================
   تأثير بسيط للسيارات قبل السحب
===================================================== */

.car:not(.dragging):not(.done) {

    animation:
        carFloat 2.8s ease-in-out infinite;

}


@keyframes carFloat {

    0%,100% {

        margin-top: 0;

    }

    50% {

        margin-top: -4px;

    }

}


/* =====================================================
   الرسالة
===================================================== */

.message {

    position: fixed;

    left: 50%;

    bottom: 225px;

    transform: translateX(-50%);

    padding: 12px 26px;

    min-width: 360px;

    border-radius: 20px;

    background: rgba(255,255,255,.97);

    color: #111;

    text-align: center;

    font-size: 19px;

    font-weight: 900;

    box-shadow:
        0 7px 20px rgba(0,0,0,.14);

    z-index: 7000;

    opacity: 0;

    pointer-events: none;

    transition: .2s ease;

}


.message.show {

    opacity: 1;

}


/* =====================================================
   زر إعادة اللعبة
===================================================== */

.restart-btn {

    position: fixed;

    bottom: 30px;

    left: 40px;

    height: 58px;

    padding: 0 28px;

    border: none;

    border-radius: 20px;

    background: #8267e8;

    color: white;

    font-family: inherit;

    font-size: 19px;

    font-weight: 900;

    z-index: 5000;

    box-shadow:
        0 6px 18px rgba(0,0,0,.15);

}


/* =====================================================
   زر التالي
===================================================== */

.next-btn {

    position: fixed !important;

    right: 40px !important;

    bottom: 30px !important;

    top: auto !important;

    left: auto !important;

    width: 165px;

    height: 62px;

    border: none;

    border-radius: 22px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 23px;

    font-weight: 800;

    z-index: 5000;

    opacity: .5;

    pointer-events: none;

    box-shadow:
        0 6px 18px rgba(0,0,0,.12);

}


.next-btn.ready {

    opacity: 1;

    pointer-events: auto;

}


/* =====================================================
   شاشة النتيجة
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(255,255,255,.78);

    backdrop-filter: blur(8px);

    z-index: 10000;

    display: none;

    align-items: center;

    justify-content: center;

}


.overlay.show {

    display: flex;

}


.result-card {

    width: 560px;

    padding: 32px;

    border-radius: 32px;

    background: white;

    text-align: center;

    box-shadow:
        0 20px 55px rgba(0,0,0,.18);

    animation:
        pop .45s ease;

}


@keyframes pop {

    from {

        opacity: 0;

        transform: scale(.75);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}


.result-emoji {

    font-size: 60px;

}


.result-title {

    margin: 8px 0;

    font-size: 32px;

    font-weight: 900;

    color: #000;

}


.result-stars {

    font-size: 28px;

    direction: ltr;

    margin: 8px;

}


.result-text {

    font-size: 19px;

    line-height: 1.7;

    font-weight: 700;

    color: #111;

}


.result-button {

    margin-top: 14px;

    width: 250px;

    height: 58px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #000;

    font-family: inherit;

    font-size: 19px;

    font-weight: 900;

}


/* =====================================================
   iPad Portrait
===================================================== */

@media
(min-width:768px)
and
(max-width:1100px) {


    .header {

        left: 165px;

        right: 85px;

    }


    .header-box {

        width: 430px;

    }


    .instruction {

        top: 155px;

    }


    .time-bar {

        top: 198px;

    }


    .cars-area {

        left: 5%;

        right: 5%;

        bottom: 5%;

        height: 31%;

    }


    .car {

        width: 145px;

        height: 95px;

    }


    .garage-target.blue {

        left: 7.5%;

        top: 37%;

        width: 28.5%;

        height: 23%;

    }


    .garage-target.red {

        left: 37.2%;

        top: 37%;

        width: 28.7%;

        height: 23%;

    }


    .garage-target.yellow {

        left: 67.8%;

        top: 37%;

        width: 28.5%;

        height: 23%;

    }


    .message {

        bottom: 225px;

    }

}


/* =====================================================
   شاشات أصغر
===================================================== */

@media (max-width:767px) {


    .header {

        left: 20px;

        right: 20px;

        top: 90px;

    }


    .header-box {

        width: 100%;

    }


    .info {

        right: 20px;

        top: 20px;

    }


    .timer-box {

        right: 20px;

        top: 100px;

    }


    .instruction {

        width: 90%;

        min-width: 0;

        top: 170px;

        font-size: 16px;

    }


    .time-bar {

        top: 215px;

        left: 7%;

        right: 7%;

    }


    .car {

        width: 105px;

        height: 70px;

    }


    .cars-area {

        bottom: 7%;

        height: 29%;

    }


    .next-btn {

        right: 20px !important;

        bottom: 20px !important;

        width: 140px;

        height: 55px;

        font-size: 19px;

    }


    .restart-btn {

        left: 20px;

        bottom: 20px;

        height: 52px;

        font-size: 16px;

    }


    .result-card {

        width: 90%;

        padding: 25px;

    }

}

</style>

</head>


<body>


<div class="game">


<!-- =====================================================
     صورة الكراج
===================================================== -->

<img
    src="images/carag.jpeg"
    class="background"
    alt=""
>


<div class="background-overlay"></div>


<!-- =====================================================
     زر السابق
===================================================== -->

<button

<!-- =====================================================

===================================================== -->

<div class="header">

    <div class="header-box">

        <div class="header-title">

        </div>

        <div class="header-subtitle">

        </div>

    </div>

<!-- =====================================================

===================================================== -->

    <div class="info-label">

    </div>

    <div

    </div>

</div>


<!-- =====================================================
     المؤقت
===================================================== -->

        ⏱️
    </span>

    <span
        class="timer"
        id="timer"

    <span>
        ث
    </span>

</div>

    <span class="star" id="star2">☆</span>
    <span class="star" id="star3">☆</span>

    <span class="star" id="star5">☆</span>

</div>

     التعليمات
===================================================== -->

    <div

</div>


<!-- =====================================================
     أهداف الكراجات
===================================================== */

/*
   هذه المناطق غير ظاهرة للطفل،
   لكنها تحدد مكان كل كراج.
*/

<div
    class="garage-target blue"
    data-color="blue"

<div
    class="garage-target red"
    data-color="red"
></div>


<div
    class="garage-target yellow"
    data-color="yellow"
></div>


<!-- =====================================================
     السيارات
===================================================== -->

<div
    class="cars-area"
    id="carsArea"
></div>


<!-- =====================================================
     الرسالة
===================================================== -->

<div
    class="message"
    id="message"
></div>


<!-- =====================================================
     إعادة اللعبة
===================================================== -->

<button
    class="restart-btn"
    onclick="restartGame()"

    ↻ إعادة اللعبة

</button>


<!-- =====================================================

===================================================== -->

    class="next-btn"
    id="nextBtn"

===================================================== -->

    id="overlay"

    <div class="result-card">

        <div class="result-emoji">
            🎉
        </div>


        <div
            class="result-title"
            id="resultTitle"
        >

            أحسنتِ!

        </div>


        <div
            class="result-stars"
            id="resultStars"
        >

            ⭐⭐⭐

        </div>


        <div
            class="result-text"
            id="resultText"
        >
        </div>


        <button
            class="result-button"
            onclick="nextLevel()"
        >

            ▶️ المرحلة التالية

        </button>

    </div>

</div>


<script>

/* =====================================================
   إعدادات الوقت
===================================================== */

const levelSettings = {

    1: {
        time: 30
    },

    2: {
        time: 27
    },

    3: {
        time: 24
    },

    4: {
        time: 21
    }

};


/* =====================================================
   أنواع السيارات
===================================================== */

const carTypes = [

    {
        color: "red",
        image: "images/redc.png"
    },

    {
        color: "yellow",
        image: "images/yaca.png"
    },

    {
        color: "blue",
        image: "images/bluec.png"
    }

];


/* =====================================================
   المتغيرات
===================================================== */

let level = 1;

let currentCarCount = 6;

let nextCarCount = null;

let score = 0;

let mistakes = 0;

let attempts = 0;

let timeLeft = 30;

let totalTime = 30;

let timerInterval = null;

let stageFinished = false;


/* =====================================================
   السحب
===================================================== */

let draggingCar = null;

let dragPointerId = null;

let dragOffsetX = 0;

let dragOffsetY = 0;

let originalLeft = 0;

let originalTop = 0;


/* =====================================================
   العناصر
===================================================== */

const carsArea =
    document.getElementById("carsArea");


const timerElement =
    document.getElementById("timer");


const timeFill =
    document.getElementById("timeFill");


const levelElement =
    document.getElementById("level");


const message =
    document.getElementById("message");


const overlay =
    document.getElementById("overlay");


const resultTitle =
    document.getElementById("resultTitle");


const resultText =
    document.getElementById("resultText");


const resultStars =
    document.getElementById("resultStars");


const nextBtn =
    document.getElementById("nextBtn");


/* =====================================================
   خلط السيارات
===================================================== */

function shuffle(array) {

    const copy = [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =====================================================
   إنشاء قائمة السيارات
===================================================== */

function createCarList() {

    /*
       إذا كان هناك عدد محدد
       للمرحلة القادمة نستخدمه.
    */

    if (
        nextCarCount !== null
    ) {

        currentCarCount =
            nextCarCount;

        nextCarCount =
            null;

    }


    const list = [];


    /*
       نضمن وجود الألوان الثلاثة
       دائمًا.
    */

    const baseColors = [
        "red",
        "yellow",
        "blue"
    ];


    baseColors.forEach(
        color => {

            const type =
                carTypes.find(
                    car =>
                        car.color === color
                );


            list.push(type);

        }
    );


    /*
       نكمل العدد المطلوب.
    */

    while (
        list.length <
        currentCarCount
    ) {

        const randomType =
            carTypes[
                Math.floor(
                    Math.random() *
                    carTypes.length
                )
            ];


        list.push(
            randomType
        );

    }


    return shuffle(list);

}


/* =====================================================
   بدء المرحلة
===================================================== */

function startStage() {

    clearInterval(
        timerInterval
    );


    stageFinished =
        false;


    score =
        0;


    mistakes =
        0;


    attempts =
        0;


    const settings =
        levelSettings[level];


    timeLeft =
        settings.time;


    totalTime =
        settings.time;


    levelElement.textContent =
        level;


    nextBtn.classList.remove(
        "ready"
    );


    overlay.classList.remove(
        "show"
    );


    createCars();


    updateStars();


    updateTimer();


    startTimer();


    speak(
        "ضع كل سيارة في الكراج الذي نفس لونها"
    );

}


/* =====================================================
   إنشاء السيارات
===================================================== */

function createCars() {

    carsArea.innerHTML = "";


    const list =
        createCarList();


    /*
       نحصل على عدد الأعمدة المناسب
       حسب عدد السيارات.
    */

    const columns =
        currentCarCount <= 4
            ? currentCarCount
            : 3;


    const rows =
        Math.ceil(
            list.length /
            columns
        );


    /*
       أماكن السيارات داخل الطريق.
    */

    const horizontalPositions =
        [
            8,
            50,
            92
        ];


    const verticalPositions =
        rows === 1
            ? [50]
            : rows === 2
                ? [25, 68]
                : [15, 48, 80];


    list.forEach(
        (type, index) => {

            const car =
                document.createElement("img");


            car.src =
                type.image;


            car.className =
                "car";


            car.dataset.color =
                type.color;


            car.dataset.index =
                index;


            car.draggable =
                false;


            /*
               تحديد الصف والعمود.
            */

            const row =
                Math.floor(
                    index /
                    columns
                );


            const column =
                index %
                columns;


            /*
               نضع السيارة في الطريق.
            */

            car.style.left =
                `${horizontalPositions[column]}%`;


            car.style.top =
                `${verticalPositions[row]}%`;


            /*
               نستخدم translateX(-50%)
               حتى يكون الموقع هو مركز السيارة.
            */

            car.style.transform =
                "translateX(-50%)";


            carsArea.appendChild(
                car
            );


            setupDrag(car);

        }
    );

}


/* =====================================================
   تفعيل السحب
===================================================== */

function setupDrag(car) {

    car.addEventListener(
        "pointerdown",
        startDrag,
        {
            passive: false
        }
    );

}


/* =====================================================
   بداية السحب
===================================================== */

function startDrag(event) {

    if (
        stageFinished ||
        draggingCar
    ) {

        return;

    }


    const car =
        event.currentTarget;


    if (
        car.classList.contains("done")
    ) {

        return;

    }


    event.preventDefault();


    /*
       نوقف animation الحركة
       أثناء السحب.
    */

    car.style.animation =
        "none";


    draggingCar =
        car;


    dragPointerId =
        event.pointerId;


    /*
       نثبت السيارة على pointer
       حتى لا تختفي أو تنزلق.
    */

    try {

        car.setPointerCapture(
            event.pointerId
        );

    }

    catch (e) {}


    const rect =
        car.getBoundingClientRect();


    /*
       المسافة بين الإصبع ومركز السيارة.
    */

    dragOffsetX =
        event.clientX -
        (
            rect.left +
            rect.width / 2
        );


    dragOffsetY =
        event.clientY -
        (
            rect.top +
            rect.height / 2
        );


    /*
       نحفظ مكانها الأصلي.
    */

    originalLeft =
        rect.left;


    originalTop =
        rect.top;


    car.classList.add(
        "dragging"
    );


    document.addEventListener(
        "pointermove",
        moveDrag,
        {
            passive: false
        }
    );


    document.addEventListener(
        "pointerup",
        endDrag,
        {
            once: true
        }
    );


    document.addEventListener(
        "pointercancel",
        cancelDrag,
        {
            once: true
        }
    );

}


/* =====================================================
   حركة السيارة أثناء السحب
===================================================== */

function moveDrag(event) {

    if (
        !draggingCar ||
        event.pointerId !== dragPointerId
    ) {

        return;

    }


    event.preventDefault();


    const carRect =
        draggingCar.getBoundingClientRect();


    /*
       مركز السيارة الحالي.
    */

    const centerX =
        carRect.left +
        carRect.width / 2;


    const centerY =
        carRect.top +
        carRect.height / 2;


    /*
       الفرق بين الإصبع ومركز السيارة.
    */

    const targetCenterX =
        event.clientX -
        dragOffsetX;


    const targetCenterY =
        event.clientY -
        dragOffsetY;


    const moveX =
        targetCenterX -
        centerX;


    const moveY =
        targetCenterY -
        centerY;


    /*
       نحرك السيارة مباشرة.
    */

    draggingCar.style.transform =
        `
        translate(
            ${moveX}px,
            ${moveY}px
        )
        scale(1.14)
        rotate(-2deg)
        `;


    /*
       نحدد هل السيارة فوق أحد الكراجات.
    */

    highlightGarage(
        event.clientX,
        event.clientY
    );

}


/* =====================================================
   نهاية السحب
===================================================== */

function endDrag(event) {

    if (
        !draggingCar ||
        event.pointerId !== dragPointerId
    ) {

        return;

    }


    const car =
        draggingCar;


    const x =
        event.clientX;


    const y =
        event.clientY;


    draggingCar =
        null;


    dragPointerId =
        null;


    clearGarageHighlight();


    try {

        car.releasePointerCapture(
            event.pointerId
        );

    }

    catch (e) {}


    document.removeEventListener(
        "pointermove",
        moveDrag
    );


    car.classList.remove(
        "dragging"
    );


    const garage =
        findGarage(
            x,
            y
        );


    handleDrop(
        car,
        garage
    );

}


/* =====================================================
   إلغاء السحب
===================================================== */

function cancelDrag() {

    if (
        !draggingCar
    ) {

        return;

    }


    const car =
        draggingCar;


    draggingCar =
        null;


    dragPointerId =
        null;


    clearGarageHighlight();


    car.classList.remove(
        "dragging"
    );


    returnCar(
        car
    );

}


/* =====================================================
   إيجاد الكراج
===================================================== */

function findGarage(
    x,
    y
) {

    const garages =
        document.querySelectorAll(
            ".garage-target"
        );


    for (
        const garage of garages
    ) {

        const rect =
            garage.getBoundingClientRect();


        if (
            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom
        ) {

            return garage;

        }

    }


    return null;

}


/* =====================================================
   تحديد الكراج أثناء السحب
===================================================== */

function highlightGarage(
    x,
    y
) {

    clearGarageHighlight();


    const garage =
        findGarage(
            x,
            y
        );


    if (
        garage
    ) {

        garage.classList.add(
            "hover"
        );

    }

}


/* =====================================================
   إزالة تحديد الكراجات
===================================================== */

function clearGarageHighlight() {

    document
        .querySelectorAll(
            ".garage-target"
        )
        .forEach(
            garage => {

                garage.classList.remove(
                    "hover"
                );

            }
        );

}


/* =====================================================
   معالجة السيارة
===================================================== */

function handleDrop(
    car,
    garage
) {

    attempts++;


    /*
       إذا لم تدخل السيارة أي كراج
       ترجع لمكانها.
    */

    if (
        !garage
    ) {

        returnCar(
            car
        );


        return;

    }


    /*
       اللون خاطئ.
    */

    if (
        car.dataset.color !==
        garage.dataset.color
    ) {

        mistakes++;


        garage.classList.remove(
            "wrong"
        );


        void garage.offsetWidth;


        garage.classList.add(
            "wrong"
        );


        showMessage(
            "💡 حاول وضع السيارة في الكراج المطابق للونها"
        );


        speak(
            "حاول وضع السيارة في الكراج المطابق للونها"
        );


        returnCar(
            car
        );


        return;

    }


    /*
       اللون صحيح.
    */

    placeCorrectCar(
        car,
        garage
    );

}


/* =====================================================
   إعادة السيارة
===================================================== */

function returnCar(car) {

    car.style.animation =
        "none";


    /*
       نرجع transform فقط،
       ونترك left/top الأصليين كما هما.
    */

    car.style.transition =
        "transform .35s cubic-bezier(.2,.8,.3,1)";


    car.style.transform =
        "translateX(-50%) scale(1)";


    setTimeout(
        () => {

            if (
                !stageFinished &&
                !car.classList.contains("done")
            ) {

                car.style.transition =
                    "transform .25s ease";


                car.style.animation =
                    "carFloat 2.8s ease-in-out infinite";

            }

        },
        400
    );

}


/* =====================================================
   وضع السيارة داخل الكراج
===================================================== */

function placeCorrectCar(
    car,
    garage
) {

    score++;


    /*
       نأخذ مراكز السيارة والكراج.
    */

    const carRect =
        car.getBoundingClientRect();


    const garageRect =
        garage.getBoundingClientRect();


    const carCenterX =
        carRect.left +
        carRect.width / 2;


    const carCenterY =
        carRect.top +
        carRect.height / 2;


    const garageCenterX =
        garageRect.left +
        garageRect.width / 2;


    /*
       نضع السيارة في الجزء السفلي
       من فتحة الكراج حتى تبدو داخله.
    */

    const garageCenterY =
        garageRect.top +
        garageRect.height * .67;


    const moveX =
        garageCenterX -
        carCenterX;


    const moveY =
        garageCenterY -
        carCenterY;


    car.style.zIndex =
        "999999";


    car.style.transition =
        "transform .55s cubic-bezier(.2,.8,.3,1)";


    car.style.transform =
        `
        translate(
            ${moveX}px,
            ${moveY}px
        )
        scale(.62)
        `;


    garage.classList.add(
        "hover"
    );


    showMessage(
        "أحسنتِ! 👏"
    );


    speak(
        "أحسنت"
    );


    setTimeout(
        () => {

            car.classList.add(
                "done"
            );


            garage.classList.remove(
                "hover"
            );


            updateStars();


            /*
               إذا اكتملت كل السيارات
               تنتهي المرحلة.
            */

            if (
                score >=
                carsArea.children.length
            ) {

                stageCompleted();

            }

        },
        650
    );

}


/* =====================================================
   النجوم
===================================================== */

function updateStars() {

    const stars =
        document.querySelectorAll(
            ".star"
        );


    stars.forEach(
        (star, index) => {

            if (
                index <
                Math.min(
                    score,
                    6
                )
            ) {

                star.textContent =
                    "★";


                star.classList.add(
                    "active"
                );

            }

            else {

                star.textContent =
                    "☆";


                star.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   المؤقت
===================================================== */

function startTimer() {

    timerInterval =
        setInterval(
            () => {

                if (
                    stageFinished
                ) {

                    clearInterval(
                        timerInterval
                    );


                    return;

                }


                if (
                    timeLeft > 0
                ) {

                    timeLeft--;

                    updateTimer();

                }


                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    timeUp();

                }

            },
            1000
        );

}


/* =====================================================
   تحديث المؤقت
===================================================== */

function updateTimer() {

    timerElement.textContent =
        timeLeft;


    const progress =
        timeLeft /
        totalTime;


    timeFill.style.width =
        `${Math.max(
            0,
            progress * 100
        )}%`;


    if (
        progress <= .25
    ) {

        timeFill.style.background =
            "#ff4d5a";


        timerElement.classList.add(
            "warning"
        );

    }

    else if (
        progress <= .50
    ) {

        timeFill.style.background =
            "#ff9f43";


        timerElement.classList.remove(
            "warning"
        );

    }

    else {

        timeFill.style.background =
            "#6c8cd5";


        timerElement.classList.remove(
            "warning"
        );

    }

}


/* =====================================================
   انتهاء الوقت
===================================================== */

function timeUp() {

    if (
        stageFinished
    ) {

        return;

    }


    stageFinished =
        true;


    clearInterval(
        timerInterval
    );


    /*
       نأخذ العدد الحقيقي للسيارات
       الموجودة في المرحلة.
    */

    const oldCarCount =
        carsArea.children.length;


    const remainingCars =
        oldCarCount -
        score;


    /*
       أهم جزء:
       
       إذا انتهى الوقت قبل الإكمال
       نقلل عدد السيارات في المرحلة القادمة.

       6 → 4
       4 → 3
       3 → 3
    */

    nextCarCount =
        Math.max(
            3,
            oldCarCount - 2
        );


    savePerformance(
        false
    );


    resultTitle.textContent =
        "⏰ انتهى الوقت";


    resultStars.textContent =
        score > 0
            ? "⭐".repeat(
                Math.min(
                    score,
                    6
                )
            )
            : "☆";


    resultText.innerHTML =
        `
        أكملتِ ${score} من ${oldCarCount} سيارات 🚗
        <br>
        بقيت ${remainingCars} سيارات.
        <br><br>
        💛 سنجعل المرحلة القادمة أسهل.
        <br>
        عدد السيارات القادمة:
        <strong>${nextCarCount}</strong>
        `;


    showResult();


    speak(
        "انتهى الوقت، سنجعل المرحلة القادمة أسهل"
    );

}


/* =====================================================
   إكمال المرحلة
===================================================== */

function stageCompleted() {

    if (
        stageFinished
    ) {

        return;

    }


    stageFinished =
        true;


    clearInterval(
        timerInterval
    );


    const currentCarCount =
        carsArea.children.length;


    const currentMistakes =
        mistakes;


    const currentTime =
        timeLeft;


    /*
       أداء ممتاز:
       أخطاء قليلة + وقت جيد
       → نزيد سيارتين.
    */

    if (
        currentMistakes <= 2 &&
        currentTime >= 8
    ) {

        nextCarCount =
            Math.min(
                12,
                currentCarCount + 2
            );

    }


    /*
       أخطاء كثيرة:
       → نقلل سيارتين.
    */

    else if (
        currentMistakes >= 4
    ) {

        nextCarCount =
            Math.max(
                3,
                currentCarCount - 2
            );

    }


    /*
       أداء متوسط:
       نفس العدد.
    */

    else {

        nextCarCount =
            currentCarCount;

    }


    /*
       إذا وصلنا للمستوى الأعلى
       لا نتجاوز المستوى 4.
    */

    if (
        currentMistakes <= 2 &&
        currentTime >= 8
    ) {

        level =
            Math.min(
                4,
                level + 1
            );

    }

    else if (
        currentMistakes >= 4
    ) {

        level =
            Math.max(
                1,
                level - 1
            );

    }


    savePerformance(
        true
    );


    /*
       رسالة النتيجة.
    */

    if (
        nextCarCount >
        currentCarCount
    ) {

        resultTitle.textContent =
            "🌟 ممتاز!";


        resultText.innerHTML =
            `
            أكملتِ جميع السيارات بنجاح! 🎉
            <br>
            أخطاؤك: ${currentMistakes}
            <br><br>
            🚗 أنتِ مستعدة لتحدٍ أكبر!
            <br>
            السيارات القادمة:
            <strong>${nextCarCount}</strong>
            `;

    }

    else if (
        nextCarCount <
        currentCarCount
    ) {

        resultTitle.textContent =
            "💛 أحسنتِ!";


        resultText.innerHTML =
            `
            أكملتِ المرحلة بنجاح! 👏
            <br>
            أخطاؤك: ${currentMistakes}
            <br><br>
            🌈 سنخفف عدد السيارات قليلًا.
            <br>
            السيارات القادمة:
            <strong>${nextCarCount}</strong>
            `;

    }

    else {

        resultTitle.textContent =
            "🎉 أحسنتِ!";


        resultText.innerHTML =
            `
            أكملتِ المرحلة بشكل رائع! 👏
            <br>
            أخطاؤك: ${currentMistakes}
            <br><br>
            🚗 سنبقي عدد السيارات كما هو.
            <br>
            السيارات القادمة:
            <strong>${nextCarCount}</strong>
            `;

    }


    resultStars.textContent =
        "⭐".repeat(
            Math.min(
                score,
                6
            )
        );


    showResult();


    speak(
        "أحسنت، أكملت المرحلة بشكل رائع"
    );

}


/* =====================================================
   عرض النتيجة
===================================================== */

function showResult() {

    overlay.classList.add(
        "show"
    );


    nextBtn.classList.add(
        "ready"
    );

}


/* =====================================================
   المرحلة التالية
===================================================== */

function nextLevel() {

    overlay.classList.remove(
        "show"
    );


    startStage();

}


/* =====================================================
   إعادة اللعبة
===================================================== */

function restartGame() {

    clearInterval(
        timerInterval
    );


    level =
        1;


    currentCarCount =
        6;


    nextCarCount =
        null;


    score =
        0;


    mistakes =
        0;


    attempts =
        0;


    stageFinished =
        false;


    startStage();

}


/* =====================================================
   حفظ أداء الطفل
===================================================== */

function savePerformance(
    completed = false
) {

    const performance = {

        activity:
            "car-sorting",

        level:
            level,

        score:
            score,

        totalCars:
            carsArea.children.length,

        currentCarCount:
            currentCarCount,

        nextCarCount:
            nextCarCount,

        mistakes:
            mistakes,

        attempts:
            attempts,

        timeLeft:
            timeLeft,

        totalTime:
            totalTime,

        completed:
            completed,

        date:
            new Date().toISOString()

    };


    /*
       آخر نتيجة.
    */

    localStorage.setItem(

        "carSortingPerformance",

        JSON.stringify(
            performance
        )

    );


    /*
       سجل المحاولات.
    */

    let history = [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "carSortingHistory"
                )
            ) || [];

    }

    catch (e) {

        history = [];

    }


    history.push(
        performance
    );


    localStorage.setItem(

        "carSortingHistory",

        JSON.stringify(
            history
        )

    );

}


/* =====================================================
   الرسائل
===================================================== */

let messageTimer;


function showMessage(text) {

    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1100
        );

}


/* =====================================================
   النطق
===================================================== */

function speak(text) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;

    }


    try {

        speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        utterance.lang =
            "ar-SA";


        utterance.rate =
            .78;


        utterance.pitch =
            1.05;


        speechSynthesis.speak(
            utterance
        );

    }

    catch (e) {}

}
