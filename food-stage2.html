/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_m6m2gJXfPnu_Ns6LV-jxhg_cHa00bj6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const childId =
    localStorage.getItem(
        "raf iqChildId"
    ) ||
    localStorage.getItem(
        "raf iqChildId"

        "rafiqChildId"

let interest = null;


/* =====================================================
   FIXED PAGE SCALE
===================================================== */

const page =
    document.querySelector(".page");


function resizePage(){

    const baseWidth = 1024;

    const baseHeight = 1366;

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    page.style.setProperty(
        "--page-scale",
        scale
    );

}


resizePage();

window.addEventListener(
    "resize",
    resizePage
);

window.addEventListener(
    "orientationchange",
    function(){

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   PERSONALIZATION
===================================================== */

function applyPersonalization(){

    const normalizedInterest =
        String(
            interest || ""
        )
        .trim()
        .toLowerCase();


    if(
        normalizedInterest === "سيارات" ||
        normalizedInterest === "سيارة" ||
        normalizedInterest === "cars" ||
        normalizedInterest === "car"
    ){

        page.style.backgroundImage =
            'linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)), url("images/sc3.jpeg")';


        document
            .querySelectorAll(
                ".car-decoration"
            )
            .forEach(function(item){

                item.style.display =
                    "block";

            });


        document
            .querySelectorAll(
                ".space-decoration"
            )
            .forEach(function(item){

                item.style.display =
                    "none";

            });


        return true;
    }


    if(
        normalizedInterest === "فضاء" ||
        normalizedInterest === "space"
    ){

        page.style.backgroundImage =
            'linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)), url("images/sc3s.jpeg")';


        document
            .querySelectorAll(
                ".car-decoration"
            )
            .forEach(function(item){

                item.style.display =
                    "none";

            });


        document
            .querySelectorAll(
                ".space-decoration"
            )
            .forEach(function(item){

                item.style.display =
                    "block";

            });


        return true;
    }


    console.warn(
        "لم يتم تطبيق تخصيص لأن قيمة interests غير معروفة:",
        interest
    );

    return false;

}


/* =====================================================
   LOAD CHILD INTEREST
===================================================== */

async function loadChildInterest(){

    if(!childId){

        console.warn(
            "لم يتم العثور على rafiqChildId في localStorage."
        );

        return;
    }


    try{

        const {
            data,
            error
        } = await supabaseClient

            .from("children")

            .select("interests")

            .eq("id", childId)

            .maybeSingle();


        if(error){

            console.error(
                "خطأ أثناء جلب interests:",
                error
            );

            return;
        }


        if(!data){

            console.warn(
                "لم يتم العثور على الطفل بهذا ID:",
                childId
            );

            return;
        }


        if(
            data.interests === null ||
            data.interests === undefined ||
            String(data.interests).trim() === ""
        ){

            console.warn(
                "حقل interests فارغ لهذا الطفل."
            );

            return;
        }


        interest =
            String(
                data.interests
            )
            .trim()
            .toLowerCase();


        applyPersonalization();

    }
    catch(error){

        console.error(
            "حدث خطأ أثناء قراءة تخصيص الطفل:",
            error
        );

    }

}


loadChildInterest();

        !("speechSynthesis" in window)
    ){

        return;
    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "ar-SA";

    speech.rate =
        0.78;

    speech.pitch =
        1;

    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


function speakAfterDelay(
    text,
    delay = 500
){

    setTimeout(
        function(){

            speak(text);

        },
        delay
    );

}
