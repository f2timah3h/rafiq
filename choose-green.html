            src="images/f.png"
            class="fish"
            id="fish"
            alt="سمكة">

    ==================================================== -->

            class="answer-btn"
            data-color="green"
            onclick="checkAnswer('green', this)">

<script>

/* =========================================================
   إعداد السؤال
========================================================= */

const correctAnswer =
    "green";


/*
   عدد المحاولات الخاطئة
*/

let wrongAttempts = 0;


/*
   هل تمت الإجابة الصحيحة؟
*/

let answered = false;


/* =========================================================
   نطق عربي
========================================================= */

function speakArabic(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "ar-SA";


    speech.rate =
        0.78;


    speech.pitch =
        1.05;


    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =========================================================
   نطق السؤال
========================================================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            function() {

                speakArabic(
                    "ما لون هذه السمكة؟"
                );

            },
            700
        );

    }
);


/* =========================================================
   قراءة الأخطاء السابقة
========================================================= */

function getErrors() {

    const saved =
        localStorage.getItem(
            "colorLearningErrors"
        );


    if (!saved) {

        return {

            green: 0,
            red: 0,
            blue: 0

        };

    }


    try {

        return JSON.parse(
            saved
        );

    }

    catch (error) {

        return {

            green: 0,
            red: 0,
            blue: 0

        };

    }

}


/* =========================================================
   حفظ خطأ
========================================================= */

function saveError(color) {

    const errors =
        getErrors();


    if (!errors[color]) {

        errors[color] =
            0;

    }


    errors[color]++;


    localStorage.setItem(

        "colorLearningErrors",

        JSON.stringify(
            errors
        )

    );

}


/* =========================================================
   حفظ اللون الذي يحتاج تعزيز
========================================================= */

function saveReinforcementColor(
    color
) {

    localStorage.setItem(

        "colorNeedsReinforcement",

        color

    );

}


/* =========================================================
   فحص الإجابة
========================================================= */

function checkAnswer(
    selectedColor,
    button
) {


    /*
       إذا أجاب الطفل صحيحًا وانتهى
       السؤال، لا نسمح بإجابة أخرى.
    */

    if (answered) {

        return;

    }


    /* =====================================================
       نطق الإجابة
    ===================================================== */

    const optionNames = {

        green:
            "أخضر",

        red:
            "أحمر",

        blue:
            "أزرق"

    };


    speakArabic(
        optionNames[selectedColor]
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    /* =====================================================
       ❌ الإجابة الخاطئة
    ===================================================== */

    if (
        selectedColor !==
        correctAnswer
    ) {


        /*
           زيادة عدد الأخطاء
        */

        wrongAttempts++;


        /*
           حفظ الخطأ
        */

        saveError(
            correctAnswer
        );


        /*
           حفظ اللون الذي يحتاج تعزيز
        */

        saveReinforcementColor(
            correctAnswer
        );


        /*
           اهتزاز الزر
        */

        button.classList.add(
            "wrong"
        );


        /*
           رسالة تشجيعية
        */

        feedback.textContent =
            "حاول مرة أخرى 🌱";


        feedback.className =
            "feedback show wrong-message";


        /*
           إزالة الاهتزاز
        */

        setTimeout(
            function() {

                button.classList.remove(
                    "wrong"
                );

            },
            400
        );


        /*
           إخفاء الرسالة بعد فترة
        */

        setTimeout(
            function() {

                feedback.classList.remove(
                    "show"
                );

            },
            1200
        );


        /*
           مهم جدًا:
           لا يوجد انتقال هنا.

           الطفل يبقى في نفس السؤال.
        */

        return;

    }


    /* =====================================================
       ✅ الإجابة الصحيحة
    ===================================================== */

    answered =
        true;


    /*
       تمييز الزر الصحيح
    */

    button.classList.add(
        "correct"
    );


    /*
       إيقاف حركة السمكة
    */

    document
        .getElementById("fish")
        .classList.add("stop");


    /*
       إيقاف الفقاعات
    */

    document
        .getElementById("bubbles")
        .style.opacity =
        "0";


    /*
       رسالة النجاح
    */

    feedback.textContent =
        "أحسنت! 🌟 هذا اللون أخضر 💚";


    feedback.className =
        "feedback show correct-message";


    /*
       حفظ إكمال السؤال
    */

    localStorage.setItem(

        "greenQuestionCompleted",

        "true"

    );


    /* =====================================================
       إذا كان الطفل قد أخطأ سابقًا
    ===================================================== */

    if (
        wrongAttempts > 0
    ) {


        /*
           حفظ عدد الأخطاء
           لكي تستطيع صفحة التعزيز
           استخدامه لاحقًا.
        */

        localStorage.setItem(

            "greenQuestionWrongAttempts",

            wrongAttempts

        );


        /*
           ننتظر قليلًا حتى يرى الطفل
           أنه اختار الإجابة الصحيحة.
        */

        setTimeout(
            function() {

                window.location.href =
                    "green-reinforcement.html";

            },
            900
        );


        return;

    }


    /* =====================================================
       🎉 صحيح من أول محاولة
    ===================================================== */

    /*
       حفظ نجاح الطفل من أول محاولة
    */

    localStorage.setItem(

        "greenQuestionFirstTry",

        "true"

    );


    /*
       إظهار زينة الاحتفال
    */

    document
        .getElementById(
            "celebration"
        )
        .classList.add(
            "show"
        );


    /*
       تشغيل التصفيق
    */

    playApplause();


    /*
       إظهار POP-UP
    */

    setTimeout(
        function() {

            document
                .getElementById(
                    "successPopup"
                )
                .classList.add(
                    "show"
                );

        },
        900
    );

}


/* =========================================================
   صوت التصفيق
========================================================= */

function playApplause() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audioContext =
            new AudioContext();


        const startTime =
            audioContext.currentTime;


        for (
            let i = 0;
            i < 24;
            i++
        ) {


            const oscillator =
                audioContext
                .createOscillator();


            const gain =
                audioContext
                .createGain();


            oscillator.type =
                "square";


            oscillator.frequency.value =
                700 +
                Math.random() * 500;


            const time =
                startTime +
                i * 0.055;


            gain.gain.setValueAtTime(
                0,
                time
            );


            gain.gain.linearRampToValueAtTime(
                0.07,
                time + 0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                time + 0.045
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                audioContext.destination
            );


            oscillator.start(
                time
            );


            oscillator.stop(
                time + 0.05
            );

        }

    }

    catch (error) {

        console.log(
            "Audio غير متاح:",
            error
        );

    }

}
