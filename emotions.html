<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>رفيق - المشاعر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: "Tahoma", "Arial", sans-serif;
    direction: rtl;
}

body {
    min-height: 100vh;

    background-image:
        url("images/emotion.jpeg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #555;

    overflow-x: hidden;
}


/* =========================
   PAGE
========================= */

.page {
    width: 100%;
    min-height: 100vh;

    padding: 40px 35px 70px;

    position: relative;

    overflow: hidden;
}


/* =========================
   TOP MENU BUTTON
========================= */

.menu-button {

    position: fixed;

    top: 35px;
    right: 35px;

    width: 65px;
    height: 65px;

    border: none;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.82);

    box-shadow:
        0 6px 18px
        rgba(70,80,90,0.15);

    font-size: 30px;

    cursor: pointer;

    z-index: 1000;

    transition:
        0.2s ease;
}

.menu-button:hover {

    transform:
        translateY(-2px);

    background:
        rgba(255,255,255,0.95);
}

.menu-button:active {

    transform:
        scale(0.95);
}


/* =========================
   SIDE MENU
========================= */

.side-menu {

    position: fixed;

    top: 110px;
    right: 35px;

    width: 245px;

    padding: 12px;

    background:
        rgba(255,255,255,0.94);

    border-radius: 24px;

    box-shadow:
        0 12px 30px
        rgba(60,70,80,0.18);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    z-index: 999;

    display: none;
}

.side-menu.show {

    display: block;

    animation:
        menuAppear
        0.2s
        ease;
}

@keyframes menuAppear {

    from {
        opacity: 0;
        transform: translateY(-8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   SIDE MENU ITEM
========================= */

.side-item {

    width: 100%;
    height: 60px;

    border: none;

    border-radius: 17px;

    background:
        transparent;

    font-family: inherit;

    font-size: 19px;

    font-weight: 700;

    color: #555;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    gap: 12px;

    padding:
        0 18px;

    transition:
        0.2s ease;
}

.side-item:hover {

    background:
        #e4f2ff;
}

.side-item:active {

    transform:
        scale(0.98);
}

.side-icon {
    font-size: 25px;
}


/* =========================
   MAIN CONTENT
========================= */

.content {

    width:
        min(850px, 94vw);

    margin:
        0 auto;

    text-align: center;

    position: relative;

    z-index: 5;
}


/* =========================
   EMOTIONS BUTTONS
========================= */

.emotions-menu {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 20px;
}


.emotion-button {

    width: 520px;

    max-width: 90%;

    height: 82px;

    border: none;

    border-radius: 20px;

    background:
        #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 24px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(70,100,120,0.13);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.emotion-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 22px
        rgba(70,100,120,0.18);
}

.emotion-button:active {

    transform:
        scale(0.97);
}


/* =========================
   BOTTOM SPACE
========================= */

.bottom-space {

    height: 310px;

    pointer-events: none;
}


/* =====================================================
   IPAD PORTRAIT
   1024 × 1366
===================================================== */

@media (min-width: 768px) {

    html,
    body {

        width: 100%;

        overflow-x: hidden;
    }


    .page {

        width: 100%;

        min-height: 100vh;

        padding:
            250px 35px 40px;

        overflow: hidden;
    }


    .content {

        width: 850px;

        max-width: 94vw;

        margin: 0 auto;
    }


    .emotions-menu {

        gap: 20px;
    }


    .emotion-button {

        width: 520px;

        height: 82px;

        font-size: 25px;
    }


    /*
       إلغاء الفراغ الإضافي أسفل الصفحة
       حتى لا يسبب تمريرًا غير ضروري.
    */

    .bottom-space {

        height: 0;
    }

}


/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 600px) {

    .page {

        padding:
            25px 15px 50px;
    }

    .menu-button {

        top: 20px;
        right: 20px;

        width: 55px;
        height: 55px;

        font-size: 26px;
    }

    .side-menu {

        top: 85px;
        right: 20px;

        width: 220px;
    }

    .emotion-button {

        width: 100%;

        max-width: 430px;

        height: 70px;

        font-size: 21px;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOP MENU
========================= -->

<button
    class="menu-button"
    id="menuButton"
    onclick="toggleMenu()"
    aria-label="فتح القائمة">

    ☰

</button>


<!-- =========================
     SIDE MENU
========================= -->

<div
    class="side-menu"
    id="sideMenu">


    <button
        class="side-item"
        onclick="goHome()">

        <span class="side-icon">
            🏠
        </span>

        <span>
            الرئيسية
        </span>

    </button>


    <button
        class="side-item"
        onclick="goProfile()">

        <span class="side-icon">
            👤
        </span>

        <span>
            ملفي
        </span>

    </button>


    <button
        class="side-item"
        onclick="goProgress()">

        <span class="side-icon">
            ⭐
        </span>

        <span>
            تقدمي
        </span>

    </button>


</div>


<!-- =========================
     PAGE
========================= -->

<div class="page">

    <main class="content">

        <div class="emotions-menu">


            <!-- =========================
                 1. تعلم المشاعر
            ========================== -->

            <button
                id="emotionLearnButton"
                class="emotion-button"
                onclick="goToLearnEmotions()">

                تعلم المشاعر

            </button>


            <!-- =========================
                 2. التدريب على المشاعر
            ========================== -->

            <button
                id="emotionTrainingButton"
                class="emotion-button"
                onclick="openEmotionTraining()">

                التدريب على المشاعر

            </button>


            <!-- =========================
                 3. ربط الأحداث بالمشاعر
            ========================== -->

            <button
                id="emotionEventsButton"
                class="emotion-button"
                onclick="openEventEmotion()">

                ربط الأحداث بالمشاعر

            </button>


            <!-- =========================
                 4. ارسم الشعور
            ========================== -->

            <button
                id="emotionDrawButton"
                class="emotion-button"
                onclick="openDrawFeeling()">

                ارسم الشعور

            </button>


        </div>


        <div class="bottom-space"></div>

    </main>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ciwrwmutcrarwtounelg.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_m6m2gJXfPnu_Ns6LV-jxhg_cHa00bj6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   PARENT SETTINGS
===================================================== */

const PARENT_SETTINGS_KEY =
    "rafiq_parent_controls";


/* =====================================================
   GET PARENT SETTINGS
===================================================== */

function getParentSettings() {

    const saved =
        localStorage.getItem(
            PARENT_SETTINGS_KEY
        );


    if (!saved) {

        return null;

    }


    try {

        return JSON.parse(saved);

    }

    catch(error) {

        console.error(
            "خطأ في قراءة إعدادات الوالدين:",
            error
        );

        return null;

    }

}


/* =====================================================
   APPLY PARENT EMOTION CONTROLS
===================================================== */

function applyParentEmotionControls() {

    const settings =
        getParentSettings();


    /*
       إذا لا توجد إعدادات،
       نترك الصفحة كما هي.
    */

    if (!settings) {

        return;

    }


    /* =================================================
       قسم المشاعر كامل
    ================================================= */

    if (
        settings.sections &&
        settings.sections.emotions === false
    ) {

        window.location.href =
            "home.html";

        return;

    }


    const emotions =
        settings.activities &&
        settings.activities.emotions
            ? settings.activities.emotions
            : {};


    /* =================================================
       تعلم المشاعر
    ================================================= */

    const learnButton =
        document.getElementById(
            "emotionLearnButton"
        );

    if (
        learnButton &&
        emotions.learn === false
    ) {

        learnButton.style.display =
            "none";

    }


    /* =================================================
       التدريب على المشاعر
    ================================================= */

    const trainingButton =
        document.getElementById(
            "emotionTrainingButton"
        );

    if (
        trainingButton &&
        emotions.training === false
    ) {

        trainingButton.style.display =
            "none";

    }


    /* =================================================
       ربط الأحداث بالمشاعر
    ================================================= */

    const eventsButton =
        document.getElementById(
            "emotionEventsButton"
        );

    if (
        eventsButton &&
        emotions.events === false
    ) {

        eventsButton.style.display =
            "none";

    }


    /* =================================================
       ارسم الشعور
    ================================================= */

    const drawButton =
        document.getElementById(
            "emotionDrawButton"
        );

    if (
        drawButton &&
        emotions.draw === false
    ) {

        drawButton.style.display =
            "none";

    }

}


/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle("show");

}


/* =====================================================
   CLOSE MENU WHEN CLICKING OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );

        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   BASIC NAVIGATION
===================================================== */

function goHome() {

    window.location.href =
        "home.html";

}


function goProfile() {

    alert(
        "👤 صفحة ملفي\n\nسنصممها لاحقًا."
    );

}


function goProgress() {

    alert(
        "⭐ صفحة تقدمي\n\nسنصممها لاحقًا."
    );

}


/* =====================================================
   LEARN EMOTIONS
===================================================== */

function goToLearnEmotions() {

    /*
       حماية إضافية:
       حتى لو حاول الطفل تشغيل الدالة
       بعد إخفاء الزر.
    */

    const settings =
        getParentSettings();

    if (
        settings &&
        settings.sections &&
        settings.sections.emotions === false
    ) {

        window.location.href =
            "home.html";

        return;

    }

    if (
        settings &&
        settings.activities &&
        settings.activities.emotions &&
        settings.activities.emotions.learn === false
    ) {

        return;

    }


    window.location.href =
        "happy.html";

}


/* =====================================================
   GET CHILD INTEREST
===================================================== */

async function getChildInterest() {

    const childId =
        localStorage.getItem(
            "raf iqChildId".replace(" ", "")
        );


    if (!childId) {

        throw new Error(
            "لم يتم العثور على ID الطفل."
        );

    }


    const {
        data,
        error
    } = await supabaseClient

        .from("children")

        .select("interests")

        .eq(
            "id",
            childId
        )

        .maybeSingle();


    if (error) {

        console.error(
            "Supabase Error:",
            error
        );

        throw error;

    }


    if (
        !data ||
        !data.interests
    ) {

        throw new Error(
            "لم يتم العثور على اهتمام الطفل."
        );

    }


    return String(
        data.interests
    ).trim().toLowerCase();

}


/* =====================================================
   CHECK INTEREST
===================================================== */

function isCars(interest) {

    return (
        interest === "سيارات" ||
        interest === "سيارة" ||
        interest === "cars" ||
        interest === "car"
    );

}


function isSpace(interest) {

    return (
        interest === "فضاء" ||
        interest === "الفضاء" ||
        interest === "space"
    );

}


/* =====================================================
   TRAINING ON EMOTIONS
===================================================== */

async function openEmotionTraining() {

    const settings =
        getParentSettings();


    if (
        settings &&
        settings.sections &&
        settings.sections.emotions === false
    ) {

        window.location.href =
            "home.html";

        return;

    }


    if (
        settings &&
        settings.activities &&
        settings.activities.emotions &&
        settings.activities.emotions.training === false
    ) {

        return;

    }


    try {

        const interest =
            await getChildInterest();


        if (
            isSpace(interest)
        ) {

            window.location.href =
                "feeling-space.html";

            return;

        }


        if (
            isCars(interest)
        ) {

            window.location.href =
                "feeling-car.html";

            return;

        }


        console.warn(
            "اهتمام الطفل غير مدعوم:",
            interest
        );

    }

    catch (error) {

        console.error(
            "Training Error:",
            error
        );

    }

}


/* =====================================================
   LINK EVENTS WITH EMOTIONS
===================================================== */

async function openEventEmotion() {

    const settings =
        getParentSettings();


    if (
        settings &&
        settings.sections &&
        settings.sections.emotions === false
    ) {

        window.location.href =
            "home.html";

        return;

    }


    if (
        settings &&
        settings.activities &&
        settings.activities.emotions &&
        settings.activities.emotions.events === false
    ) {

        return;

    }


    try {

        const interest =
            await getChildInterest();


        if (
            isSpace(interest)
        ) {

            window.location.href =
                "choose-space-emotion.html";

            return;

        }


        if (
            isCars(interest)
        ) {

            window.location.href =
                "choose-car-emotion.html";

            return;

        }


        console.warn(
            "اهتمام الطفل غير مدعوم:",
            interest
        );

    }

    catch (error) {

        console.error(
            "Event Emotion Error:",
            error
        );

    }

}


/* =====================================================
   DRAW FEELING
===================================================== */

async function openDrawFeeling() {

    const settings =
        getParentSettings();


    if (
        settings &&
        settings.sections &&
        settings.sections.emotions === false
    ) {

        window.location.href =
            "home.html";

        return;

    }


    if (
        settings &&
        settings.activities &&
        settings.activities.emotions &&
        settings.activities.emotions.draw === false
    ) {

        return;

    }


    try {

        const interest =
            await getChildInterest();


        if (
            isSpace(interest)
        ) {

            window.location.href =
                "draw-space.html";

            return;

        }


        if (
            isCars(interest)
        ) {

            window.location.href =
                "draw-feeling.html";

            return;

        }


        console.warn(
            "اهتمام الطفل غير مدعوم:",
            interest
        );

    }

    catch (error) {

        console.error(
            "Draw Feeling Error:",
            error
        );

    }

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        applyParentEmotionControls();

    }
);

</script>


</body>

</html>
