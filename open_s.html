<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">



<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    background-image:
        url("images/sami.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;

    overflow: hidden;

    color: #555;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: 100%;
    height: 100vh;

    position: relative;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 105px;
}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button {

    position: fixed;

    top: 35px;

    left: 35px;

    width: 155px;

    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,0.18);

    z-index: 1001;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.previous-button:hover {

    transform:
        translateY(-3px);

    background: #d8edfc;
}

.previous-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: fixed;

    top: 35px;

    right: 35px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.94);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,0.18);

    z-index: 1000;

    transition:
        transform 0.2s ease;
}

.menu-button:hover {

    transform:
        translateY(-3px);
}

.menu-button:active {

    transform:
        scale(0.95);
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: fixed;

    top: 115px;

    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,0.96);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,0.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: 0.2s ease;
}

.side-menu button:hover {

    background: #e4f2ff;

    transform:
        translateX(-3px);
}

.side-menu button:last-child {

    margin-bottom: 0;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width:
        min(1100px, 94vw);

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    z-index: 10;
}


/* =====================================================
   TITLE
===================================================== */

.title-card {

    background:
        rgba(228,242,255,0.94);

    border-radius: 30px;

    padding:
        20px 55px;

    box-shadow:
        0 8px 22px
        rgba(60,90,110,0.15);

    text-align: center;

    animation:
        titleFloat 4s ease-in-out infinite;
}

.title-card h1 {

    margin: 0;

    color: #55718b;

    font-size: 34px;

    font-weight: 900;
}

@keyframes titleFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-4px);
    }
}


/* =====================================================
   VIDEO
===================================================== */

.video-container {

    width: 900px;

    max-width: 92vw;

    height: 505px;

    margin-top: 45px;

    background: white;

    border-radius: 32px;

    padding: 14px;

    box-shadow:
        0 12px 30px
        rgba(60,90,110,0.20);

    overflow: hidden;

    position: relative;
}

.video-container video {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 23px;

    background: #f7fbff;
}


/* =====================================================
   VIDEO LABEL
===================================================== */

.video-label {

    margin-top: 22px;

    background:
        rgba(255,255,255,0.92);

    padding:
        13px 32px;

    border-radius: 20px;

    color: #55718b;

    font-size: 22px;

    font-weight: 800;

    box-shadow:
        0 6px 18px
        rgba(60,90,110,0.12);
}


/* =====================================================
   IPAD PORTRAIT
===================================================== */

@media (min-width: 768px) {

    .page {

        height: 100vh;

        min-height: 0;

        padding-top: 105px;

        overflow: hidden;
    }

    .title-card h1 {

        font-size: 34px;
    }

    .video-container {

        width: 900px;

        height: 505px;

        /* نزلنا الفيديو إلى منتصف الصفحة */
        margin-top: 250px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 767px) {

    .page {

        padding-top: 95px;

        overflow: hidden;
    }

    .previous-button {

        top: 20px;

        left: 20px;

        width: 125px;

        height: 52px;

        font-size: 18px;
    }

    .menu-button {

        top: 20px;

        right: 20px;

        width: 55px;

        height: 55px;

        font-size: 27px;
    }

    .side-menu {

        top: 90px;

        right: 20px;

        width: 220px;
    }

    .title-card {

        max-width: 90vw;

        padding:
            16px 25px;

    }

    .title-card h1 {

        font-size: 25px;
    }

    .video-container {

        width: 94vw;

        height:
            calc(94vw * 0.5625);

        min-height: 250px;

        margin-top: 35px;

        padding: 9px;

        border-radius: 24px;
    }

    .video-container video {

        border-radius: 17px;
    }

    .video-label {

        font-size: 18px;

        padding:
            10px 20px;

        margin-top: 16px;
    }

}
/* =====================================================
   IPAD - REMOVE SCROLL ONLY
   بدون تغيير التصميم أو القياسات
===================================================== */

@media (min-width: 768px) {

    html,
    body {
        overflow: hidden;
    }

}
</style>

</head>


<body>


<!-- =====================================================
     PREVIOUS
===================================================== -->

<button
    class="previous-button"
    onclick="goBackToStories()">

    ← السابق

</button>


<!-- =====================================================
     MENU BUTTON
===================================================== -->

<button
    class="menu-button"
    id="menuButton"
    onclick="toggleMenu()">

    ☰

</button>


<!-- =====================================================
     SIDE MENU
===================================================== -->

<div
    class="side-menu"
    id="sideMenu">

    <button onclick="goHome()">
        🏠 الرئيسية
    </button>

    <button onclick="goProfile()">
        👤 ملفي
    </button>

    <button onclick="goProgress()">
        ⭐ تقدمي
    </button>

</div>


<!-- =====================================================
     MAIN PAGE
===================================================== -->

<main class="page">

    <div class="content">


        <!-- TITLE -->

        <div class="title-card">

            

        </div>


        <!-- VIDEO -->

        <div class="video-container">

            <video
                id="storyVideo"
                controls
                playsinline
                preload="metadata">

                <source
                    src="videos/open.MP4"
                    type="video/mp4">

                متصفحك لا يدعم تشغيل الفيديو.

            </video>

        </div>


        <div class="video-label">

فيديو توضيحي
الهدف من  هذه الصفحة(نحوّل القصة إلى تجربة لعب تفاعلية، يعيش فيها الطفل أحداث القصة بنفسه، ويتحرك داخل المشاهد، ويتفاعل مع الشخصيات والبيئة، ويتخذ قرارات تؤثر في مجرى الأحداث. وبهذا ينتقل الطفل من دور المشاهد إلى دور الشخصية الرئيسية، ويتعلم من خلال الاستكشاف والتجربة والتفاعل)
        </div>


    </div>

</main>


<script>

/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle(
        "show"
    );
}


/* =====================================================
   CLOSE MENU WHEN CLICKING OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );

        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goBackToStories() {

    window.location.href =
        "stories.html";
}


function goHome() {

    window.location.href =
        "home.html";
}


function goProfile() {

    window.location.href =
        "profile.html";
}


function goProgress() {

    window.location.href =
        "progress.html";
}

</script>

</body>

</html>
