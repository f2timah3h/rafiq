<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>اختر اللون الصحيح - رفيق</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    color: #40566d;

    background-color: #ffffff;

    background-image:
        url("images/spacee.jpeg");

    background-size:
        100% 100%;

    background-position:
        center;

    background-repeat:
        no-repeat;

    position: relative;

}


/* =====================================================
   PAGE
===================================================== */

.page {

    position: relative;

    width: 100vw;
    height: 100vh;

    min-height: 1366px;

    overflow: hidden;

}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button {

    position: fixed;

    top: 35px;
    left: 35px;

    width: 155px;
    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,.18);

    z-index: 100;

    transition: .2s ease;

}

.previous-button:hover {

    transform:
        translateY(-3px);

    background: #d8edfc;

}

.previous-button:active {

    transform:
        scale(.96);

}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: fixed;

    top: 35px;
    right: 35px;

    width: 65px;
    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,.96);

    color: #55718b;

    font-size: 31px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,.18);

    z-index: 100;

    transition: .2s ease;

}

.menu-button:hover {

    transform:
        translateY(-3px);

}

.menu-button:active {

    transform:
        scale(.95);

}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: fixed;

    top: 115px;
    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition: .3s ease;

    z-index: 99;

}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;

}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #55718b;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;

    transition: .2s ease;

}

.side-menu button:hover {

    background: #e4f2ff;

    transform:
        translateX(-3px);

}


/* =====================================================
   MAIN CONTENT
===================================================== */

.content {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 900px;

    max-width: 90vw;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


/* =====================================================
   QUESTION
===================================================== */

.question-area {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


.question {

    margin: 0;

    color: #40566d;

    font-size: 46px;

    font-weight: 900;

    line-height: 1.4;

    text-align: center;

    text-shadow:
        0 2px 5px
        rgba(70,90,110,.08);

}


.question-hint {

    margin-top: 12px;

    color: #8296a9;

    font-size: 21px;

    font-weight: 700;

}


/* =====================================================
   CARS CONTAINER
===================================================== */

.cars-container {

    width: 100%;

    display: flex;

    direction: ltr;

    align-items: center;

    justify-content: center;

    gap: 100px;

    margin-top: 55px;

}


/* =====================================================
   CAR OPTION
===================================================== */

.car-option {

    position: relative;

    width: 200px;
    height: 200px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    border-radius: 30px;

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;

}


/* =====================================================
   HOVER
===================================================== */

.car-option:hover {

    transform:
        translateY(-8px)
        scale(1.04);

}


/* =====================================================
   PRESS
===================================================== */

.car-option:active {

    transform:
        scale(.94);

}


/* =====================================================
   CAR IMAGES
===================================================== */

.car-option img {

    width: 200px;

    height: 200px;

    object-fit: contain;

    pointer-events: none;

    user-select: none;

}


/* =====================================================
   LIGHT MOVEMENT
===================================================== */

.car-blue {

    animation:
        blueCarMove
        3.6s
        ease-in-out
        infinite;

}


.car-red {

    animation:
        redCarMove
        3.9s
        ease-in-out
        infinite;

    animation-delay:
        .4s;

}


.car-green {

    animation:
        greenCarMove
        4.2s
        ease-in-out
        infinite;

    animation-delay:
        .8s;

}


/* =====================================================
   BLUE MOVEMENT
===================================================== */

@keyframes blueCarMove {

    0%,
    100% {

        transform:
            translateX(-5px)
            translateY(0)
            rotate(-1deg);

    }

    50% {

        transform:
            translateX(7px)
            translateY(-7px)
            rotate(1deg);

    }

}


/* =====================================================
   RED MOVEMENT
===================================================== */

@keyframes redCarMove {

    0%,
    100% {

        transform:
            translateY(3px)
            rotate(1deg);

    }

    50% {

        transform:
            translateY(-9px)
            rotate(-1deg);

    }

}


/* =====================================================
   GREEN MOVEMENT
===================================================== */

@keyframes greenCarMove {

    0%,
    100% {

        transform:
            translateX(6px)
            translateY(0)
            rotate(1deg);

    }

    50% {

        transform:
            translateX(-7px)
            translateY(-6px)
            rotate(-2deg);

    }

}


/* =====================================================
   STOP CAR MOVEMENT
===================================================== */

.car-option.stop-animation img {

    animation-play-state:
        paused;

}

.car-option.stop-animation {

    animation-play-state:
        paused;

}


/* =====================================================
   SELECTED CAR
===================================================== */

.car-option.selected {

    background:
        rgba(255,255,255,.55);

    box-shadow:
        0 10px 25px
        rgba(60,80,100,.12);

}


/* =====================================================
   CORRECT CAR
===================================================== */

.car-option.correct {

    animation:
        correctBounce
        .65s
        ease
        forwards;

}


@keyframes correctBounce {

    0% {

        transform:
            scale(1);

    }

    35% {

        transform:
            scale(1.15)
            translateY(-12px);

    }

    65% {

        transform:
            scale(.98)
            translateY(2px);

    }

    100% {

        transform:
            scale(1.08)
            translateY(-8px);

    }

}


/* =====================================================
   WRONG CAR
===================================================== */

.car-option.wrong {

    animation:
        wrongShake
        .4s
        ease;

}


@keyframes wrongShake {

    0% {

        transform:
            translateX(0);

    }

    25% {

        transform:
            translateX(-10px);

    }

    50% {

        transform:
            translateX(10px);

    }

    75% {

        transform:
            translateX(-7px);

    }

    100% {

        transform:
            translateX(0);

    }

}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

    margin-top: 25px;

    min-height: 45px;

    font-size: 28px;

    font-weight: 900;

    opacity: 0;

    transform:
        translateY(10px);

    transition:
        .3s ease;

}


.feedback.show {

    opacity: 1;

    transform:
        translateY(0);

}


.feedback.success {

    color: #56a875;

}


.feedback.wrong {

    color: #8092a0;

}


/* =====================================================
   SPACE SUCCESS DECORATION 🚀🌙✨
===================================================== */

.success-decoration {

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0;

    z-index: 20;

    overflow: hidden;

}


.success-decoration.show {

    opacity: 1;

}


/* =====================================================
   SPACE BALLOONS
===================================================== */

.space-balloon {

    position: absolute;

    font-size: 58px;

    opacity: 0;

    animation:
        spaceBalloonFloat
        2.7s
        ease-out
        forwards;

}


.space-balloon-1 {

    left: 8%;
    bottom: -70px;

}


.space-balloon-2 {

    left: 25%;
    bottom: -80px;

    animation-delay:
        .25s;

}


.space-balloon-3 {

    right: 25%;
    bottom: -80px;

    animation-delay:
        .15s;

}


.space-balloon-4 {

    right: 8%;
    bottom: -70px;

    animation-delay:
        .35s;

}


@keyframes spaceBalloonFloat {

    0% {

        opacity: 0;

        transform:
            translateY(0)
            rotate(-5deg)
            scale(.6);

    }

    20% {

        opacity: 1;

    }

    55% {

        transform:
            translateY(-45vh)
            rotate(8deg)
            scale(1);

    }

    100% {

        opacity: 1;

        transform:
            translateY(-110vh)
            rotate(-10deg)
            scale(1.05);

    }

}


/* =====================================================
   PLANETS 🪐
===================================================== */

.space-planet {

    position: absolute;

    font-size: 62px;

    opacity: 0;

    animation:
        planetFloat
        2s
        ease-out
        forwards;

}


.planet-1 {

    left: 13%;
    top: 23%;

}


.planet-2 {

    right: 13%;
    top: 25%;

    animation-delay:
        .2s;

}


.planet-3 {

    left: 44%;
    top: 10%;

    font-size: 45px;

    animation-delay:
        .35s;

}


@keyframes planetFloat {

    0% {

        opacity: 0;

        transform:
            scale(.2)
            rotate(0deg);

    }

    45% {

        opacity: 1;

        transform:
            scale(1.25)
            rotate(25deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


/* =====================================================
   ROCKETS 🚀
===================================================== */

.space-rocket {

    position: absolute;

    font-size: 68px;

    opacity: 0;

}


.rocket-1 {

    left: -100px;

    top: 42%;

    animation:
        rocketFly
        2.2s
        ease-in
        forwards;

}


.rocket-2 {

    right: -100px;

    bottom: 20%;

    animation:
        rocketFlyReverse
        2.5s
        ease-in
        forwards;

    animation-delay:
        .3s;

}


@keyframes rocketFly {

    0% {

        opacity: 0;

        transform:
            translate(0, 0)
            rotate(15deg)
            scale(.6);

    }

    15% {

        opacity: 1;

    }

    100% {

        opacity: 1;

        transform:
            translate(115vw, -45vh)
            rotate(15deg)
            scale(1);

    }

}


@keyframes rocketFlyReverse {

    0% {

        opacity: 0;

        transform:
            translate(0, 0)
            rotate(-15deg)
            scale(.6);

    }

    15% {

        opacity: 1;

    }

    100% {

        opacity: 1;

        transform:
            translate(-115vw, -35vh)
            rotate(-15deg)
            scale(1);

    }

}


/* =====================================================
   ASTRONAUT 👨‍🚀
===================================================== */

.astronaut {

    position: absolute;

    right: 7%;

    bottom: 8%;

    font-size: 68px;

    opacity: 0;

    animation:
        astronautFloat
        2.5s
        ease-out
        forwards;

    animation-delay:
        .25s;

}


@keyframes astronautFloat {

    0% {

        opacity: 0;

        transform:
            translateY(70px)
            rotate(-10deg)
            scale(.5);

    }

    35% {

        opacity: 1;

        transform:
            translateY(-20px)
            rotate(8deg)
            scale(1.15);

    }

    100% {

        opacity: 1;

        transform:
            translateY(-45px)
            rotate(-5deg)
            scale(1);

    }

}


/* =====================================================
   SHOOTING STARS 🌠
===================================================== */

.shooting-star {

    position: absolute;

    width: 95px;

    height: 5px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95)
        );

    opacity: 0;

    transform:
        rotate(-30deg);

}


.shooting-star-1 {

    left: 20%;
    top: 18%;

    animation:
        shootingStar
        1.7s
        ease-out
        forwards;

}


.shooting-star-2 {

    right: 18%;
    top: 38%;

    animation:
        shootingStar
        1.8s
        ease-out
        forwards;

    animation-delay:
        .35s;

}


@keyframes shootingStar {

    0% {

        opacity: 0;

        transform:
            translate(0,0)
            rotate(-30deg)
            scale(.5);

    }

    15% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:
            translate(180px,100px)
            rotate(-30deg)
            scale(1);

    }

}


/* =====================================================
   STARS ✨
===================================================== */

.space-star {

    position: absolute;

    color: white;

    font-size: 40px;

    opacity: 0;

    animation:
        starTwinkle
        1.4s
        ease-out
        forwards;

}


.star-1 {

    left: 12%;
    top: 38%;

}


.star-2 {

    left: 30%;
    top: 17%;

    animation-delay:
        .15s;

}


.star-3 {

    right: 31%;
    top: 17%;

    animation-delay:
        .25s;

}


.star-4 {

    right: 12%;
    top: 42%;

    animation-delay:
        .35s;

}


.star-5 {

    left: 48%;
    top: 30%;

    font-size: 30px;

    animation-delay:
        .45s;

}


@keyframes starTwinkle {

    0% {

        opacity: 0;

        transform:
            scale(.2)
            rotate(0deg);

    }

    45% {

        opacity: 1;

        transform:
            scale(1.4)
            rotate(45deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next-button {

    position: fixed;

    bottom: 35px;

    right: 35px;

    width: 165px;

    height: 62px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #55718b;

    font-family: inherit;

    font-size: 21px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,.18);

    opacity: .5;

    pointer-events: none;

    transition:
        .25s ease;

    z-index: 80;

}


.next-button.ready {

    opacity: 1;

    pointer-events: auto;

}


.next-button.ready:hover {

    transform:
        translateY(-3px);

    background: #d8edfc;

}


.next-button.ready:active {

    transform:
        scale(.96);

}


/* =====================================================
   IPAD PORTRAIT
===================================================== */

@media
(min-width: 768px)
and
(max-width: 1100px) {


    .content {

        width: 850px;

        max-width: 88vw;

    }


    .question {

        font-size: 44px;

    }


    .question-hint {

        font-size: 21px;

    }


    .cars-container {

        gap: 90px;

        margin-top: 55px;

    }


    .car-option {

        width: 300px;
        height: 300px;

    }


    .car-option img {

        width: 300px;
        height: 300px;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:767px) {


    .previous-button {

        top: 20px;
        left: 20px;

        width: 125px;
        height: 52px;

        font-size: 18px;

    }


    .menu-button {

        top: 20px;
        right: 20px;

        width: 55px;
        height: 55px;

        font-size: 27px;

    }


    .side-menu {

        top: 90px;
        right: 20px;

        width: 220px;

    }


    .content {

        width: 94vw;

    }


    .question {

        font-size: 31px;

    }


    .question-hint {

        font-size: 17px;

    }


    .cars-container {

        gap: 10px;

        margin-top: 40px;

    }


    .car-option {

        width: 300px;
        height: 300px;

    }


    .car-option img {

        width: 300px;
        height: 300px;

    }


    .next-button {

        right: 20px;
        bottom: 20px;

        width: 145px;
        height: 55px;

        font-size: 19px;

    }


    .space-balloon {

        font-size: 45px;

    }


    .space-rocket {

        font-size: 50px;

    }


    .astronaut {

        font-size: 50px;

    }

}

</style>

</head>


<body>


<div class="page">


    <!-- =================================================
         PREVIOUS
    ================================================== -->

    <button
        class="previous-button"
        onclick="goBack()">

        ← السابق

    </button>



    <!-- =================================================
         MENU
    ================================================== -->

    <button
        class="menu-button"
        id="menuButton"
        onclick="toggleMenu()">

        ☰

    </button>



    <div
        class="side-menu"
        id="sideMenu">


        <button onclick="goHome()">

            🏠 الرئيسية

        </button>


        <button onclick="goProfile()">

            👤 ملفي

        </button>


        <button onclick="goProgress()">

            ⭐ تقدمي

        </button>


    </div>



    <!-- =================================================
         SPACE SUCCESS DECORATION
    ================================================== -->

    <div
        class="success-decoration"
        id="successDecoration">


        <!-- 🚀 صاروخ -->

        <div class="space-rocket rocket-1">

            🚀

        </div>


        <!-- 🚀 صاروخ آخر -->

        <div class="space-rocket rocket-2">

            🚀

        </div>


        <!-- 🪐 كواكب -->

        <div class="space-planet planet-1">

            🪐

        </div>


        <div class="space-planet planet-2">

            🪐

        </div>


        <div class="space-planet planet-3">

            🌍

        </div>


        <!-- 👨‍🚀 رائد فضاء -->

        <div class="astronaut">

            👨‍🚀

        </div>


        <!-- 🎈 بالونات فضائية -->

        <div class="space-balloon space-balloon-1">

            🌙

        </div>


        <div class="space-balloon space-balloon-2">

            ⭐

        </div>


        <div class="space-balloon space-balloon-3">

            🌎

        </div>


        <div class="space-balloon space-balloon-4">

            🪐

        </div>


        <!-- ✨ نجوم -->

        <div class="space-star star-1">

            ✦

        </div>


        <div class="space-star star-2">

            ✨

        </div>


        <div class="space-star star-3">

            ★

        </div>


        <div class="space-star star-4">

            ✦

        </div>


        <div class="space-star star-5">

            ✨

        </div>


        <!-- 🌠 نجوم ساقطة -->

        <div class="shooting-star shooting-star-1"></div>

        <div class="shooting-star shooting-star-2"></div>


    </div>



    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <div class="content">


        <div class="question-area">


            <h1 class="question">

                أين الصاروخ الأحمر

            </h1>


            <div class="question-hint">

                اختر الصاروخ ذا اللون الصحيح

            </div>


        </div>



        <!-- =================================================
             CARS
        ================================================== -->

        <div class="cars-container">


            <!-- BLUE -->

            <div
                class="car-option"
                onclick="checkAnswer('blue', this)">


                <img
                    src="images/blusa.png"
                    class="car-blue"
                    alt="السيارة الزرقاء">


            </div>



            <!-- RED - CORRECT -->

            <div
                class="car-option"
                id="correctCar"
                onclick="checkAnswer('red', this)">


                <img
                    src="images/resa.png"
                    class="car-red"
                    alt="السيارة الحمراء">


            </div>



            <!-- GREEN -->

            <div
                class="car-option"
                onclick="checkAnswer('green', this)">


                <img
                    src="images/gresa.png"
                    class="car-green"
                    alt="السيارة الخضراء">


            </div>


        </div>



        <!-- FEEDBACK -->

        <div
            class="feedback"
            id="feedback">

        </div>


    </div>



    <!-- =================================================
         NEXT BUTTON
    ================================================== -->

    <button
        class="next-button"
        id="nextButton"
        onclick="goNext()">

        التالي →

    </button>


</div>



<script>

/* =====================================================
   MENU
===================================================== */

function toggleMenu() {

    const menu =
        document.getElementById(
            "sideMenu"
        );

    menu.classList.toggle(
        "show"
    );

}


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );

        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function goBack() {

    window.location.href =
        "colors.html";

}


function goHome() {

    window.location.href =
        "home.html";

}


function goProfile() {

    alert(

/* =====================================================
   ANSWER STATE
===================================================== */

let answered = false;


/* =====================================================
   WRONG ATTEMPTS
===================================================== */

let wrongAttempts = 0;


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(color, selectedCar) {


    /*
       إذا انتهى السؤال
       لا نسمح بمحاولة جديدة
    */

    if (answered) {

        return;

    }


    /* =================================================
       ❌ WRONG
    ================================================= */

    if (color !== "red") {


        /*
           تسجيل محاولة خاطئة
        */

        wrongAttempts++;


        /*
           إضافة حركة الخطأ للسيارة
        */

        selectedCar.classList.add(
            "wrong"
        );


        showWrong();


        /*
           إزالة الحركة بعد انتهاء الاهتزاز
        */

        setTimeout(
            function() {

                selectedCar.classList.remove(
                    "wrong"
                );

            },
            450
        );


        /*
           الطفل يبقى في نفس السؤال
        */

        return;

    }


    /* =================================================
       ✅ CORRECT
    ================================================= */

    answered = true;


    stopCarAnimations();


    /*
       حفظ إكمال السؤال
    */

    localStorage.setItem(
        "colorChoose1Completed",
        "completed"
    );


    /*
       حفظ عدد الأخطاء
    */

    localStorage.setItem(
        "colorChoose1WrongAttempts",
        wrongAttempts
    );


    /* =================================================
       إذا أخطأ الطفل سابقًا
       ينتقل إلى التعزيز
    ================================================= */

    if (wrongAttempts > 0) {


        localStorage.setItem(
            "colorNeedsReinforcement",
            "red"
        );


        /*
           نوضح الإجابة الصحيحة أولًا
        */

        showCorrectAfterMistake(
            selectedCar
        );


        setTimeout(
            function() {

                window.location.href =
                    "red-reinforcement.html";

            },
            900
        );


        return;

    }


    /* =================================================
       صحيح من أول محاولة 🎉
    ================================================= */

    showSuccess();


    playApplause();

}


/* =====================================================
   STOP CAR ANIMATIONS
===================================================== */

function stopCarAnimations() {


    const cars =
        document.querySelectorAll(
            ".car-option"
        );


    cars.forEach(
        function(car) {

            car.classList.add(
                "stop-animation"
            );

        }
    );

}


/* =====================================================
   WRONG ANSWER
===================================================== */

function showWrong() {


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        "feedback wrong show";


    feedback.innerHTML =
        "حاول مرة أخرى 🌱";


    setTimeout(
        function() {

            feedback.classList.remove(
                "show"
            );

        },
        1000
    );

}


/* =====================================================
   CORRECT AFTER MISTAKE
===================================================== */

function showCorrectAfterMistake(
    selectedCar
) {


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        "feedback success show";


    feedback.innerHTML =
    "أحسنت! 🎉 هذا هو الصاروخ  الأحمر ❤️";


    const correct =
        document.getElementById(
            "correctCar"
        );


    correct.classList.add(
        "correct"
    );


    correct.classList.add(
        "selected"
    );

}


/* =====================================================
   SUCCESS - FIRST TRY
===================================================== */

function showSuccess() {


    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        "feedback success show";


    feedback.innerHTML =
        "أحسنت! 🎉🚀";


    
    const correct =
        document.getElementById(
            "correctCar"
        );


    correct.classList.add(
        "correct"
    );


    correct.classList.add(
        "selected"
    );


    /*
       تشغيل الزينة الفضائية
    */

    const decoration =
        document.getElementById(
            "successDecoration"
        );


    decoration.classList.add(
        "show"
    );


    /*
       تفعيل زر التالي
    */

    const next =
        document.getElementById(
            "nextButton"
        );


    next.classList.add(
        "ready"
    );

}


/* =====================================================
   APPLAUSE
===================================================== */

function playApplause() {


    try {


        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audio =
            new AudioContext();


        for (
            let i = 0;
            i < 22;
            i++
        ) {


            const oscillator =
                audio.createOscillator();


            const gain =
                audio.createGain();


            oscillator.type =
                "square";


            oscillator.frequency.value =
                450 +
                Math.random() * 1100;


            const startTime =
                audio.currentTime +
                i * 0.045;


            gain.gain.setValueAtTime(
                0,
                startTime
            );


            gain.gain.linearRampToValueAtTime(
                0.10,
                startTime + 0.008
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                startTime + 0.045
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                audio.destination
            );


            oscillator.start(
                startTime
            );


            oscillator.stop(
                startTime + 0.05
            );

        }


    }
    catch(error) {

        console.log(
            "Audio unavailable"
        );

    }

}


/* =====================================================
   NEXT
===================================================== */

function goNext() {


    if (!answered) {

        return;

    }


    /*
       الصحيح من أول محاولة
       ينتقل للسؤال التالي
    */

    if (
        wrongAttempts === 0
    ) {

        window.location.href =
            "choose-greens.html";

    }

}
