/* =====================================================

===================================================== */

const baseWidth = 1024;
const baseHeight = 1366;

function resizePage() {

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    document.body.style.setProperty(
        "--page-scale",
        scale
    );

}

resizePage();

window.addEventListener(
    "resize",
    resizePage
);

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);

/* =====================================================
   PRELOAD BACKGROUND
===================================================== */

function preloadBackground(
    imagePath
) {

    return new Promise(
        function(resolve) {

            const image =
                new Image();

            image.onload =
                function() {

                    resolve(true);

                };

            image.onerror =
                function() {

                    console.warn(
                        "تعذر تحميل الخلفية:",
                        imagePath
                    );

                    resolve(false);

                };

            image.src =
                imagePath;

        }
    );

}

/* =====================================================
   APPLY BACKGROUND
===================================================== */

async function applyBackground(
    imagePath
) {

    await preloadBackground(
        imagePath
    );

    document.body.style.backgroundImage =
        'url("' +
        imagePath +
        '")';

    document.body.classList.add(
        "theme-ready"
    );

}

            questionBackground

        );

            data,

            .from("children")

            .select("interests")

}

/* =====================================================

===================================================== */

function arabicNumber(number) {

    return String(number).replace(
        /\d/g,
        digit =>
            "٠١٢٣٤٥٦٧٨٩"[digit]
    );

}

/* =====================================================
   إيقاف القراءة
===================================================== */

function stopSpeech() {

    if (
        "speechSynthesis" in window
    ) {

        speechSynthesis.cancel();

    }

}

/* =====================================================
   قراءة النص
===================================================== */

function speak(text) {

    if (
        !text ||
        !("speechSynthesis" in window)
    ) {

        return;

    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "ar-SA";

    utterance.rate =
        0.82;

    utterance.pitch =
        1.05;

    speechSynthesis.speak(
        utterance
    );

}

/* =====================================================
   تحديث زر السابق
===================================================== */

function updatePreviousButton() {

    previousButton.style.opacity =
        "1";

}

/* =====================================================
   تشغيل صوت الفيديو بعد تفاعل المستخدم
===================================================== */

let currentVideo = null;

let videoInteractionStarted = false;

function enableVideoSound() {

    if (
        !currentVideo ||
        videoInteractionStarted
    ) {

        return;

    }

    videoInteractionStarted = true;

    currentVideo.muted = false;

    currentVideo.volume = 1;

    const playPromise =
        currentVideo.play();

    if (
        playPromise &&
        typeof playPromise.catch === "function"
    ) {

        playPromise.catch(
            function() {

                currentVideo.muted =
                    true;

            }
        );

    }

}

/* =====================================================
   تشغيل الفيديو
===================================================== */

function startVideo(video) {

    currentVideo =
        video;

    video.muted =
        true;

    video.volume =
        1;

    video.autoplay =
        true;

    video.playsInline =
        true;

    video.setAttribute(
        "playsinline",
        ""
    );

    video.setAttribute(
        "webkit-playsinline",
        ""
    );

    video.setAttribute(
        "muted",
        ""
    );

    video.loop =
        true;

    video.preload =
        "auto";

    const playPromise =
        video.play();

    if (
        playPromise &&
        typeof playPromise.catch === "function"
    ) {

        playPromise.catch(
            function(error) {

                console.warn(
                    "تعذر تشغيل الفيديو تلقائيًا:",
                    error
                );

                const startAfterInteraction =
                    function() {

                        video.muted =
                            true;

                        video.play()
                            .catch(
                                function() {}
                            );

                    };

                document.addEventListener(
                    "pointerdown",
                    startAfterInteraction,
                    {
                        once: true
                    }
                );

            }
        );

    }

    video.addEventListener(
        "pointerdown",
        function() {

            enableVideoSound();

        }
    );

}

/* =====================================================
   عرض الخطوة
===================================================== */

function renderStep() {

    stopSpeech();

    selectedAnswer =
        false;

    currentVideo =
        null;

    videoInteractionStarted =
        false;

    const step =
        steps[currentStep];

    if (
        step.type === "question"
    ) {

        document.body.style.backgroundImage =
            'url("' +
            questionBackground +
            '")';

    }

    else {

        document.body.style.backgroundImage =
            'url("' +
            childBackground +
            '")';

    }

    stepCounter.textContent =
        arabicNumber(
            currentStep + 1
        )
        +
        " / "
        +
        arabicNumber(
            steps.length
        );

    storyArea.innerHTML =
        "";

    /* =================================================
       فيديو
    ================================================= */

    if (
        step.type === "video"
    ) {

        const videoContainer =
            document.createElement(
                "div"
            );

        videoContainer.className =
            "video-container";

        const video =
            document.createElement(
                "video"
            );

        video.className =
            "story-video";

        video.src =
            step.video;

        video.autoplay =
            true;

        video.muted =
            true;

        video.loop =
            true;

        video.playsInline =
            true;

        video.setAttribute(
            "playsinline",
            ""
        );

        video.setAttribute(
            "webkit-playsinline",
            ""
        );

        video.preload =
            "auto";

        videoContainer.appendChild(
            video
        );

        storyArea.appendChild(
            videoContainer
        );

        if (
            step.text
        ) {

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "story-text";

            text.textContent =
                step.text;

            storyArea.appendChild(
                text
            );

        }

        video.load();

        video.addEventListener(
            "loadeddata",
            function() {

                startVideo(
                    video
                );

            },
            {
                once: true
            }
        );

        if (
            video.readyState >= 2
        ) {

            startVideo(
                video
            );

        }

        nextButton.classList.remove(
            "hidden"
        );

        nextButton.textContent =
            "التالي ›";

    }

    /* =================================================
       سؤال
    ================================================= */

    else if (
        step.type === "question"
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "question-box";

        const questionRow =
            document.createElement(
                "div"
            );

        questionRow.className =
            "question-row";

        const question =
            document.createElement(
                "div"
            );

        question.className =
            "question";

        question.textContent =
            step.question;

        const micButton =
            document.createElement(
                "button"
            );

        micButton.className =
            "mic-button";

        micButton.innerHTML =
            "🎙️";

        micButton.setAttribute(
            "aria-label",
            "استمع إلى السؤال"
        );

        micButton.addEventListener(
            "click",
            function() {

                speak(
                    step.question
                );

                micButton.classList.add(
                    "speaking"
                );

                setTimeout(
                    function() {

                        micButton.classList.remove(
                            "speaking"
                        );

                    },
                    1200
                );

            }
        );

        questionRow.appendChild(
            question
        );

        questionRow.appendChild(
            micButton
        );

        box.appendChild(
            questionRow
        );

        const answers =
            document.createElement(
                "div"
            );

        answers.className =
            "answers";

        const feedback =
            document.createElement(
                "div"
            );

        feedback.className =
            "feedback";

        step.answers.forEach(
            function(answer) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "answer-button";

                button.textContent =
                    answer.text;

                button.addEventListener(
                    "click",
                    function() {

                        chooseAnswer(
                            button,
                            answer,
                            answers,
                            feedback
                        );

                    }
                );

                answers.appendChild(
                    button
                );

            }
        );

        box.appendChild(
            answers
        );

        storyArea.appendChild(
            box
        );

        storyArea.appendChild(
            feedback
        );

        setTimeout(
            function() {

                speak(
                    step.question
                );

            },
            300
        );

        nextButton.classList.add(
            "hidden"
        );

    }

    /* =================================================
       النهاية
    ================================================= */

    else if (
        step.type === "final"
    ) {

        const final =
            document.createElement(
                "div"
            );

        final.className =
            "final-message";

        final.innerHTML = `

            <div class="final-icon">
                🌟
            </div>

            <div class="final-title">
                ${step.title}
            </div>

            <div class="final-text">
                ${step.text}
            </div>

        `;

        storyArea.appendChild(
            final
        );

        setTimeout(
            function() {

                speak(
                    step.text
                );

            },
            300
        );

        nextButton.classList.remove(
            "hidden"
        );

        nextButton.textContent =
            "إعادة القصة ↻";

    }

    updatePreviousButton();

}

/* =====================================================
   تشغيل صوت الفيديو عند أول تفاعل
===================================================== */

document.addEventListener(
    "pointerdown",
    function() {

        if (
            currentVideo &&
            !currentVideo.paused
        ) {

            enableVideoSound();

        }

    },
    {
        passive: true
    }
);

/* =====================================================
   اختيار الإجابة
===================================================== */

function chooseAnswer(
    clickedButton,
    answer,
    answersContainer,
    feedback
) {

    if (
        selectedAnswer
    ) {

        return;

    }

    if (
        answer.correct
    ) {

        selectedAnswer =
            true;

        const buttons =
            answersContainer.querySelectorAll(
                ".answer-button"
            );

        buttons.forEach(
            function(button) {

                button.disabled =
                    true;

            }
        );

        clickedButton.classList.add(
            "correct"
        );

        feedback.className =
            "feedback show good";

        feedback.textContent =
            "🌟 "
            +
            answer.feedback;

        speak(
            answer.feedback
        );

        setTimeout(
            function() {

                nextButton.classList.remove(
                    "hidden"
                );

                nextButton.textContent =
                    "التالي ›";

            },
            900
        );

    }

    else {

        clickedButton.classList.add(
            "wrong"
        );

        feedback.className =
            "feedback show bad";

        feedback.textContent =
            "💡 "
            +
            answer.feedback;

        speak(
            answer.feedback
        );

        setTimeout(
            function() {

                clickedButton.classList.remove(
                    "wrong"
                );

            },
            1300
        );

    }

}

/* =====================================================
   التالي
===================================================== */

nextButton.addEventListener(
    "click",
    function() {

        stopSpeech();

        if (
            steps[currentStep].type ===
            "final"
        ) {

            currentStep =
                0;

            selectedAnswer =
                false;

            renderStep();

            return;

        }

        if (
            steps[currentStep].type ===
            "question"
        ) {

            if (
                !selectedAnswer
            ) {

                return;

            }

        }

        if (
            currentStep <
            steps.length - 1
        ) {

            currentStep++;

            selectedAnswer =
                false;

            renderStep();

        }

    }
);

/* =====================================================
   السابق
===================================================== */

previousButton.addEventListener(
    "click",
    function() {

        stopSpeech();

        if (
            currentStep > 0
        ) {

            currentStep--;

            selectedAnswer =
                false;

            renderStep();

        }

        else {

            window.location.href =
                "games.html";

        }

    }
);

/* =====================================================
   القائمة
===================================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const dropdownMenu =
    document.getElementById(
        "dropdownMenu"
    );

menuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        dropdownMenu.classList.toggle(
            "show"
        );

    }
);

document.addEventListener(
    "pointerdown",
    function(event) {

        if (
            !event.target.closest(
                ".menu-wrapper"
            )
        ) {

            dropdownMenu.classList.remove(
                "show"
            );

        }

    }
);

/* =====================================================
   تشغيل الصفحة
===================================================== */

async function initializePage() {

    await loadChildInterest();

    renderStep();

}

initializePage();

</script>
