<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفيق - الأشكال - السيارات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Tajawal", "Cairo", Arial, sans-serif;
            background: #e4f2ff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =====================================
           الصفحة الرئيسية
        ===================================== */

        .page {
            position: relative;

            width: 1024px;
            height: 1366px;

            background-color: #e4f2ff;

            /* خلفية السيارات */
            background-image: url("images/car4.jpeg");

            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

            overflow: hidden;

            transform-origin: center center;
        }

        /* =====================================
           زر السابق
        ===================================== */

        .previous-button {
            position: absolute;
            top: 35px;
            left: 35px;

            width: 75px;
            height: 75px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.95);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;
            color: #4b6b88;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);

            z-index: 50;
        }

        .previous-button:active {
            transform: scale(0.94);
        }

        /* =====================================
           زر القائمة
        ===================================== */

        .menu-button {
            position: absolute;
            top: 35px;
            right: 35px;

            width: 75px;
            height: 75px;

            border: none;
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.95);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;
            color: #4b6b88;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);

            z-index: 50;
        }

        .menu-button:active {
            transform: scale(0.94);
        }

        /* =====================================
           القائمة الجانبية
        ===================================== */

        .side-menu {
            position: absolute;

            top: 0;
            right: -360px;

            width: 360px;
            height: 100%;

            background: rgba(255, 255, 255, 0.98);

            box-shadow: -8px 0 25px rgba(0, 0, 0, 0.15);

            padding-top: 150px;

            transition: right 0.3s ease;

            z-index: 100;
        }

        .side-menu.open {
            right: 0;
        }

        .side-menu a {
            display: block;

            padding: 25px 35px;

            color: #4b6b88;

            text-decoration: none;

            font-size: 28px;
            font-weight: bold;

            border-bottom: 1px solid #edf2f7;

            text-align: right;
        }

        .side-menu a:active {
            background: #e4f2ff;
        }

        /* =====================================
           العنوان
        ===================================== */

        .title-row {
            position: absolute;

            top: 145px;
            left: 0;
            right: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 20px;

            z-index: 10;
        }

        .title {
            font-size: 58px;
            font-weight: 900;

            color: #38556f;

            margin: 0;

            text-align: center;
        }

        /* =====================================
           زر الصوت
        ===================================== */

        .sound-button {
            width: 75px;
            height: 75px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.95);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .sound-button:active {
            transform: scale(0.94);
        }

        /* =====================================
           منطقة الشكل
        ===================================== */

        .shape-area {
            position: absolute;

            top: 310px;
            left: 0;
            right: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 5;
        }

        .shape-image {
            width: 420px;
            height: 420px;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;
        }

        /* =====================================
           منطقة الطفل
        ===================================== */

        .child-area {
            position: absolute;

            bottom: 50px;
            left: 0;
            right: 0;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            z-index: 5;
        }

        .child-image {
            width: 600px;
            height: 600px;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;
        }

        /* =====================================
           زر التالي
        ===================================== */

        .next-button {
            position: absolute;

            bottom: 50px;
            left: 50%;

            transform: translateX(-50%);

            width: 330px;
            height: 100px;

            border: none;
            border-radius: 35px;

            background: #ffffff;

            color: #4b6b88;

            font-size: 38px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.13);

            z-index: 20;
        }

        .next-button:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* =====================================
           Responsive
        ===================================== */

        @media (max-width: 1024px),
               (max-height: 1366px) {

            .page {
                --page-scale: min(
                    calc(100vw / 1024),
                    calc(100vh / 1366)
                );

                transform: scale(var(--page-scale));
            }
        }
    </style>
</head>

<body>

    <!-- =====================================
         الصفحة
    ====================================== -->

    <div class="page" id="page">

        <!-- زر السابق -->
        <button
            class="previous-button"
            id="previousButton"
            aria-label="السابق">
            ←
        </button>


        <!-- زر القائمة -->
        <button
            class="menu-button"
            id="menuButton"
            aria-label="القائمة">
            ☰
        </button>


        <!-- =====================================
             القائمة الجانبية
        ====================================== -->

        <div class="side-menu" id="sideMenu">

            <a href="home.html">
                🏠 الرئيسية
            </a>

            <a href="reports.html">
                📊 تقريري
            </a>

            <a href="profile.html">
                👤 الملف الشخصي
            </a>

        </div>


        <!-- =====================================
             العنوان
        ====================================== -->

        <div class="title-row">

            <h1 class="title">
                دائرة
            </h1>

            <button
                class="sound-button"
                id="soundButton"
                aria-label="استمع">
                🔊
            </button>

        </div>


        <!-- =====================================
             الدائرة
        ====================================== -->

        <div class="shape-area">

            <img
                id="shapeImage"
                class="shape-image"
                src="images/adaa.png"
                alt="دائرة">

        </div>


        <!-- =====================================
             طفل السيارات
        ====================================== -->

        <div class="child-area">

            <img
                id="childImage"
                class="child-image"
                src="images/ad3.png"
                alt="رفيق">

        </div>


        <!-- =====================================
             زر التالي
        ====================================== -->

        <button
            class="next-button"
            id="nextButton">

            التالي →

        </button>

    </div>


    <script>

        /* =====================================================
           Rafiq - Shapes Cars

           صفحة السيارات ثابتة

           الخلفية:
           images/car4.jpeg

           الطفل:
           images/ad3.png

           الدائرة:
           images/adaa.png
        ===================================================== */


        document.addEventListener(
            "DOMContentLoaded",
            () => {


                /* =================================================
                   زر الصوت
                ================================================= */

                const soundButton =
                    document.getElementById(
                        "soundButton"
                    );


                soundButton.addEventListener(
                    "click",
                    () => {

                        if (
                            "speechSynthesis"
                            in window
                        ) {

                            speechSynthesis.cancel();


                            const speech =
                                new SpeechSynthesisUtterance(
                                    "دائرة"
                                );


                            speech.lang =
                                "ar-SA";


                            speech.rate =
                                0.82;


                            speech.pitch =
                                1.05;


                            speechSynthesis.speak(
                                speech
                            );

                        }

                    }
                );


                /* =================================================
                   تشغيل الصوت تلقائيًا
                ================================================= */

                setTimeout(
                    () => {

                        if (
                            "speechSynthesis"
                            in window
                        ) {

                            const speech =
                                new SpeechSynthesisUtterance(
                                    "دائرة"
                                );


                            speech.lang =
                                "ar-SA";


                            speech.rate =
                                0.82;


                            speech.pitch =
                                1.05;


                            speechSynthesis.speak(
                                speech
                            );

                        }

                    },
                    500
                );


                /* =================================================
                   زر التالي
                ================================================= */

                document
                    .getElementById(
                        "nextButton"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            window.location.href =
                                "shapes-activities.html";

                        }
                    );


                /* =================================================
                   زر السابق
                ================================================= */

                document
                    .getElementById(
                        "previousButton"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            window.location.href =
                                "games.html";

                        }
                    );


                /* =================================================
                   القائمة
                ================================================= */

                const menuButton =
                    document.getElementById(
                        "menuButton"
                    );


                const sideMenu =
                    document.getElementById(
                        "sideMenu"
                    );


                menuButton.addEventListener(
                    "click",
                    (event) => {

                        event.stopPropagation();

                        sideMenu.classList.toggle(
                            "open"
                        );

                    }
                );


                /* =================================================
                   إغلاق القائمة عند الضغط خارجها
                ================================================= */

                document.addEventListener(
                    "click",
                    (event) => {

                        if (
                            sideMenu.classList.contains(
                                "open"
                            ) &&
                            !sideMenu.contains(
                                event.target
                            ) &&
                            event.target !== menuButton
                        ) {

                            sideMenu.classList.remove(
                                "open"
                            );

                        }

                    }
                );

            }
        );

    </script>

</body>
</html>
