<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    font-family:
        "Tajawal",
        "Cairo",
        Arial,
        sans-serif;

    color: #555;

    overflow: hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    position: absolute;

    width: 1024px;

    height: 1366px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(var(--page-scale, 1));

    transform-origin: center center;

    overflow: hidden;

    padding:
        90px 20px 70px;

    background-image:
        url("images/spao.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

.previous-button {

    position: absolute;

    top: 35px;

    left: 35px;

    width: 155px;

    height: 60px;

    border: none;

    border-radius: 20px;

    background: #e4f2ff;

    color: #555;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px
        rgba(60,80,100,0.18);

    z-index: 1001;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.previous-button:hover {

    transform:
        translateY(-3px);

    background: #d8edfc;
}

.previous-button:active {

    transform:
        scale(0.96);
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button {

    position: absolute;

    top: 35px;

    right: 35px;

    width: 65px;

    height: 65px;

    border: none;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.94);

    color: #555;

    font-size: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 7px 20px
        rgba(60,80,100,0.18);

    z-index: 1000;
}


/* =====================================================
   SIDE MENU
===================================================== */

.side-menu {

    position: absolute;

    top: 115px;

    right: 35px;

    width: 245px;

    padding: 18px;

    border-radius: 28px;

    background:
        rgba(255,255,255,0.96);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 12px 35px
        rgba(60,80,100,0.20);

    transform:
        translateX(130%);

    opacity: 0;

    pointer-events: none;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;

    z-index: 999;
}

.side-menu.show {

    transform:
        translateX(0);

    opacity: 1;

    pointer-events: auto;
}

.side-menu button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background: transparent;

    color: #555;

    font-family: inherit;

    font-size: 20px;

    font-weight: 700;

    text-align: right;

    padding: 0 18px;

    margin-bottom: 8px;

    cursor: pointer;
}

.side-menu button:hover {

    background: #e4f2ff;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    width: 984px;

    height: 100%;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    z-index: 10;
}


/* =====================================================
   FEELING CARD
===================================================== */

.feeling-card {

    width: 650px;

    min-height: 125px;

    background: #e4f2ff;

    border-radius: 32px;

    padding:
        20px 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    box-shadow:
        0 10px 25px
        rgba(70,100,120,0.17);

    animation:
        cardFloat 4s ease-in-out infinite;

    margin-top: 80px;
}

@keyframes cardFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-5px);
    }
}


/* =====================================================
   ROBOT
===================================================== */

.robot {

    font-size: 66px;

    display: inline-block;

    animation:
        robotBounce 2.4s
        ease-in-out infinite;
}

@keyframes robotBounce {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    30% {
        transform:
            translateY(-7px)
            rotate(-4deg);
    }

    60% {
        transform:
            translateY(0)
            rotate(4deg);
    }
}


/* =====================================================
   FEELING TEXT
===================================================== */

.feeling-text {

    text-align: right;
}

.feeling-text h2 {

    margin:
        0 0 7px;

    font-size: 29px;

    font-weight: 900;

    color: #555;
}

.feeling-text p {

    margin: 0;

    font-size: 20px;

    font-weight: 600;

    color: #777;
}


/* =====================================================
   DRAWING TOOLS AREA
===================================================== */

.drawing-tools-area {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    margin-top: 25px;

    position: relative;

    z-index: 30;

/* =====================================================
   COLORS
===================================================== */

.colors {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 14px;

    flex-wrap: wrap;

    position: relative;

    z-index: 30;

    width: 100%;
}

.color {

    width: 52px;

    height: 52px;

    border: 5px solid #fff;

    cursor: pointer;

    box-shadow:
        0 5px 12px
        rgba(50,70,90,0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.color:hover {

    transform:
        scale(1.12);
}

.color:active {

    transform:
        scale(0.95);
}

.color.active {

    transform:
        scale(1.18);

        0 0 0 4px
        rgba(120,150,170,0.28),

/* =====================================================

    font-weight: 800;

    box-shadow:

        rgba(70,90,110,0.15);

        transform 0.2s ease,

}

.tool-button:hover {

        translateY(-3px);
}

.tool-button:active {

}

.tool-button.active {

    box-shadow:
        0 0 0 4px
        rgba(120,150,170,0.25),
        0 8px 18px

}


/* =====================================================
   SEND BUTTON
===================================================== */

.send-button {

    margin-top: 22px;

    background: #e4f2ff;

    font-weight: 900;

    box-shadow:
        0 8px 20px
        rgba(70,90,110,0.17);

        transform 0.2s ease,
        box-shadow 0.2s ease;

    position: relative;

    z-index: 30;
}

.send-button:hover {

}

.send-button:active {

    transform:

}

.send-button:disabled {

    opacity: 0.65;

    cursor: wait;
}


/* =====================================================
   ROCKET STAGE
===================================================== */

.rocket-stage {

    position: relative;

    width: 900px;

    height: 547px;

    margin-top: 120px;

    overflow: visible;

    z-index: 10;
}


/* =====================================================
   ROCKET IMAGE
===================================================== */

.space-image {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

    z-index: 1;
}


/* =====================================================
   CANVAS
===================================================== */

#drawingCanvas {

    position: absolute;

    z-index: 2;

    left: 17%;

    top: 9%;

    width: 66%;

    height: 65%;

    background: transparent;

    border: none;

    border-radius: 0;

    box-shadow: none;

    touch-action: none;

    cursor: crosshair;
}


/* =====================================================
   RESULT POPUP
===================================================== */

.success-message {

        rgba(35,55,75,0.35);

}

.success-box {

        0 12px 35px

@keyframes popupIn {

.success-emoji {

.success-box h2 {

        10px 0;

.success-box p {

/* =====================================================
   RESULT BUTTONS
===================================================== */

.result-buttons {

.result-buttons button {

.result-buttons button:active {

    transform:
        scale(0.96);

/* =====================================================
   PAGE SCALING
===================================================== */

</style>

</head>


<body>

<script>

/* =====================================================
   PAGE SCALING
===================================================== */

function resizePage() {

    const page =
        document.querySelector(".page");

    const baseWidth =
        1024;

    const baseHeight =
        1366;

    const screenWidth =
        window.innerWidth;

    const screenHeight =
        window.innerHeight;

    const scaleX =
        screenWidth / baseWidth;

    const scaleY =
        screenHeight / baseHeight;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    page.style.setProperty(
        "--page-scale",
        scale
    );

}

resizePage();

window.addEventListener(
    "resize",
    resizePage
);

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizePage,
            300
        );

    }
);


/* =====================================================
   MENU
===================================================== */

document
    .getElementById("menuButton")
    .addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            document
                .getElementById("sideMenu")
                .classList
                .toggle("show");

        }
    );


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "sideMenu"
            );

        const button =
            document.getElementById(
                "menuButton"
            );


        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "drawingCanvas"
    );

const ctx =
    canvas.getContext("2d");


let currentColor =
    "#f4d35e";

let isDrawing =
    false;

let isErasing =
    false;

let hasDrawing =
    false;

let lastX =
    0;

let lastY =
    0;


/* =====================================================
   CANVAS SETUP
===================================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const oldCanvas =
        document.createElement(
            "canvas"
        );


    oldCanvas.width =
        canvas.width;

    oldCanvas.height =
        canvas.height;


    if (
        canvas.width > 0 &&
        canvas.height > 0
    ) {

        oldCanvas
            .getContext("2d")
            .drawImage(
                canvas,
                0,
                0
            );

    }


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.round(
            rect.width * dpr
        );

    canvas.height =
        Math.round(
            rect.height * dpr
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.lineWidth =
        8;


    if (
        oldCanvas.width > 0 &&
        oldCanvas.height > 0
    ) {

        ctx.drawImage(
            oldCanvas,
            0,
            0,
            oldCanvas.width,
            oldCanvas.height,
            0,
            0,
            rect.width,
            rect.height
        );

    }

}


resizeCanvas();


window.addEventListener(
    "resize",
    function() {

        if (!isDrawing) {

            resizeCanvas();

        }

    }
);


/* =====================================================
   GET POSITION
===================================================== */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };

}


/* =====================================================
   START DRAWING
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        isDrawing =
            true;

        hasDrawing =
            true;

        canvas.setPointerCapture(
            event.pointerId
        );

        const pos =
            getPosition(event);

        lastX =
            pos.x;

        lastY =
            pos.y;

        if (!isErasing) {

            ctx.globalCompositeOperation =
                "source-over";

            ctx.fillStyle =
                currentColor;

            ctx.beginPath();

            ctx.arc(
                pos.x,
                pos.y,
                4,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }
);


/* =====================================================
   DRAW
===================================================== */

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!isDrawing) {

            return;

        }

        event.preventDefault();

        const pos =
            getPosition(event);


        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            pos.x,
            pos.y
        );


        if (isErasing) {

            ctx.globalCompositeOperation =
                "destination-out";

            ctx.lineWidth =
                35;

        }

        else {

            ctx.globalCompositeOperation =
                "source-over";

            ctx.strokeStyle =
                currentColor;

            ctx.lineWidth =
                8;

        }


        ctx.stroke();


        lastX =
            pos.x;

        lastY =
            pos.y;


        ctx.globalCompositeOperation =
            "source-over";

    }
);


/* =====================================================
   STOP DRAWING
===================================================== */

function stopDrawing() {

    isDrawing =
        false;

    ctx.globalCompositeOperation =
        "source-over";

}


canvas.addEventListener(
    "pointerup",
    stopDrawing
);

canvas.addEventListener(
    "pointercancel",
    stopDrawing
);

canvas.addEventListener(
    "pointerleave",
    stopDrawing
);


/* =====================================================
   COLORS
===================================================== */

const colorButtons =
    document.querySelectorAll(
        ".color"
    );


colorButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                currentColor =
                    this.dataset.color;

                isErasing =
                    false;


                document
                    .getElementById(
                        "eraserButton"
                    )
                    .classList
                    .remove(
                        "active"
                    );


                colorButtons.forEach(
                    item => {

                        item.classList
                            .remove(
                                "active"
                            );

                    }
                );


                this.classList.add(
                    "active"
                );

            }
        );

    }
);


/* =====================================================
   ERASER
===================================================== */

document
    .getElementById(
        "eraserButton"
    )
    .addEventListener(
        "click",
        function() {

            isErasing =
                !isErasing;

            this.classList.toggle(
                "active",
                isErasing
            );

        }
    );


/* =====================================================
   CLEAR ALL
===================================================== */

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        function() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            hasDrawing =
                false;

            isErasing =
                false;


            document
                .getElementById(
                    "eraserButton"
                )
                .classList
                .remove(
                    "active"
                );


            localStorage.removeItem(
                "rafiqFeelingDrawing"
            );

        }
    );


/* =====================================================
   NORMALIZE AI TEXT
===================================================== */

function normalizeAIText(value) {

    return String(value || "")
        .toLowerCase()
        .trim();

}


/* =====================================================
   EXTRACT AI FIELD
===================================================== */

function extractAIField(
    aiText,
    fieldName
) {

    const regex =
        new RegExp(
            fieldName +
            "\\s*[:=]\\s*[\"']?([^\\n\\r,\"'}]+)",
            "i"
        );

    const match =
        String(aiText).match(
            regex
        );


    if (!match) {

        return "";

    }


    return match[1].trim();

}


/* =====================================================
   GET AI TEXT SAFELY
===================================================== */

function getAIText(result) {

    if (
        result &&
        typeof result.ai_result === "object" &&
        result.ai_result !== null
    ) {

        try {

            return JSON.stringify(
                result.ai_result
            );

        }

        catch (error) {

            return "";

        }

    }


    return String(
        result?.ai_result || ""
    ).trim();

}


/* =====================================================
   NORMALIZE MOUTH
===================================================== */

function normalizeMouth(mouth) {

    const text =
        normalizeAIText(mouth);


    /* =================================================
       مهم:
       نفحص "غير مبتسم" أولًا
       حتى لا تحتوي كلمة "مبتسم"
       وتُحسب بالخطأ على أنها سعيدة
    ================================================= */

    if (
        text.includes("غير مبتسم") ||
        text.includes("غير مبتسمة") ||
        text.includes("ليس مبتسم") ||
        text.includes("ليست مبتسمة") ||
        text.includes("not smiling") ||
        text.includes("not smile")
    ) {

        return "not-happy";

    }


    /* =================================================
       غير موجود
    ================================================= */

    if (
        text.includes("غير موجود") ||
        text.includes("غير موجودة") ||
        text.includes("لا يوجد فم") ||
        text.includes("لا توجد فم") ||
        text.includes("no mouth") ||
        text.includes("missing")
    ) {

        return "missing";

    }


    /* =================================================
       غير واضح
    ================================================= */

    if (
        text.includes("غير واضح") ||
        text.includes("غير واضحة") ||
        text.includes("غير محدد") ||
        text.includes("unclear")
    ) {

        return "unclear";

    }


    /* =================================================
       حزين
    ================================================= */

    if (
        text.includes("حزين") ||
        text.includes("حزينة") ||
        text.includes("حزن") ||
        text.includes("sad")
    ) {

        return "sad";

    }


    /* =================================================
       محايد
    ================================================= */

    if (
        text.includes("محايد") ||
        text.includes("محايدة") ||
        text.includes("neutral") ||
        text.includes("مستقيم") ||
        text.includes("straight")
    ) {

        return "neutral";

    }


    /* =================================================
       مبتسم
    ================================================= */

    if (
        text.includes("مبتسم") ||
        text.includes("مبتسمة") ||
        text.includes("ابتسامة") ||
        text.includes("smiling") ||
        text.includes("smile")
    ) {

        return "happy";

    }


    return "";

}


/* =====================================================
   SHOW AI RESULT
===================================================== */

function showAIResult(result) {

    console.log(
        "🤖 Rafiq AI RESULT:",
        result
    );


    /* =================================================
       AI TEXT
    ================================================= */

    const aiText =
        getAIText(
            result
        );


    console.log(
        "🤖 AI TEXT:",
        aiText
    );


    /* =================================================
       MATCHES TARGET
    ================================================= */

    let matchesTarget = false;


    /*
       نأخذ القيمة المباشرة من الـBackend أولًا
    */

    if (
        typeof result.matches_target ===
        "boolean"
    ) {

        matchesTarget =
            result.matches_target;

    }


    /*
       إذا لم توجد، نقرأها من ai_result
    */

    else {

        const match =
            aiText.match(
                /matches_target\s*[:=]\s*["']?(true|false)/i
            );


        if (match) {

            matchesTarget =
                match[1].toLowerCase()
                === "true";

        }

    }


    /* =================================================
       CONFIDENCE
    ================================================= */

    let confidence = 0;


    /*
       القيمة المباشرة من Backend
    */

    if (
        result.confidence !== undefined &&
        result.confidence !== null
    ) {

        confidence =
            Number(
                result.confidence
            ) || 0;

    }


    /*
       fallback من ai_result
    */

    else {

        const confidenceMatch =
            aiText.match(
                /confidence\s*[:=]\s*["']?(\d+(?:\.\d+)?)/i
            );


        if (confidenceMatch) {

            confidence =
                Number(
                    confidenceMatch[1]
                ) || 0;

        }

    }


    /* =================================================
       MOUTH
    ================================================= */

    let mouth = "";


    /*
       نأخذ mouth المباشر أولًا
    */

    if (
        result.mouth !== undefined &&
        result.mouth !== null
    ) {

        mouth =
            String(
                result.mouth
            ).trim();

    }


    /*
       fallback إلى ai_result
    */

    if (!mouth) {

        mouth =
            extractAIField(
                aiText,
                "mouth"
            );

    }


    /* =================================================
       EMOTION
    ================================================= */

    let emotion = "";


    if (
        result.emotion !== undefined &&
        result.emotion !== null
    ) {

        emotion =
            String(
                result.emotion
            ).trim();

    }


    if (!emotion) {

        emotion =
            extractAIField(
                aiText,
                "emotion"
            );

    }


    /* =================================================
       FEEDBACK
    ================================================= */

    let feedback = "";


    if (
        result.feedback !== undefined &&
        result.feedback !== null
    ) {

        feedback =
            String(
                result.feedback
            ).trim();

    }


    if (!feedback) {

        feedback =
            extractAIField(
                aiText,
                "feedback"
            );

    }


    /* =================================================
       MESSAGE
    ================================================= */

    const backendMessage =
        String(
            result.message || ""
        ).trim();


    /*
       إذا لم يوجد feedback ولكن توجد رسالة
       من الـBackend نستخدمها كاحتياط
    */

    if (
        !feedback &&
        backendMessage
    ) {

        feedback =
            backendMessage;

    }


    /* =================================================
       تحديد نوع الفم
    ================================================= */

    let mouthType =
        normalizeMouth(
            mouth
        );


    /* =================================================
       إذا mouth غير موجود:
       نستخدم emotion كاحتياط
    ================================================= */

    if (!mouthType) {

        const normalizedEmotion =
            normalizeAIText(
                emotion
            );


        if (
            normalizedEmotion.includes("سعيد") ||
            normalizedEmotion.includes("سعيدة") ||
            normalizedEmotion.includes("happy")
        ) {

            mouthType =
                "happy";

        }

        else if (
            normalizedEmotion.includes("حزين") ||
            normalizedEmotion.includes("حزينة") ||
            normalizedEmotion.includes("sad")
        ) {

            mouthType =
                "sad";

        }

        else if (
            normalizedEmotion.includes("غاضب") ||
            normalizedEmotion.includes("غاضبة") ||
            normalizedEmotion.includes("angry")
        ) {

            mouthType =
                "angry";

        }

        else if (
            normalizedEmotion.includes("محايد") ||
            normalizedEmotion.includes("محايدة") ||
            normalizedEmotion.includes("neutral")
        ) {

            mouthType =
                "neutral";

        }

    }


    /* =================================================
       إذا كان الـBackend أعاد رسالة نجاح واضحة
       ولم توجد معلومات منظمة، نستخدمها كاحتياط أخير
    ================================================= */

    if (
        !mouthType &&
        !aiText &&
        backendMessage
    ) {

        const normalizedMessage =
            normalizeAIText(
                backendMessage
            );


        if (
            normalizedMessage.includes("وجهًا مبتسمًا") ||
            normalizedMessage.includes("وجه مبتسم") ||
            normalizedMessage.includes("وجه سعيد") ||
            normalizedMessage.includes("ابتسامة جميلة") ||
            normalizedMessage.includes("سعيد") ||
            normalizedMessage.includes("مبتسم")
        ) {

            mouthType =
                "happy";

        }

        else if (
            normalizedMessage.includes("وجه حزين") ||
            normalizedMessage.includes("حزين")
        ) {

            mouthType =
                "sad";

        }

    }


    console.log(
        "👄 MOUTH:",
        mouth
    );

    console.log(
        "👄 MOUTH TYPE:",
        mouthType
    );

    console.log(
        "😊 EMOTION:",
        emotion
    );

    console.log(
        "🎯 MATCHES:",
        matchesTarget
    );

    console.log(
        "📊 CONFIDENCE:",
        confidence
    );


    /* =================================================
       عناصر POPUP
    ================================================= */

    const resultEmoji =
        document.getElementById(
            "resultEmoji"
        );


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    const successText =
        document.getElementById(
            "successText"
        );


    /* =================================================
       😊 سعيد
    ================================================= */

    if (
        (
            mouthType === "happy"
        ) &&
        (
            matchesTarget ||
            confidence >= 70 ||
            normalizeAIText(emotion)
                .includes("سعيد") ||
            normalizeAIText(emotion)
                .includes("happy")
        )
    ) {

        resultEmoji.textContent =
            "🌈😊⭐";


        resultTitle.textContent =
            "أحسنت!";


        successText.textContent =
            feedback ||
            "أحسنت! أرى وجهًا مبتسمًا سعيدًا 😊";

    }


    /* =================================================
       😢 حزين
    ================================================= */

    else if (
        mouthType === "sad"
    ) {

        resultEmoji.textContent =
            "😢💙";


        resultTitle.textContent =
            "هذا وجه حزين";


        successText.textContent =
            "هذا وجه حزين 😢 حاول أن تجعل الفم منحنيًا إلى الأعلى ليصبح الوجه سعيدًا 😊";

    }


    /* =================================================
       😠 غاضب
    ================================================= */

    else if (
        mouthType === "angry"
    ) {

        resultEmoji.textContent =
            "😠💙";


        resultTitle.textContent =
            "هذا وجه غاضب";


        successText.textContent =
            "هذا وجه غاضب 😠 حاول رسم وجه سعيد بابتسامة واضحة 😊";

    }


    /* =================================================
       😐 محايد
    ================================================= */

    else if (
        mouthType === "neutral"
    ) {

        resultEmoji.textContent =
            "😐🎨";


        resultTitle.textContent =
            "هذا وجه محايد";


        successText.textContent =
            "هذا وجه محايد 🙂 حاول أن تجعل الفم منحنيًا إلى الأعلى ليصبح الوجه سعيدًا 😊";

    }


    /* =================================================
       🚫 غير مبتسم
    ================================================= */

    else if (
        mouthType === "not-happy"
    ) {

        resultEmoji.textContent =
            "🎨💙";


        resultTitle.textContent =
            "حاول مرة أخرى";


        successText.textContent =
            "هذا ليس وجهًا سعيدًا 😊 حاول أن تجعل الفم مبتسمًا ومنحنيًا إلى الأعلى.";

    }


    /* =================================================
       🚫 لا يوجد فم
    ================================================= */

    else if (
        mouthType === "missing"
    ) {

        resultEmoji.textContent =
            "🎨😊";


        resultTitle.textContent =
            "حاول مرة أخرى";


        successText.textContent =
            "رائع! حاول إضافة فم مبتسم إلى الوجه 😊";

    }


    /* =================================================
       ❓ غير واضح
    ================================================= */

    else if (
        mouthType === "unclear"
    ) {

        resultEmoji.textContent =
            "🎨💙";


        resultTitle.textContent =
            "محاولة جميلة!";


        successText.textContent =
            "محاولة جميلة! حاول رسم الفم بشكل أوضح واجعل الابتسامة تتجه إلى الأعلى 😊";

    }


    /* =================================================
       FALLBACK
    ================================================= */

    else {

        if (
            matchesTarget &&
            confidence >= 70
        ) {

            resultEmoji.textContent =
                "🌈😊⭐";


            resultTitle.textContent =
                "أحسنت!";


            successText.textContent =
                feedback ||
                "أحسنت! رسمت وجهًا سعيدًا 😊";

        }

        else {

            resultEmoji.textContent =
                "🎨💙";


            resultTitle.textContent =
                "محاولة جميلة!";


            successText.textContent =
                feedback ||
                "حاول رسم وجه سعيد بشكل أوضح، مع ابتسامة واضحة 😊";

        }

    }


    /* =================================================
       إظهار POPUP
    ================================================= */

    document
        .getElementById(
            "successMessage"
        )
        .style.display =
        "flex";


    /* =================================================
       نطق النتيجة
    ================================================= */

    speakResult(
        resultTitle.textContent +
        ". " +
        successText.textContent
    );

}


/* =====================================================
   SPEECH RESULT
===================================================== */

function speakResult(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "ar-SA";


    speech.rate =
        0.78;


    speech.pitch =
        1.05;


    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}

/* =====================================================
   SEND DRAWING TO AI
===================================================== */

document
    .getElementById(
        "sendButton"
    )
    .addEventListener(
        "click",
        async function() {

            if (!hasDrawing) {

                alert(
                    "🎨 ارسم شيئًا أولًا!"
                );

                return;

            }


            const sendButton =
                this;


            const imageData =
                canvas.toDataURL(
                    "image/png"
                );


            localStorage.setItem(
                "rafiqFeelingDrawing",
                imageData
            );


            sendButton.disabled =
                true;


            sendButton.textContent =
                "🤖 رفيق يحلل رسمتك...";


            try {

                const response =
                    await fetch(
                        "https://rafiq-ai-jgtp.onrender.com/analyze-drawing",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    image:
                                        imageData,

                                    emotion:
                                        "السعادة"

                                })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP Error " +
                        response.status
                    );

                }


                const result =
                    await response.json();


                console.log(
                    "🤖 Rafiq Backend Result:",
                    result
                );


                if (
                    result.success
                ) {

                    showAIResult(
                        result
                    );

                }

                else {

                    alert(
                        "😔 حدث خطأ أثناء تحليل الرسمة.\n\n" +
                        (
                            result.message ||
                            "حاولي مرة أخرى."
                        )
                    );

                }

            }


            catch (error) {

                console.error(
                    "❌ AI Connection Error:",
                    error
                );


                alert(
                    "❌ لم نتمكن من الاتصال بخادم رفيق.\n\n" +
                    "حاولي مرة أخرى بعد قليل."
                );

            }


            sendButton.disabled =
                false;


            sendButton.textContent =
                "📤 إرسال رسمتي";

        }
    );

</script>
